   detailed and needs the full pane width, so it sits under the text. */
html[data-layout="m3"] .proj-split,
html[data-layout="m3"] .proj-split.is-cols,
html[data-layout="m3"] .proj-tabs-stage { grid-template-columns: minmax(0, 1fr); gap: 24px; }
html[data-layout="m3"] .proj-tabs-side { max-width: var(--m3-measure); }
html[data-layout="m3"] .proj-split.is-cols .proj-split-text { position: static; }
@container pane (min-width: 840px) {
  html[data-layout="m3"] .proj-split.is-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  html[data-layout="m3"] .proj-split.is-cols .proj-split-text { position: sticky; top: calc(var(--m3-bar-h) + 24px); }
}
html[data-layout="m3"] .proj-tabs { margin: 0 0 24px; }
html[data-layout="m3"] .proj-tabs-side > p:last-of-type { margin-bottom: 24px; }

/* Segmented buttons: 40 high, Label Large; rounder than before, short of a pill */
html[data-layout="m3"] .proj-tabs-seg { padding: 4px; gap: 4px; border-radius: var(--m3-r-md); margin-bottom: 24px; }
html[data-layout="m3"] .proj-tabs-seg button {
  min-height: 32px; padding: 6px 16px; border-radius: var(--m3-r-sm);
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}

/* ── Next project + footer ── */
html[data-layout="m3"] .next-proj { padding: 48px var(--pad-x); }
@media (hover: hover) {
  html[data-layout="m3"] .next-proj:hover { padding-left: calc(var(--pad-x) + 16px); }
}
html[data-layout="m3"] .next-label {             /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; margin-bottom: 8px;
}
html[data-layout="m3"] .next-title,
html[data-layout="m3"] .next-arrow {             /* Headline Small -> Medium */
  font-size: 24px; line-height: 32px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] footer {                  /* Label Medium */
  padding: 24px var(--pad-x);
  font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px;
}
@media (min-width: 840px) {
  html[data-layout="m3"] .next-proj { padding-top: 64px; padding-bottom: 64px; }
  html[data-layout="m3"] .next-title,
  html[data-layout="m3"] .next-arrow { font-size: 28px; line-height: 36px; }
}

/* ═══ M3 layout - the rest of the site ═══════════════════════════════════
   Same rules as the project page, carried to Home, Work, About, Resume and
   the case-study components the other projects use. */

/* Base tokens: anything without its own role below falls back to Body
   Large instead of the old 14.4px single size */
html[data-layout="m3"] { --fs-base: 16px; --ls-base: .03125em; }

/* ── Home hero: open on the page (no container), text on the margin ruler ── */
html[data-layout="m3"] .hero {
  min-height: 0; justify-content: flex-end;
  padding: calc(var(--m3-bar-h) + 24px) var(--pad-x) 0;
}
/* the glow (50vw circle) used to run past the hero's bottom and get sliced
   by its overflow; with no box to hide the cut, keep it inside the hero -
   it fades out on its own before its edge */
html[data-layout="m3"] .hero::before { max-height: 90%; }
html[data-layout="m3"] .hero-eyebrow {           /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  margin-bottom: 16px;
}
html[data-layout="m3"] .hero-title {             /* Display Small -> Medium -> Large */
  font-size: 36px; line-height: 44px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .hero-title em { font-weight: var(--fw-regular); }
html[data-layout="m3"] .hero-bottom { margin-top: 32px; gap: 24px; }
html[data-layout="m3"] .hero-desc {              /* Body Large */
  font-size: 16px; line-height: 24px; letter-spacing: .5px; max-width: var(--m3-measure);
}
html[data-layout="m3"] .hero-meta {              /* Body Medium */
  font-size: 14px; line-height: 20px; letter-spacing: .25px; gap: 4px;
}
html[data-layout="m3"] .hero-meta b {            /* Label Medium */
  font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px;
}
@media (min-width: 600px) {
  html[data-layout="m3"] .hero { min-height: 70svh; }
}
@media (min-width: 840px) {
  html[data-layout="m3"] .hero-title { font-size: 45px; line-height: 52px; }
}
@media (min-width: 1200px) {
  html[data-layout="m3"] .hero-title { font-size: 57px; line-height: 64px; letter-spacing: -.25px; }
}

/* ── Sections + section heads: Headline titles, spacing instead of rules ── */
html[data-layout="m3"] .section { padding: var(--m3-section-gap) var(--pad-x); }
/* Work and About open straight under the bar (their inline 9rem tops) */
html[data-layout="m3"] .page > .section:first-child,
html[data-layout="m3"] .page > .about:first-child { padding-top: calc(var(--m3-bar-h) + 24px) !important; }
html[data-layout="m3"] .section-head {
  border-top: 0; padding: 0; margin-bottom: var(--m3-head-gap);
  flex-wrap: wrap; gap: 8px 24px;
}
html[data-layout="m3"] .section-head h2 {       /* Headline Small -> Medium */
  font-family: var(--ff-display); font-size: 24px; line-height: 32px;
  font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .section-head h2::before { content: none; }
html[data-layout="m3"] .section-head .right {   /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
@media (min-width: 840px) {
  html[data-layout="m3"] .section-head h2 { font-size: 28px; line-height: 36px; }
}

/* ── Work grid ── */
html[data-layout="m3"] .work-grid { gap: var(--m3-gap); }
html[data-layout="m3"] .work-grid.polaroid { row-gap: 32px; }
html[data-layout="m3"] .polaroid .tile-img { border-radius: var(--m3-r-lg); }
html[data-layout="m3"] .polaroid .tile-meta { padding-top: 12px; gap: 4px 16px; flex-wrap: wrap; }
html[data-layout="m3"] .tile-name {             /* Title Large */
  font-size: 22px; line-height: 28px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .tile-tags {             /* Body Medium */
  font-size: 14px; line-height: 20px; letter-spacing: .25px;
}
@media (min-width: 600px) {
  html[data-layout="m3"] .work-grid.polaroid { row-gap: 48px; }
}
/* Index list (Work page): 56-high list items, state layer on hover */
html[data-layout="m3"] .index .tile { min-height: 56px; border-radius: 0; }
html[data-layout="m3"] .index .tile .tile-name { /* Title Medium */
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .index .tile .tile-num,
html[data-layout="m3"] .index .tile .tile-tags,
html[data-layout="m3"] .index .tile .tile-year { font-size: 14px; line-height: 20px; letter-spacing: .25px; }
@media (hover: hover) {
  html[data-layout="m3"] .index .tile:hover {
    padding: 0 16px; border-radius: var(--m3-r-md);
    background: color-mix(in oklab, var(--ink) 8%, transparent);
  }
}

/* Filter chips: 32 high, 8 corners, Label Large; selected = tonal fill */
html[data-layout="m3"] .filters { gap: 8px; margin-bottom: 32px; }
html[data-layout="m3"] .filter-chip {
  min-height: 32px; padding: 6px 16px; border-radius: var(--m3-r-sm);
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
html[data-layout="m3"] .filter-chip:hover { background: color-mix(in oklab, var(--ink) 8%, transparent); }
html[data-layout="m3"] .filter-chip.active {
  background: color-mix(in oklab, var(--accent) 18%, transparent);
  color: var(--ink); border-color: transparent;
}
html[data-layout="m3"] .filter-sort { font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; }

/* ── About: photo 5 / text 7 of the 12-column grid from expanded up ── */
html[data-layout="m3"] .about {
  padding: var(--m3-section-gap) var(--pad-x); border-top: 0;
  gap: 32px var(--m3-gap);
}
/* the frame (its yellow ground) spans the full column; its height stays what
   the 3:4 frame had - 4/3 of the column, capped at 540 - and the illustration
   keeps its size, centred */
html[data-layout="m3"] .about-photo-col { container-type: inline-size; }
html[data-layout="m3"] .about .signal-tv {
  border-radius: var(--m3-r-lg);
  width: 100%; aspect-ratio: auto;
  height: min(var(--signal-tv-max-h), calc(100cqw * 4 / 3));
}
html[data-layout="m3"] .about-eyebrow {         /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  margin-bottom: 16px;
}
html[data-layout="m3"] .about-headline {        /* Headline Small -> Medium -> Large */
  font-size: 24px; line-height: 32px; font-weight: var(--fw-regular); letter-spacing: 0;
  margin-bottom: 24px;
}
html[data-layout="m3"] .about .about-subhead {  /* Title Large */
  font-size: 22px; line-height: 28px; letter-spacing: 0;
  max-width: var(--m3-measure); margin: -8px 0 24px;
}
html[data-layout="m3"] .about p {               /* Body Large */
  font-size: 16px; line-height: 24px; letter-spacing: .5px;
  margin-bottom: 16px; max-width: var(--m3-measure);
}
html[data-layout="m3"] .cap-list { margin-top: 32px; padding-top: 0; border-top: 0; gap: 8px; }
html[data-layout="m3"] .cap-grid { gap: 8px; }
html[data-layout="m3"] .cap-pill {              /* assist chip */
  min-height: 32px; padding: 6px 16px; border-radius: var(--m3-r-sm);
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
@media (min-width: 840px) {

  html[data-layout="m3"] .about-text { grid-column: span 7; }
  html[data-layout="m3"] .about-headline { font-size: 28px; line-height: 36px; }
}
@media (min-width: 1200px) {
  html[data-layout="m3"] .about-headline { font-size: 32px; line-height: 40px; }

/* ── Contact ── */
html[data-layout="m3"] .contact { padding: calc(var(--m3-section-gap) * 1.5) var(--pad-x); border-top: 0; }
/* the glow (a 60vw circle, centred) outgrew the section on wide screens and
   was sliced flat by its overflow; capped to the section it fades out
   before either edge */
html[data-layout="m3"] .contact::before { max-height: 100%; }
html[data-layout="m3"] .contact-eyebrow {       /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  margin-bottom: 16px;
}
html[data-layout="m3"] .contact-headline {      /* Headline Large -> Display Small */
  font-size: 32px; line-height: 40px; letter-spacing: 0; margin-bottom: 32px;
}
html[data-layout="m3"] .contact-headline em { font-weight: var(--fw-regular); }
html[data-layout="m3"] .contact-btn {           /* medium filled button, 56 high */
  min-height: 56px; padding: 16px 24px;
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .contact-links { gap: 8px 24px; margin-top: 32px; }
html[data-layout="m3"] .contact-links a { font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; }
@media (min-width: 840px) {
  html[data-layout="m3"] .contact-headline { font-size: 36px; line-height: 44px; }

/* ── Resume: boxed head like the heroes, content capped like the pane ── */
html[data-layout="m3"] .resume {
  padding: calc(var(--m3-bar-h) + 24px) var(--pad-x) var(--m3-section-gap);
  max-width: calc(var(--m3-content-max) + 2 * var(--pad-x));
}
html[data-layout="m3"] .resume-head {
  gap: 24px var(--m3-gap); padding: 24px; border-bottom: 0;
  margin-bottom: var(--m3-section-gap);
  background: var(--surface); border-radius: var(--m3-r-lg);
}
html[data-layout="m3"] .resume-head h1 {        /* Display Small -> Medium */
  font-size: 36px; line-height: 44px; font-weight: var(--fw-regular); letter-spacing: 0;
  margin-bottom: 16px;
}
html[data-layout="m3"] .resume-head .role {     /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  margin-bottom: 16px;
}
html[data-layout="m3"] .resume-head p { font-size: 16px; line-height: 24px; letter-spacing: .5px; max-width: var(--m3-measure); }
html[data-layout="m3"] .resume-contact { font-size: 14px; line-height: 20px; letter-spacing: .25px; gap: 8px; }
html[data-layout="m3"] .resume-contact .k { font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px; }
html[data-layout="m3"] .resume-block { margin-bottom: var(--m3-section-gap); }
html[data-layout="m3"] .resume-block h2 {       /* Headline Small -> Medium */
  font-family: var(--ff-display); font-size: 24px; line-height: 32px;
  font-weight: var(--fw-regular); letter-spacing: 0;
  padding: 0; border-bottom: 0; margin-bottom: var(--m3-head-gap);
}
html[data-layout="m3"] .resume-block h2::before { content: none; }
html[data-layout="m3"] .resume-row { gap: 8px var(--m3-gap); padding: 16px 0; }
html[data-layout="m3"] .resume-row .when {     /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; padding-top: 2px;
}
html[data-layout="m3"] .resume-row .where {    /* Label Medium */
  font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px; margin-top: 4px;
}
html[data-layout="m3"] .resume-row .role-name { /* Title Medium */
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .resume-row .org { font-size: 14px; line-height: 20px; letter-spacing: .25px; margin-bottom: 8px; }
html[data-layout="m3"] .resume-row ul { gap: 4px; }
html[data-layout="m3"] .resume-row li { font-size: 14px; line-height: 20px; letter-spacing: .25px; max-width: var(--m3-measure); }
@media (min-width: 600px) {
  html[data-layout="m3"] .resume-head { padding: 40px; }
  html[data-layout="m3"] .resume-row { padding: 24px 0; }
}
@media (min-width: 840px) {
  html[data-layout="m3"] .resume-head { padding: 56px; }
  html[data-layout="m3"] .resume-head h1 { font-size: 45px; line-height: 52px; }
  html[data-layout="m3"] .resume-block h2 { font-size: 28px; line-height: 36px; }
  html[data-layout="m3"] .resume-row { grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); }
}

/* ── Case-study components the other projects use ── */

/* corners: media 12, big frames 16, small controls/tags 8 */
html[data-layout="m3"] .lightbox img,
html[data-layout="m3"] .lightbox video,
html[data-layout="m3"] .proj-mosaic-item.is-fill img,
html[data-layout="m3"] .proj-parallax-item video,
html[data-layout="m3"] .proj-parallax-item .proj-media-placeholder,
html[data-layout="m3"] .proj-split-media video,
html[data-layout="m3"] .proj-side-gallery-frame img,
html[data-layout="m3"] .problem-img img,
html[data-layout="m3"] .problem-placeholder,
html[data-layout="m3"] .proj-beforeafter img,
html[data-layout="m3"] .proj-placeholder,
html[data-layout="m3"] .proj-hot-pop,
html[data-layout="m3"] .proj-marquee-frame,
html[data-layout="m3"] #proj-grid-demo,
html[data-layout="m3"] .fv { border-radius: var(--m3-r-md); }
html[data-layout="m3"] .proj-hero-ph,
html[data-layout="m3"] dialog.fv-dialog { border-radius: var(--m3-r-lg); }
html[data-layout="m3"] .proj-side-gallery-btn,
html[data-layout="m3"] .ba-tag { border-radius: var(--m3-r-sm); }
/* the hairline-gap grids read as one rounded block */
html[data-layout="m3"] .outcome-grid,
html[data-layout="m3"] .proj-compare-grid { border-radius: var(--m3-r-md); overflow: hidden; }

/* type roles */
html[data-layout="m3"] .proj-media-row-label,
html[data-layout="m3"] .proj-hot-title,
html[data-layout="m3"] .proj-placeholder-tag,
html[data-layout="m3"] .outcome-label,
html[data-layout="m3"] .proj-side-gallery-btn { /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
html[data-layout="m3"] .ba-tag,
html[data-layout="m3"] .proj-compare-cell-tag,
html[data-layout="m3"] .proj-compare-col-label { /* Label Medium */
  font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px;
}
html[data-layout="m3"] .problem-row-label,
html[data-layout="m3"] .proj-compare-col-title,
html[data-layout="m3"] .proj-compare-corner-title { /* Title Medium */
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .proj-compare-dim {      /* Title Small */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
html[data-layout="m3"] .proj-hot-pop p,
html[data-layout="m3"] .proj-compare-cell,
html[data-layout="m3"] .proj-placeholder p {    /* Body Medium */
  font-size: 14px; line-height: 20px; letter-spacing: .25px;
}
html[data-layout="m3"] .proj-list li,
html[data-layout="m3"] .proj-compare-note {     /* Body Large */
  font-size: 16px; line-height: 24px; letter-spacing: .5px;
}
html[data-layout="m3"] .proj-list,
html[data-layout="m3"] .proj-compare-note,
html[data-layout="m3"] .proj-placeholder { max-width: var(--m3-measure); }
html[data-layout="m3"] .outcome-num {           /* Headline Medium */
  font-size: 28px; line-height: 36px; letter-spacing: 0; font-weight: var(--fw-regular);
}

/* spacing: groups by space, not rules */
html[data-layout="m3"] .proj-list { gap: 12px; margin: 8px 0 24px; }
html[data-layout="m3"] .proj-subsection {
  margin: var(--m3-section-gap) 0 0; padding-top: 0; border-top: 0;
  scroll-margin-top: calc(var(--m3-bar-h) + 24px);
}
html[data-layout="m3"] .proj-parallax-header {
  border-bottom: 0; padding-bottom: 0; margin-bottom: var(--m3-head-gap);
}
html[data-layout="m3"] .problem-row { gap: 16px var(--m3-gap); padding: 24px 0; }
html[data-layout="m3"] .proj-media-rows { gap: 32px; margin: 24px 0 0; }
html[data-layout="m3"] .proj-media-row-label { margin-bottom: 8px; }
html[data-layout="m3"] .proj-media-row-grid,
html[data-layout="m3"] .problem-row-imgs,
html[data-layout="m3"] .proj-ba-pair,
html[data-layout="m3"] .proj-mosaic { gap: var(--m3-gap); }
html[data-layout="m3"] .proj-mosaic-side { gap: var(--m3-gap); }
html[data-layout="m3"] .proj-ba-pairs { gap: 32px; margin: 24px 0 0; }
html[data-layout="m3"] .proj-compare { margin: 24px 0 0; max-width: none; }

/* ── Section rhythm - one set of gaps for every case study (Spark's):
   title -> content 24, text -> text 16, anything -> block 24, image ->
   caption 8. Components drop their own built-in margins; margins collapse,
   so text before/after a block still lands on 24. Only flow containers are
   listed - inside grids (splits, mosaics) the grid gap does the spacing. */
html[data-layout="m3"] :is(.proj-section, .proj-split-text, .proj-parallax-text, .proj-subsection, .proj-tabs-side) > :is(p, .proj-list) {
  margin: 0 0 16px;
}
html[data-layout="m3"] :is(.proj-section, .proj-split-text, .proj-parallax-text, .proj-subsection) > :is(
  .proj-media, .proj-mosaic, .proj-media-rows, .proj-concepts, .proj-ba-pairs, .proj-beforeafter, .proj-compare,
  .problem-rows, .fv-wrap, .proj-proto-slot, .proj-split, .proj-cards, .outcome-grid,
  .proj-placeholder, .grid-demo-figure) {
  margin: 24px 0;
}
/* right under a title, the title's own gap (16 compact / 24 up) is the space */
html[data-layout="m3"] :is(.proj-section, .proj-split-text, .proj-parallax-text) > .proj-section-head + * { margin-top: 0; }
/* the strip keeps its hover headroom inside, so its visible edge lands on 24 */
html[data-layout="m3"] .proj-section > .proj-marquee { margin: calc(24px - var(--mq-lift)) 0; }
/* after text, the paragraph's 16 wins the margin collapse - a negative top
   margin nets the pair back to 24 - 22 headroom */
html[data-layout="m3"] .proj-section > :is(p, .proj-list) + .proj-marquee { margin-top: calc(8px - var(--mq-lift)); }
/* a strip that ends its section: take its 22 headroom off the section gap */
html[data-layout="m3"] .proj-section:has(> .proj-marquee:last-child) { margin-bottom: calc(var(--m3-section-gap) - 22px); }
/* a title riding inside the tabs stage: the stage's own 24 gap is the space */
html[data-layout="m3"] .proj-tabs-stage > .proj-section-head { margin-bottom: calc(var(--m3-head-gap) - 24px); }
/* groups of media inside a block */
html[data-layout="m3"] .proj-parallax-media,
html[data-layout="m3"] .proj-media-rows,
html[data-layout="m3"] .proj-ba-pairs { gap: 24px; }
html[data-layout="m3"] .proj-parallax-item { gap: 8px; }

/* columns follow the pane, like the splits: stacked by default */
html[data-layout="m3"] .proj-section.is-parallax .proj-parallax-row { grid-template-columns: minmax(0, 1fr); gap: 24px; }
html[data-layout="m3"] .proj-section.is-parallax .proj-parallax-text { position: static; }
html[data-layout="m3"] .problem-row,
html[data-layout="m3"] .problem-row-imgs,
html[data-layout="m3"] .proj-ba-pair,
html[data-layout="m3"] .proj-media-row-grid,
html[data-layout="m3"] .proj-compare-grid { grid-template-columns: minmax(0, 1fr); }
html[data-layout="m3"] .problem-row-imgs[data-count="1"] .problem-placeholder,
html[data-layout="m3"] .problem-row-imgs[data-count="1"] .problem-img { grid-column: auto; }
html[data-layout="m3"] .proj-compare-corner,
html[data-layout="m3"] .proj-compare-colhead { display: none; }
html[data-layout="m3"] .proj-compare-cell-tag { display: block; }
html[data-layout="m3"] .proj-compare-dim { display: block; }
@container pane (min-width: 600px) {
  html[data-layout="m3"] .problem-row-imgs,
  html[data-layout="m3"] .proj-ba-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html[data-layout="m3"] .problem-row-imgs[data-count="1"] .problem-placeholder,
  html[data-layout="m3"] .problem-row-imgs[data-count="1"] .problem-img { grid-column: 2; }
  html[data-layout="m3"] .proj-media-row-grid { grid-template-columns: repeat(var(--mr-cols, 3), minmax(0, 1fr)); }
  html[data-layout="m3"] .proj-compare-grid { grid-template-columns: minmax(0, .8fr) minmax(0, 1fr) minmax(0, 1fr); }
  html[data-layout="m3"] .proj-compare-corner,
  html[data-layout="m3"] .proj-compare-colhead { display: flex; }
  html[data-layout="m3"] .proj-compare-cell-tag { display: none; }
  html[data-layout="m3"] .proj-compare-dim { display: flex; }
}
@container pane (min-width: 840px) {
  html[data-layout="m3"] .problem-row { grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); }
  html[data-layout="m3"] .proj-section.is-parallax:not(:has(.proj-marquee)) .proj-parallax-row {
    grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;
  }
  html[data-layout="m3"] .proj-section.is-parallax:not(:has(.proj-marquee)) .proj-parallax-text { position: sticky; }
}

/* ── Flow viewer: a filled card holding an inset canvas ──
   Same vocabulary as the rest of the case study - no hairlines between
   rows, sentence-case type roles instead of tracked uppercase, segmented
   buttons and filter chips for the switches, standard icon/text buttons
   for the tools. The canvas sits a layer down (ground), so the diagram
   reads as content inside the card rather than the card itself. */
html[data-layout="m3"] .fv { background: var(--surface); }
html[data-layout="m3"] .fv-placeholder-slot { border-radius: var(--m3-r-md); }
html[data-layout="m3"] .fv-bar,
html[data-layout="m3"] .fv-subbar,
html[data-layout="m3"] .fv-foot { border: 0; background: transparent; gap: 8px 16px; }
html[data-layout="m3"] .fv-bar { padding: 12px 16px 8px; }
html[data-layout="m3"] .fv-subbar { padding: 4px 8px 8px 16px; min-height: 56px; }
html[data-layout="m3"] .fv-mark {               /* Title Medium */
  font-family: var(--ff-body); font-size: 16px; line-height: 24px; font-weight: var(--fw-medium);
  letter-spacing: .15px; text-transform: none; color: var(--ink);
  border: 0; padding: 0; white-space: nowrap;
}
/* Admin / Widgets: segmented buttons, as in the case-study tabs */
html[data-layout="m3"] .fv-tabs {
  gap: 4px; padding: 4px; border-radius: var(--m3-r-md);
  background: var(--ground);
}
html[data-layout="m3"] .fv-tab {                /* Label Large */
  min-height: 32px; padding: 6px 16px; border: 0; border-radius: var(--m3-r-sm);
  font-family: var(--ff-body); font-size: 14px; line-height: 20px; font-weight: var(--fw-medium);
  letter-spacing: .1px; text-transform: none; color: var(--ink-dim); white-space: nowrap;
}
html[data-layout="m3"] .fv-tab:hover { color: var(--ink); background: color-mix(in oklab, var(--ink) 8%, transparent); }
html[data-layout="m3"] .fv-tab[aria-selected="true"] {
  background: var(--accent-sky-bg); color: var(--accent-sky);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent-sky) 45%, transparent);
}
/* breadcrumb: Body Medium trail, Title Medium for where you are */
html[data-layout="m3"] .fv-crumb { gap: 4px 8px; font-size: 14px; line-height: 20px; letter-spacing: .25px; }
html[data-layout="m3"] .fv-crumb button { color: var(--ink-dim); }
html[data-layout="m3"] .fv-crumb .fv-cur {
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px; gap: 8px;
}
html[data-layout="m3"] .fv-crumb .fv-sub {      /* Body Small */
  font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--muted);
}
/* component switcher: filter chips, selected = tonal fill */
html[data-layout="m3"] .fv-pills { gap: 8px; }
html[data-layout="m3"] .fv-pill {
  min-height: 32px; padding: 6px 12px; gap: 8px;
  border: 1px solid var(--rim); border-radius: var(--m3-r-sm);
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  color: var(--ink-dim);
}
html[data-layout="m3"] .fv-pill:hover { color: var(--ink); border-color: var(--rim); background: color-mix(in oklab, var(--ink) 8%, transparent); }
html[data-layout="m3"] .fv-pill[aria-current="true"] {
  background: color-mix(in oklab, var(--accent) 18%, transparent);
  color: var(--ink); border-color: transparent;
}
html[data-layout="m3"] .fv-pill i { width: 8px; height: 8px; }
html[data-layout="m3"] .fv-select {
  min-height: 40px; padding: 8px 12px;
  font-size: 14px; line-height: 20px; letter-spacing: .25px;
  background: var(--ground); border: 0; border-radius: var(--m3-r-sm);
}
/* tools: standard icon + text buttons - no outline, a state layer on hover */
html[data-layout="m3"] .fv-tools { gap: 4px; }
html[data-layout="m3"] .fv-tool,
html[data-layout="m3"] .fv-tool.is-wide {       /* Label Large */
  min-width: 40px; height: 40px; border: 0; border-radius: var(--m3-r-sm);
  background: transparent; color: var(--ink-dim);
  font-family: var(--ff-body); font-size: 14px; line-height: 20px; font-weight: var(--fw-medium);
  letter-spacing: .1px; text-transform: none;
}
html[data-layout="m3"] .fv-tool.is-wide { padding: 0 12px; }
html[data-layout="m3"] .fv-tool:not(.is-wide) { font-size: 18px; }
html[data-layout="m3"] .fv-tool:hover { color: var(--ink); background: color-mix(in oklab, var(--ink) 8%, transparent); }
html[data-layout="m3"] .fv-zoomval {
  font-family: var(--ff-body); font-size: 14px; line-height: 20px; font-weight: var(--fw-medium);
  letter-spacing: .1px; color: var(--muted); min-width: 48px;
}
html[data-layout="m3"] .fv-divider { height: 24px; margin: 0 4px; background: var(--rim); }

/* the canvas: inset a layer down, its corners following the card's */
html[data-layout="m3"] .fv-stage {
  margin: 0 8px 8px; border-radius: var(--m3-r-sm);
  background: var(--ground);
}
html[data-layout="m3"] .fv-armed {              /* Label Medium, assist chip */
  right: 16px; top: 16px; padding: 6px 12px;
  font-family: var(--ff-body); font-size: 12px; line-height: 16px; font-weight: var(--fw-medium);
  letter-spacing: .5px; text-transform: none;
  border: 0; border-radius: var(--m3-r-sm);
  background: color-mix(in oklab, var(--surface) 92%, transparent);
}
html[data-layout="m3"] .fv-edge-label { font-family: var(--ff-body); letter-spacing: .2px; }
/* sentence case; the tracking matches ZONE_LABEL_TRACKING, which sizes its knockout */
html[data-layout="m3"] .fv-zone-label { letter-spacing: .05em; text-transform: none; }

/* system map */
html[data-layout="m3"] .fv-map { padding: 24px; }
html[data-layout="m3"] .fv-map-head { gap: 16px 24px; margin-bottom: 24px; }
html[data-layout="m3"] .fv-map-head h3 {        /* Title Large */
  font-size: 22px; line-height: 28px; font-weight: var(--fw-regular); letter-spacing: 0; margin: 0 0 4px;
}
html[data-layout="m3"] .fv-map-head p {         /* Body Medium */
  font-size: 14px; line-height: 20px; letter-spacing: .25px; max-width: var(--m3-measure);
}
html[data-layout="m3"] .fv-map-stats { gap: 24px; }
html[data-layout="m3"] .fv-stat b {             /* Headline Small */
  font-size: 24px; line-height: 32px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .fv-stat span,
html[data-layout="m3"] .fv-entry .fv-tag,
html[data-layout="m3"] .fv-badge,
html[data-layout="m3"] .fv-legend .fv-ttl,
html[data-layout="m3"] .fv-steps .fv-step-kind { /* Label Small */
  font-family: var(--ff-body); font-size: 11px; line-height: 16px; font-weight: var(--fw-medium);
  letter-spacing: .5px; text-transform: none;
}
html[data-layout="m3"] .fv-entry .fv-tag,
html[data-layout="m3"] .fv-badge {
  padding: 2px 8px; border: 0; border-radius: var(--m3-r-sm);
  background: color-mix(in oklab, var(--ink) 8%, transparent); color: var(--ink-dim);
}
html[data-layout="m3"] .fv-entry {              /* Title Medium */
  gap: 12px; padding: 12px 16px; margin-bottom: 0;
  border-width: 1px; border-radius: var(--m3-r-md); background: var(--surface);

/* ── Article versioning diagram: tonal containers instead of outlines ──
   Lanes become filled surfaces, states sit a tone up inside them, the
   start is a filled container and the decision a tonal one - colour by
   fill, not by dashed strokes. Highlights take the blue bar, not tomato:
   red reads as an error state here. Type moves onto the
   body face, sentence weights. */
html[data-layout="m3"] .uf-lane-rect { fill: var(--surface); stroke: none; opacity: 1; rx: 16px; }
html[data-layout="m3"] .uf-lane-title {
  font-family: var(--ff-body); font-weight: var(--fw-medium); letter-spacing: 0; fill: var(--ink);
}

  font-family: var(--ff-body); font-weight: var(--fw-regular); letter-spacing: .25px; fill: var(--muted);
}

  fill: color-mix(in oklab, var(--ink) 7%, var(--surface)); stroke: none; rx: 12px;
}
html[data-layout="m3"] .uf-node-title {
  font-family: var(--ff-body); font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .uf-node-status {
  font-family: var(--ff-body); font-weight: var(--fw-regular); letter-spacing: .25px;
}
html[data-layout="m3"] .uf-decision { fill: color-mix(in oklab, var(--bar-indigo-surface) 24%, transparent); stroke: none; }
html[data-layout="m3"] .uf-decision-label { font-weight: var(--fw-medium); }

html[data-layout="m3"] .uf-arrow-head { fill: var(--muted); }
html[data-layout="m3"] .uf-dot.uf-on { fill: var(--bar-indigo); }
html[data-layout="m3"] .uf-flow-label-box { fill: var(--surface); stroke: none; rx: 8px; }

/* ── Help Center flows: the same tonal vocabulary, under a segmented control ──
   Admin access reuses the .uf-* diagram classes directly. Widget flows
   come out of the layout engine in tonal mode (.hcf-*), drawn on a
   surface lane like the versioning diagram's lanes. */
/* lanes and boxes are tones of the live page wash (--atmos, set by the
   Project scroll effect), not flat --surface: they shift hue with the
   page and always sit a visible step off it */
.hcf {
  margin: 8px 0 12px;
  --hcf-ground: var(--atmos, var(--ground));
  --hcf-lane: color-mix(in oklab, var(--ink) 6%, var(--hcf-ground));
  --hcf-tone: color-mix(in oklab, var(--ink) 12%, var(--hcf-ground));
}
.hcf .uf-svg .uf-lane-rect { fill: var(--hcf-lane); stroke: none; opacity: 1; }
.hcf .uf-svg .uf-node { fill: var(--hcf-tone); stroke: none; }
.hcf .hcf-tabs { margin: 0 0 16px; display: inline-flex; }
.hcf-figure { margin: 0; }
.hcf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.hcf-frame {
  background: var(--hcf-lane); border-radius: 16px;
  padding: 16px; overflow-x: auto;
}
.hcf-canvas svg { display: block; margin: 0 auto; max-width: none; }
.hcf-node, .hcf-dialog { fill: var(--hcf-tone); }
.hcf-dialog { stroke: var(--bar-indigo-surface); stroke-width: 1.25; }
.hcf-entry { fill: var(--bar-indigo-surface); }
.hcf-decision { fill: color-mix(in oklab, var(--bar-indigo-surface) 24%, transparent); }
.hcf-state { fill: var(--hcf-ground); }
.hcf .fv-node-label { fill: var(--ink); }
.hcf .fv-node-label.hcf-label-entry,
.hcf .fv-node-label.hcf-label-terminal { fill: #FFFFFF; }
.hcf .fv-node-label.hcf-label-state { fill: var(--ink-dim); font-weight: var(--fw-regular); }
.hcf .fv-edge-path { stroke: var(--muted); stroke-width: 1.5; }
.hcf .fv-arrow { fill: var(--muted); }
.hcf .fv-edge-label { fill: var(--muted); font-family: var(--ff-body); letter-spacing: .2px; }
.hcf .fv-edge-label-bg { fill: var(--hcf-lane); }

const KIND_LABEL = {
  entry:    'Component',
  screen:   'Screen / surface',
  action:   'User action',
  decision: 'Decision',
  dialog:   'Dialog',
  state:    'System state / rule',
  terminal: 'Start / end'
};

/* ============================================================
   TYPE - resolved from the live stack, never declared here.
   The layout measures real text, so this has to be the same
   font the diagram actually renders in.
   ============================================================ */
let _fontCache = null;
function resolveFonts() {
  if (_fontCache) return _fontCache;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  probe.style.fontFamily = 'var(--ff-body)';
  const body = getComputedStyle(probe).fontFamily;
  probe.style.fontFamily = 'var(--ff-mono)';
  const mono = getComputedStyle(probe).fontFamily;
  probe.remove();
  _fontCache = { node: '500 12px ' + body, mono: '500 10px ' + mono, edge: '500 9.5px ' + mono };
  return _fontCache;
}
function resetFonts() { _fontCache = null; }

/* ============================================================
   LAYERED FLOW LAYOUT (Sugiyama-lite)
   rank -> order -> position -> route. Direction-agnostic: computed
   in (u = along flow, v = across), mapped to x/y last.
   ============================================================ */
const _measureCanvas = document.createElement('canvas');
const _ctx = _measureCanvas.getContext('2d');
function measure(text, font) { _ctx.font = font; return _ctx.measureText(text).width; }
/* .fv-zone-label renders at `500 10px var(--ff-mono)` with letter-spacing:.05em,
   and canvas measureText ignores letter-spacing entirely. Add the tracking back
   or the knockout chip is sized too small and the label overhangs it - invisible
   with a narrow face, obvious with a wide one. .05em at the label's 10px = .5px
   per character, counting the trailing space CSS also adds. */
const ZONE_LABEL_TRACKING = 0.05 * 10;
function measureZoneLabel(text, font) {
  return measure(text, font) + String(text).length * ZONE_LABEL_TRACKING;
}

function wrapText(text, maxWidth, font) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (measure(test, font) <= maxWidth || !line) line = test;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

const LAYOUT_DEFAULTS = {
  direction: 'TB',
  nodeWidth: 164,
  rankGap: 54,     // between ranks (along flow)
  crossGap: 24,    // between siblings (across flow)
  minHeight: 44,
  lineHeight: 15,
  padY: 26
};

function layoutFlow(rawNodes, rawEdges, opts) {
  const O = Object.assign({}, LAYOUT_DEFAULTS, opts || {});
  if (!O.font) O.font = resolveFonts().node;
  const TB = O.direction === 'TB';

  /* ---------- 1. nodes ---------- */
  const nodes = rawNodes.map(([id, label, kind, zone]) => {
    const innerW = O.nodeWidth - 26;
    const lines = wrapText(label, innerW, O.font);
    let h = Math.max(O.minHeight, lines.length * O.lineHeight + O.padY);
    if (kind === 'decision') h += 12;
    if (kind === 'terminal') h = Math.max(40, lines.length * O.lineHeight + 20);
    return {
      id, label, kind: kind || 'screen', zone: zone || null,
      lines, w: O.nodeWidth, h,
      x: 0, y: 0, rank: 0, order: 0
    };
  });
  const byId = new Map(nodes.map(n => [n.id, n]));
  const rankExtent  = n => (TB ? n.h : n.w);
  const crossExtent = n => (TB ? n.w : n.h);

  /* ---------- 2. edges ---------- */
  // a 4th element marks a "soft" reference link: drawn, but excluded from
  // ranking so it can't drag a whole sub-tree out of position
  const edges = rawEdges
    .filter(([f, t]) => byId.has(f) && byId.has(t))
    .map(([from, to, label, soft], i) =>
      ({ id: 'e' + i, from, to, label: label || '', soft: !!soft, back: false }));

  const out = new Map(nodes.map(n => [n.id, []]));
  const inn = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => { out.get(e.from).push(e); inn.get(e.to).push(e); });

  // a decision that fans out to N siblings with the same answer only needs
  // that answer written once - keep the middle one, blank the rest
  out.forEach(list => {
    const byLabel = new Map();
    list.forEach(e => {
      if (!e.label) return;
      if (!byLabel.has(e.label)) byLabel.set(e.label, []);
      byLabel.get(e.label).push(e);
    });
    byLabel.forEach(group => {
      if (group.length < 2) return;
      const keep = group[Math.floor((group.length - 1) / 2)];
      group.forEach(e => { if (e !== keep) e.label = ''; });
    });
  });

  /* ---------- 3. back edges ---------- */
  const WHITE = 0, GREY = 1, BLACK = 2;
  const color = new Map(nodes.map(n => [n.id, WHITE]));
  const roots = nodes.filter(n => inn.get(n.id).length === 0).map(n => n.id);
  const seeds = roots.length ? roots : [nodes[0].id];
  const stack = [];
  function dfs(start) {
    stack.length = 0;
    stack.push({ id: start, i: 0 });
    color.set(start, GREY);
    while (stack.length) {
      const fr = stack[stack.length - 1];
      const list = out.get(fr.id);
      if (fr.i < list.length) {
        const e = list[fr.i++];
        const c = color.get(e.to);
        if (c === GREY) e.back = true;
        else if (c === WHITE) { color.set(e.to, GREY); stack.push({ id: e.to, i: 0 }); }
      } else {
        color.set(fr.id, BLACK);
        stack.pop();
      }
    }
  }
  seeds.forEach(id => { if (color.get(id) === WHITE) dfs(id); });
  nodes.forEach(n => { if (color.get(n.id) === WHITE) dfs(n.id); });

  const fwd = edges.filter(e => !e.back && !e.soft);
  const fout = new Map(nodes.map(n => [n.id, []]));
  const finn = new Map(nodes.map(n => [n.id, []]));
  fwd.forEach(e => { fout.get(e.from).push(e); finn.get(e.to).push(e); });

  /* ---------- 4. rank = longest path ---------- */
  const indeg = new Map(nodes.map(n => [n.id, finn.get(n.id).length]));
  const q = nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id);
  const topo = [];
  const seen = new Set();
  while (q.length) {
    const id = q.shift();
    topo.push(id); seen.add(id);
    for (const e of fout.get(id)) {
      indeg.set(e.to, indeg.get(e.to) - 1);
      if (indeg.get(e.to) === 0) q.push(e.to);
    }
  }
  nodes.forEach(n => { if (!seen.has(n.id)) topo.push(n.id); });
  topo.forEach(id => {
    const n = byId.get(id);
    let r = 0;
    for (const e of finn.get(id)) r = Math.max(r, byId.get(e.from).rank + 1);
    n.rank = r;
  });

  const maxRank = Math.max.apply(null, nodes.map(n => n.rank));
  const ranks = Array.from({ length: maxRank + 1 }, () => []);
  nodes.forEach(n => ranks[n.rank].push(n));

  /* ---------- 5. ordering (barycenter) ---------- */
  ranks.forEach(r => r.forEach((n, i) => n.order = i));
  function bary(node, side) {
    const list = side === 'in' ? finn.get(node.id) : fout.get(node.id);
    if (!list.length) return null;
    let s = 0;
    for (const e of list) s += byId.get(side === 'in' ? e.from : e.to).order;
    return s / list.length;
  }
  // optional grouping constraint: keep same-zone nodes in a contiguous band
  const groupIndex = new Map((O.groupOrder || []).map((z, i) => [z, i]));
  const gk = n => (groupIndex.has(n.zone) ? groupIndex.get(n.zone) : -1);

  for (let pass = 0; pass < 10; pass++) {
    const down = pass % 2 === 0;
    const idxs = Array.from({ length: ranks.length }, (_, i) => down ? i : ranks.length - 1 - i);
    for (const ri of idxs) {
      const keyed = ranks[ri].map(n => {
        const b = bary(n, down ? 'in' : 'out');
        return { n, k: b === null ? n.order : b, g: gk(n) };
      });
      keyed.sort((a, b) => (a.g - b.g) || (a.k - b.k) || (a.n.order - b.n.order));
      keyed.forEach((o, i) => o.n.order = i);
      ranks[ri] = keyed.map(o => o.n);
    }
  }

  /* ---------- 6. rank-axis position (u) ---------- */
  let cum = 0;
  ranks.forEach(r => {
    const band = Math.max.apply(null, r.map(rankExtent));
    r.forEach(n => { n.u = cum + (band - rankExtent(n)) / 2; n.band = band; });
    cum += band + O.rankGap;
  });

  /* ---------- 7. cross-axis position (v) ---------- */
  ranks.forEach(r => {
    let v = 0;
    r.forEach(n => { n.v = v; v += crossExtent(n) + O.crossGap; });
  });
  function pack(r) {
    r.sort((a, b) => (gk(a) - gk(b)) || (a._d - b._d));
    let cursor = -Infinity;
    r.forEach(n => {
      let top = n._d - crossExtent(n) / 2;
      if (top < cursor) top = cursor;
      n.v = top;
      cursor = top + crossExtent(n) + O.crossGap;
    });
    const wanted = r.reduce((s, n) => s + n._d, 0) / r.length;
    const actual = r.reduce((s, n) => s + (n.v + crossExtent(n) / 2), 0) / r.length;
    const shift = wanted - actual;
    r.forEach(n => { n.v += shift; });
  }
  for (let iter = 0; iter < 14; iter++) {
    const down = iter % 2 === 0;
    const idxs = Array.from({ length: ranks.length }, (_, i) => down ? i : ranks.length - 1 - i);
    for (const ri of idxs) {
      const r = ranks[ri];
      r.forEach(n => {
        const list = down ? finn.get(n.id) : fout.get(n.id);
        if (!list.length) { n._d = n.v + crossExtent(n) / 2; return; }
        let s = 0;
        for (const e of list) {
          const o = byId.get(down ? e.from : e.to);
          s += o.v + crossExtent(o) / 2;
        }
        n._d = s / list.length;
      });
      pack(r);
    }
  }
  const minV = Math.min.apply(null, nodes.map(n => n.v));
  nodes.forEach(n => { n.v -= minV; });

  /* ---------- 8. map to x/y ---------- */
  nodes.forEach(n => {
    if (TB) { n.x = n.v; n.y = n.u; }
    else    { n.x = n.u; n.y = n.v; }
    n.cx = n.x + n.w / 2;
    n.cy = n.y + n.h / 2;
    n.uc = n.u + rankExtent(n) / 2;
    n.vc = n.v + crossExtent(n) / 2;
  });

  /* ---------- 9. routing ---------- */
  const pt = TB ? ((u, v) => `${v} ${u}`) : ((u, v) => `${u} ${v}`);
  const xy = TB ? ((u, v) => [v, u]) : ((u, v) => [u, v]);

  const outSlots = new Map(), inSlots = new Map();
  edges.forEach(e => {
    if (!outSlots.has(e.from)) outSlots.set(e.from, []);
    if (!inSlots.has(e.to)) inSlots.set(e.to, []);
    outSlots.get(e.from).push(e);
    inSlots.get(e.to).push(e);
  });
  outSlots.forEach(l => l.sort((a, b) => byId.get(a.to).vc - byId.get(b.to).vc));
  inSlots.forEach(l => l.sort((a, b) => byId.get(a.from).vc - byId.get(b.from).vc));

  function anchor(node, list, e, spread) {
    const i = list.indexOf(e), n = list.length;
    if (n === 1) return node.vc;
    const usable = Math.min(crossExtent(node) - 18, (n - 1) * spread);
    return node.vc - usable / 2 + i * (usable / (n - 1));
  }

  const vMax = Math.max.apply(null, nodes.map(n => n.v + crossExtent(n)));

  edges.forEach(e => {
    const s = byId.get(e.from), t = byId.get(e.to);
    const sv = anchor(s, outSlots.get(e.from), e, 13);
    const tv = anchor(t, inSlots.get(e.to), e, 13);
    const span = t.rank - s.rank;

    if (e.back || span <= 0) {
      const su = s.u, tu = t.u + rankExtent(t);
      const side = Math.max(s.v + crossExtent(s), t.v + crossExtent(t)) + 30;
      const dip = Math.min(side, vMax + 30);
      e.path =
        `M ${pt(su, s.vc)} C ${pt(su - 34, s.vc)} ${pt(su - 34, dip)} ${pt((su + tu) / 2, dip)}` +
        ` C ${pt(tu + 34, dip)} ${pt(tu + 34, t.vc)} ${pt(tu, t.vc)}`;
      e.arrow = arrowPoly(xy, tu, t.vc, -1);
      e.labelAt = xy((su + tu) / 2, dip + 11);
      e.dashed = true;
      return;
    }

    const su = s.u + rankExtent(s);
    const tu = t.u;
    const du = tu - su;

    if (span === 1 && Math.abs(sv - tv) < 1.5) {
      e.path = `M ${pt(su, sv)} L ${pt(tu, tv)}`;
    } else if (span === 1) {
      const r = Math.max(2, Math.min(12, Math.abs(tv - sv) / 2, du / 2));
      const mu = su + du / 2;
      const dir = tv > sv ? 1 : -1;
      e.path =
        `M ${pt(su, sv)} L ${pt(mu - r, sv)}` +
        ` Q ${pt(mu, sv)} ${pt(mu, sv + dir * r)}` +
        ` L ${pt(mu, tv - dir * r)}` +
        ` Q ${pt(mu, tv)} ${pt(mu + r, tv)}` +
        ` L ${pt(tu, tv)}`;
    } else {
      const c = Math.min(du * 0.45, 110);
      e.path = `M ${pt(su, sv)} C ${pt(su + c, sv)} ${pt(tu - c, tv)} ${pt(tu, tv)}`;
      e.dashed = true;
    }
    e.arrow = arrowPoly(xy, tu, tv, 1);
    // anchor the label just before the arrowhead so it never sits on a shared trunk
    e.labelAt = span === 1
      ? xy(tu - 15, tv - (TB ? 0 : 8))
      : xy(su + du * 0.3, sv - (TB ? 0 : 8));
  });

  const width  = Math.max.apply(null, nodes.map(n => n.x + n.w));
  const height = Math.max.apply(null, nodes.map(n => n.y + n.h));
  return { nodes, edges, width, height, ranks, byId, direction: O.direction };
}

function arrowPoly(xy, u, v, dir) {
  const tip = xy(u, v);
  const b1  = xy(u - dir * 7.5, v - 3.8);
  const b2  = xy(u - dir * 7.5, v + 3.8);
  return `${tip[0]},${tip[1]} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}`;
}

/* ============================================================
   SHAPES - the type of a step is carried by its silhouette,
   so the diagram survives greyscale and colour-blind viewing.
   ============================================================ */
function shapeFor(n, color, opts) {
  opts = opts || {};
  const { w, h } = n;
  const g = S('g');
  const put = (tag, attrs, style) => {
    const el = S(tag, attrs);
    el.setAttribute('class', 'fv-node-shape');
    if (style) for (const k in style) el.style.setProperty(k, style[k]);
    g.appendChild(el);
    return el;
  };
  /* tonal mode - the Redesign diagram's vocabulary: filled containers,
     no outlines, the entry a filled indigo pill */
  if (opts.tonal) {
    const tone = (tag, attrs, cls) => {
      const el = S(tag, attrs);
      el.setAttribute('class', 'hcf-shape ' + cls);
      g.appendChild(el);
    };
    if (n.kind === 'entry' || n.kind === 'terminal')
      tone('rect', { x: 0, y: 0, width: w, height: h, rx: 12 }, 'hcf-entry');
    else if (n.kind === 'decision') {
      const k = 20;
      tone('polygon', { points: `0,${h / 2} ${k},0 ${w - k},0 ${w},${h / 2} ${w - k},${h} ${k},${h}` }, 'hcf-decision');
    } else if (n.kind === 'state')
      tone('rect', { x: 0, y: 0, width: w, height: h, rx: 8 }, 'hcf-state');
    else if (n.kind === 'dialog')
      tone('rect', { x: 0, y: 0, width: w, height: h, rx: 12 }, 'hcf-dialog');
    else
      tone('rect', { x: 0, y: 0, width: w, height: h, rx: 12 }, 'hcf-node');
    return g;
  }
  switch (n.kind) {
    case 'terminal':
      put('rect', { x: 0, y: 0, width: w, height: h, rx: h / 2, ry: h / 2 },
          { stroke: color, fill: tint(color, 10), 'stroke-width': '1.5' });
      break;
    case 'entry':
      put('rect', { x: 0, y: 0, width: w, height: h, rx: 12 },
          { stroke: color, fill: tint(color, 8), 'stroke-width': '2' });
      break;
    case 'action':
      put('rect', { x: 0, y: 0, width: w, height: h, rx: Math.min(18, h / 2) },
          { stroke: color, fill: 'var(--fv-surface)' });
      break;
    case 'decision': {
      const k = 20;
      put('polygon', { points: `0,${h / 2} ${k},0 ${w - k},0 ${w},${h / 2} ${w - k},${h} ${k},${h}` },
          { stroke: color, fill: 'var(--fv-surface)' });
      break;
    }
    case 'dialog':
      put('rect', { x: 0, y: 0, width: w, height: h, rx: 8 },
          { stroke: color, fill: 'var(--fv-surface)' });
      put('rect', { x: 4, y: 4, width: w - 8, height: h - 8, rx: 5, opacity: .55 },
          { stroke: color, fill: 'none', 'stroke-width': '0.75' });
      break;
    case 'state':
      put('rect', { x: 0, y: 0, width: w, height: h, rx: 8, 'stroke-dasharray': '4 3' },
          { stroke: color, fill: 'var(--fv-surface-alt)' });
      break;
    default:
      put('rect', { x: 0, y: 0, width: w, height: h, rx: 8 },
          { stroke: color, fill: 'var(--fv-surface)' });
  }
  return g;
}

/* ============================================================
   ZONE OUTLINE - staircase polygon over the ranks a zone occupies
   ============================================================ */
function zoneOutlines(members, L, pad) {
  const TB = L.direction === 'TB';
  const byRank = new Map();
  members.forEach(n => {
    if (!byRank.has(n.rank)) byRank.set(n.rank, []);
    byRank.get(n.rank).push(n);
  });
  const ranks = [...byRank.keys()].sort((a, b) => a - b);
  const runs = [];
  let cur = [ranks[0]];
  for (let i = 1; i < ranks.length; i++) {
    if (ranks[i] === ranks[i - 1] + 1) cur.push(ranks[i]);
    else { runs.push(cur); cur = [ranks[i]]; }
  }
  runs.push(cur);
  const P = TB ? ((u, v) => [v, u]) : ((u, v) => [u, v]);
  return runs.map(run => {
    const bands = run.map(r => {
      const m = byRank.get(r);
      const u1 = Math.min.apply(null, m.map(n => TB ? n.y : n.x)) - pad;
      const u2 = Math.max.apply(null, m.map(n => TB ? n.y + n.h : n.x + n.w)) + pad;
      const v1 = Math.min.apply(null, m.map(n => TB ? n.x : n.y)) - pad;
      const v2 = Math.max.apply(null, m.map(n => TB ? n.x + n.w : n.y + n.h)) + pad;
      return { u1, u2, v1, v2 };
    });
    for (let i = 0; i < bands.length - 1; i++) {
      const mid = (bands[i].u2 + bands[i + 1].u1) / 2;
      bands[i].u2 = mid; bands[i + 1].u1 = mid;
    }
    const points = [];
    bands.forEach(b => { points.push(P(b.u1, b.v2)); points.push(P(b.u2, b.v2)); });
    for (let i = bands.length - 1; i >= 0; i--) {
      points.push(P(bands[i].u2, bands[i].v1));
      points.push(P(bands[i].u1, bands[i].v1));
    }
    const rects = bands.map(b => {
      const a = P(b.u1, b.v1), c = P(b.u2, b.v2);
      return { x1: Math.min(a[0], c[0]), y1: Math.min(a[1], c[1]),
               x2: Math.max(a[0], c[0]), y2: Math.max(a[1], c[1]) };
    });
    return { points, bands: rects, head: P(bands[0].u1, bands[0].v1) };
  });
}

/* ============================================================
   DIAGRAM RENDERER
   ============================================================ */
function drawEdgeEl(e, opts) {
  opts = opts || {};
  const g = S('g', { class: 'fv-edge' });
  g.dataset.from = e.from;
  g.dataset.to = e.to;
  g.appendChild(S('path', { class: 'fv-edge-path' + (e.dashed ? ' is-dashed' : ''), d: e.path }));
  if (e.arrow) g.appendChild(S('polygon', { class: 'fv-arrow', points: e.arrow }));
  if (e.label && !opts.hideLabels) {
    const [lx, ly] = e.labelAt;
    const tw = measure(e.label, resolveFonts().edge) + 8;
    g.appendChild(S('rect', { class: 'fv-edge-label-bg', x: lx - tw / 2, y: ly - 8, width: tw, height: 12, rx: 2 }));
    const t = S('text', { class: 'fv-edge-label', x: lx, y: ly + 1.5, 'text-anchor': 'middle' });
    t.textContent = e.label;
    g.appendChild(t);
  }
  return g;
}

function drawNodeEl(n, color, opts) {
  opts = opts || {};
  const g = S('g', { class: 'fv-node', transform: `translate(${n.x},${n.y})` });
  g.dataset.id = n.id;
  g.appendChild(shapeFor(n, color, opts));
  if (!opts.hideLabels) {
    const startY = n.h / 2 - ((n.lines.length - 1) * 15) / 2 + 4;
    n.lines.forEach((line, i) => {
      const t = S('text', { class: 'fv-node-label' + (opts.tonal ? ' hcf-label-' + n.kind : ''),
                            x: n.w / 2, y: startY + i * 15, 'text-anchor': 'middle' });
      if (n.kind === 'entry' || n.kind === 'terminal') t.setAttribute('font-weight', '600');
      t.textContent = line;
      g.appendChild(t);
    });
  }
  g.appendChild(S('rect', { class: 'fv-hit', x: 0, y: 0, width: n.w, height: n.h }));
  if (opts.static) {
    g.setAttribute('aria-hidden', 'true');
  } else {
    /* every step is a keyboard stop with its shape named - colour is
       never the only channel, and neither is hover */
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'img');
    g.setAttribute('aria-label', n.label + ', ' + (KIND_LABEL[n.kind] || n.kind));
    g.appendChild(S('rect', { class: 'fv-focus-ring', x: -3, y: -3, width: n.w + 6, height: n.h + 6, rx: 5 }));
  }
  return g;
}

function renderDiagram(L, opts) {
  opts = opts || {};
  const colorFor = opts.colorFor || (() => 'var(--fv-neutral)');
  const svg = S('svg', { xmlns: NS });
  const viewport = S('g', { class: 'fv-diagram' });
  svg.appendChild(viewport);

  const gZones = S('g'), gEdges = S('g'), gNodes = S('g'), gZoneLabels = S('g');
  [gZones, gEdges, gNodes, gZoneLabels].forEach(g => viewport.appendChild(g));

  /* zone frames - preserve the grouping the source board expressed with colour.
     Outlines hug the ranks the zone actually occupies (a staircase), so two
     zones sitting diagonally from each other never swallow one another. */
  if (opts.zones && opts.zones.length) {
    opts.zones.forEach(z => {
      const members = L.nodes.filter(n => n.zone === z.id);
      if (members.length < 2) return;
      zoneOutlines(members, L, 18).forEach(run => {
        const intrudes = L.nodes.some(n => n.zone !== z.id && run.bands.some(b =>
          n.x + n.w > b.x1 && n.x < b.x2 && n.y + n.h > b.y1 && n.y < b.y2));
        if (intrudes) return;
        const g = S('g', { class: 'fv-zone' });
        const poly = S('polygon', {
          points: run.points.map(p => p[0] + ',' + p[1]).join(' '),
          'stroke-width': 1, 'stroke-dasharray': '2 5', opacity: .75, 'stroke-linejoin': 'round'
        });
        poly.style.setProperty('fill', tint(z.color, 4));
        poly.style.setProperty('stroke', z.color);
        g.appendChild(poly);
        gZones.appendChild(g);

        const label = z.name;
        const lw = measureZoneLabel(label, resolveFonts().mono) + 3;
        const lg = S('g', { class: 'fv-zone' });
        lg.appendChild(S('rect', {
          class: 'fv-knockout',
          x: run.head[0] + 4, y: run.head[1] - 23, width: lw + 14, height: 17, rx: 3
        }));
        const t = S('text', { class: 'fv-zone-label', x: run.head[0] + 11, y: run.head[1] - 11 });
        t.style.setProperty('fill', z.color);
        t.textContent = label;
        lg.appendChild(t);
        gZoneLabels.appendChild(lg);
      });
    });
  }

  const edgeEls = new Map();
  const nodeEls = new Map();
  L.edges.forEach(e => { const el = drawEdgeEl(e, opts); edgeEls.set(e.id, el); gEdges.appendChild(el); });
  L.nodes.forEach(n => { const el = drawNodeEl(n, colorFor(n), opts); nodeEls.set(n.id, el); gNodes.appendChild(el); });
  return { svg, viewport, edgeEls, nodeEls, L };
}

/* ============================================================
   ZOOM / PAN
   Plain wheel is left alone so the page scrolls; ⌘/ctrl + wheel
   zooms, and a click on the canvas arms plain-wheel zoom until
   the reader clicks out.
   ============================================================ */
function makeViewer(host, rendered, pad) {
  const P = Object.assign({ top: 34, right: 26, bottom: 26, left: 26 }, pad || {});
  const { svg, viewport, L } = rendered;
  let k = 1, tx = 0, ty = 0;
  let dragging = false, sx = 0, sy = 0, stx = 0, sty = 0, moved = false;
  let onZoom = null;

  host.innerHTML = '';
  host.appendChild(svg);

  function apply() {
    viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
    if (onZoom) onZoom(k);
  }
  function fit() {
    const r = host.getBoundingClientRect();
    const sw = Math.max(1, r.width - P.left - P.right);
    const sh = Math.max(1, r.height - P.top - P.bottom);
    k = Math.min(sw / L.width, sh / L.height, 1.15);
    tx = P.left + (sw - L.width * k) / 2;
    ty = P.top + (sh - L.height * k) / 2;
    apply();
  }
  function zoomTo(nk, cx, cy) {
    const r = host.getBoundingClientRect();
    cx = cx == null ? r.width / 2 : cx;
    cy = cy == null ? r.height / 2 : cy;
    nk = Math.max(0.08, Math.min(3, nk));
    tx = cx - (cx - tx) * (nk / k);
    ty = cy - (cy - ty) * (nk / k);
    k = nk;
    apply();
  }
  function centerOn(el) {
    if (!el) return;
    const n = L.byId && L.byId.get(el);
    if (!n) return;
    const r = host.getBoundingClientRect();
    tx = r.width / 2 - n.cx * k;
    ty = r.height / 2 - n.cy * k;
    apply();
  }

  svg.addEventListener('wheel', ev => {
    // pinch-zoom arrives as ctrlKey on every platform
    if (!ev.ctrlKey && !ev.metaKey && host.dataset.zoomArmed !== 'on') return; // page scrolls
    ev.preventDefault();
    const r = host.getBoundingClientRect();
    const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomTo(k * f, ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  svg.addEventListener('pointerdown', ev => {
    dragging = true; moved = false;
    try { svg.setPointerCapture(ev.pointerId); } catch (err) {}
    sx = ev.clientX; sy = ev.clientY; stx = tx; sty = ty;
    svg.style.cursor = 'grabbing';
  });
  svg.addEventListener('pointermove', ev => {
    if (!dragging) return;
    if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 3) moved = true;
    tx = stx + (ev.clientX - sx);
    ty = sty + (ev.clientY - sy);
    apply();
  });
  const stop = () => { dragging = false; svg.style.cursor = 'grab'; };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
  svg.style.cursor = 'grab';

  return {
    fit, centerOn,
    zoomIn:  () => zoomTo(k * 1.25),
    zoomOut: () => zoomTo(k / 1.25),
    didDrag: () => moved,
    get scale() { return k; },
    set onZoom(fn) { onZoom = fn; }
  };
}

/* ============================================================
   FOCUS / HIGHLIGHT - hover, click-to-pin, and the keyboard
   equivalent of both.
   ============================================================ */
function wireFocus(rendered) {
  const { viewport, edgeEls, nodeEls, L } = rendered;
  let pinned = null;

  const adj = new Map(L.nodes.map(n => [n.id, { nodes: new Set([n.id]), edges: new Set() }]));
  L.edges.forEach(e => {
    if (!adj.has(e.from) || !adj.has(e.to)) return;
    adj.get(e.from).nodes.add(e.to);
    adj.get(e.from).edges.add(e.id);
    adj.get(e.to).nodes.add(e.from);
    adj.get(e.to).edges.add(e.id);
  });

  function clear() {
    viewport.classList.remove('is-focused');
    nodeEls.forEach(el => el.classList.remove('is-on', 'is-seed'));
    edgeEls.forEach(el => el.classList.remove('is-on'));
  }
  function focus(id) {
    clear();
    const a = adj.get(id);
    if (!a) return;
    viewport.classList.add('is-focused');
    a.nodes.forEach(nid => { const el = nodeEls.get(nid); if (el) el.classList.add('is-on'); });
    a.edges.forEach(eid => { const el = edgeEls.get(eid); if (el) el.classList.add('is-on'); });
    const seed = nodeEls.get(id);
    if (seed) seed.classList.add('is-seed');
  }

  nodeEls.forEach((el, id) => {
    el.addEventListener('mouseenter', () => { if (!pinned) focus(id); });
    el.addEventListener('mouseleave', () => { if (!pinned) clear(); });
    el.addEventListener('focus', () => { if (!pinned) focus(id); });
    el.addEventListener('blur', () => { if (!pinned) clear(); });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (pinned === id) { pinned = null; clear(); }
      else { pinned = id; focus(id); }
    });
    el.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault(); ev.stopPropagation();
      if (pinned === id) { pinned = null; clear(); }
      else { pinned = id; focus(id); }
    });
  });
  const svg = viewport.ownerSVGElement;
  if (svg) svg.addEventListener('click', () => { pinned = null; clear(); });
  return { clear, unpin: () => { pinned = null; clear(); } };
}

/* ============================================================
   THUMBNAILS - rendered from the real layout engine with labels
   off, so a card silhouette is honest rather than decorative.
   ============================================================ */
const THUMB_ASPECT = 284 / 148;
function thumbnail(b) {
  const opts = { nodeWidth: 120, rankGap: 30, crossGap: 16 };
  const candidates = ['TB', 'LR'].map(direction =>
    layoutFlow(b.nodes, b.edges, Object.assign({ direction }, opts)));
  const L = candidates.reduce((best, c) => {
    const fit = x => Math.abs(Math.log((x.width / x.height) / THUMB_ASPECT));
    return fit(c) < fit(best) ? c : best;
  });
  const r = renderDiagram(L, { colorFor: () => b.color, hideLabels: true, static: true });
  const pad = 6;
  r.svg.setAttribute('viewBox', `${-pad} ${-pad} ${L.width + pad * 2} ${L.height + pad * 2}`);
  r.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  r.svg.setAttribute('aria-hidden', 'true');
  r.svg.setAttribute('focusable', 'false');
  return r.svg;
}

function legendSwatch(kind) {
  const w = 26, h = 15;
  const svg = S('svg', { width: w + 2, height: h + 2, viewBox: `-1 -1 ${w + 2} ${h + 2}`,
                         'aria-hidden': 'true', focusable: 'false' });
  svg.appendChild(shapeFor({ w, h, kind }, 'var(--fv-ink-3)'));
  return svg;
}

/* ============================================================
   ENTIRE-FLOW SWIMLANES - all seven branches on one canvas
   ============================================================ */
function renderAllLanes() {
  const branches = FLOWS.widgets.branches;
  const LANE_GAP = 78, ROOT_W = 196, ROOT_GAP = 104, PAD = 26;
  const lanes = branches.map(b => ({
    b, L: layoutFlow(b.nodes, b.edges, { direction: 'LR', rankGap: 58, crossGap: 18 })
  }));
  let y = PAD;
  lanes.forEach(ln => { ln.dx = ROOT_W + ROOT_GAP; ln.dy = y; y += ln.L.height + LANE_GAP; });
  const totalH = y - LANE_GAP + PAD;
  const totalW = ROOT_W + ROOT_GAP + Math.max.apply(null, lanes.map(l => l.L.width)) + PAD;

  const svg = S('svg', { xmlns: NS });
  const viewport = S('g', { class: 'fv-diagram' });
  svg.appendChild(viewport);
  const gBands = S('g'), gLinks = S('g'), gLanes = S('g'), gLabels = S('g');
  [gBands, gLinks, gLanes, gLabels].forEach(g => viewport.appendChild(g));

  const nodeEls = new Map(), edgeEls = new Map();
  const allNodes = [], allEdges = [];
  const F = resolveFonts();

  const rootNode = {
    id: '__root', label: FLOWS.widgets.rootLabel, kind: 'terminal',
    lines: wrapText(FLOWS.widgets.rootLabel, ROOT_W - 26, F.node),
    w: ROOT_W, h: 56, x: PAD, y: 0
  };
  rootNode.h = Math.max(52, rootNode.lines.length * 15 + 22);
  rootNode.y = totalH / 2 - rootNode.h / 2;
  const rootEl = drawNodeEl(rootNode, 'var(--fv-ink)');
  gLanes.appendChild(rootEl);
  nodeEls.set('__root', rootEl);
  allNodes.push({ id: '__root' });

  lanes.forEach(ln => {
    const { b, L, dx, dy } = ln;
    const band = S('rect', {
      class: 'fv-lane', x: PAD, y: dy - 22, width: totalW - PAD * 2, height: L.height + 44, rx: 8,
      'stroke-width': 1, 'stroke-dasharray': '2 5', opacity: .55
    });
    band.style.setProperty('fill', tint(b.color, 3));
    band.style.setProperty('stroke', b.color);
    gBands.appendChild(band);

    const g = S('g', { transform: `translate(${dx},${dy})` });
    gLanes.appendChild(g);
    const ge = S('g'), gn = S('g');
    g.appendChild(ge); g.appendChild(gn);

    L.edges.forEach(e => {
      const el = drawEdgeEl(e);
      const key = b.id + ':' + e.id;
      el.dataset.from = b.id + ':' + e.from;
      el.dataset.to = b.id + ':' + e.to;
      ge.appendChild(el);
      edgeEls.set(key, el);
      allEdges.push({ id: key, from: b.id + ':' + e.from, to: b.id + ':' + e.to });
    });
    L.nodes.forEach(n => {
      const el = drawNodeEl(n, b.color);
      const key = b.id + ':' + n.id;
      el.dataset.id = key;
      el.dataset.branch = b.id;
      el.setAttribute('aria-label', b.name + ' - ' + n.label + ', ' + (KIND_LABEL[n.kind] || n.kind));
      gn.appendChild(el);
      nodeEls.set(key, el);
      allNodes.push({ id: key, zone: b.id });
    });

    const label = b.name;
    const lw = measureZoneLabel(label, F.mono);
    gLabels.appendChild(S('rect', {
      class: 'fv-knockout', x: PAD + 12, y: dy - 31, width: lw + 16, height: 17, rx: 3
    }));
    const t = S('text', { class: 'fv-zone-label', x: PAD + 20, y: dy - 19 });
    t.style.setProperty('fill', b.color);
    t.textContent = label;
    gLabels.appendChild(t);

    const head = L.byId.get('root');
    const sx = PAD + ROOT_W, sy = rootNode.y + rootNode.h / 2;
    const tx = dx + head.x, ty = dy + head.y + head.h / 2;
    const c = Math.min((tx - sx) * 0.55, 90);
    const el = S('g', { class: 'fv-edge' });
    el.dataset.from = '__root';
    el.dataset.to = b.id + ':root';
    el.appendChild(S('path', { class: 'fv-edge-path', d: `M ${sx} ${sy} C ${sx + c} ${sy} ${tx - c} ${ty} ${tx} ${ty}` }));
    el.appendChild(S('polygon', { class: 'fv-arrow', points: `${tx},${ty} ${tx - 7.5},${ty - 3.8} ${tx - 7.5},${ty + 3.8}` }));
    gLinks.appendChild(el);
    const key = 'root:' + b.id;
    edgeEls.set(key, el);
    allEdges.push({ id: key, from: '__root', to: b.id + ':root' });
  });

  const L = { nodes: allNodes, edges: allEdges, width: totalW, height: totalH, direction: 'LR' };
  return { svg, viewport, nodeEls, edgeEls, L };
}

/* ============================================================
   TEXT ALTERNATIVE - the same graph as an ordered list, so the
   flow is readable by screen readers and indexable by crawlers.
   ============================================================ */
function textAlt(rawNodes, rawEdges) {
  const label = new Map(rawNodes.map(([id, l]) => [id, l]));
  const L = layoutFlow(rawNodes, rawEdges);
  const ordered = L.nodes.slice().sort((a, b) => (a.rank - b.rank) || (a.order - b.order));
  return ordered.map(n => {
    const outs = rawEdges
      .filter(e => e[0] === n.id)
      .map(e => (e[2] ? e[2] + ' → ' : '→ ') + (label.get(e[1]) || e[1]));
    return { label: n.label, kind: KIND_LABEL[n.kind] || n.kind, outs };
  });
}

window.HCFlow = {
  FLOWS, KIND_LABEL, BAR,
  layoutFlow, renderDiagram, renderAllLanes, makeViewer, wireFocus,
  thumbnail, legendSwatch, textAlt, resolveFonts, resetFonts
};
})();
</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability - if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag - ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

function BlobCursor({ enabled, style }) {
  const dotRef = useRef(null);
  const trailRef = useRef(null);

     playful "tap feedback" without the wasted cursor machinery. */

    () => typeof window !== 'undefined' && window.matchMedia('(hover: none)').matches,
    []

    if (!enabled) return;

       and touchstart (mobile). On touch there's no cursor element, so it
       falls back to the explicit (x, y) we pass in. */
    const spawnCmykAt = (x, y) => {

        burst.style.top    = (r.top  + r.height / 2) + 'px';
        burst.style.width  = cursorEl.offsetWidth  + 'px';
        burst.style.height = cursorEl.offsetHeight + 'px';

        burst.style.left = x + 'px';
        burst.style.top  = y + 'px';
        /* No live cursor to size against on touch - use a fixed splat size. */
        burst.style.width = '56px';
        burst.style.height = '56px';

      const blob = 'M50,18 C72,12 90,28 88,52 C92,72 70,90 50,86 C30,90 12,74 12,52 C10,30 28,16 50,18 Z';
      burst.innerHTML = `
        <svg class="c" viewBox="0 0 100 100" aria-hidden="true"><path d="${blob}"/></svg>
        <svg class="m" viewBox="0 0 100 100" aria-hidden="true"><path d="${blob}"/></svg>
        <svg class="y" viewBox="0 0 100 100" aria-hidden="true"><path d="${blob}"/></svg>

      activeBursts.add(burst);
      setTimeout(() => { burst.remove(); activeBursts.delete(burst); }, 460);
    };

      r.style.top  = y + 'px';

      spawnCmykAt(e.clientX, e.clientY);

        dotRef.current.style.left = rx + 'px';
        dotRef.current.style.top  = ry + 'px';
