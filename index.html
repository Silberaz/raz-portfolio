    document.addEventListener('mouseover', onOver);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      document.removeEventListener('mouseover', onOver);
      document.documentElement.classList.remove('cursor-on');
      document.documentElement.classList.remove('cursor-water');
    };
  }, [enabled, style, isTouch]);
  if (!enabled) return null;

  /* Touch devices: still render CursorFilters so .cmyk-burst can use the
     #cmyk-cutout mask and #gooey-puddle filter - just no live cursor. */
  if (isTouch) return <CursorFilters />;

  if (style === 'puddle') {
    return (
      <>
        <CursorFilters />
        <div ref={trailRef} className="cur-trail-layer" />
        <div ref={dotRef} className="puddle-cursor">
          <svg viewBox="0 0 100 100" aria-hidden="true" className="puddle-svg">
            <path className="puddle-body" d="M50,18 C72,12 90,28 88,52 C92,72 70,90 50,86 C30,90 12,74 12,52 C10,30 28,16 50,18 Z" />
          </svg>
        </div>
      </>
    );
  }

  if (style === 'ripple') {
    return (
      <>
        <CursorFilters />
        <div className="water-veil" />
        <div ref={ringLayerRef} className="water-ring-layer" />
        <div ref={dotRef} className="ripple-cursor">
          <span className="rc-core" />
          <span className="rc-halo" />
        </div>
      </>
    );
  }

  // default - blob
  return (
    <div ref={dotRef} className="blob-cursor">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path className="blob-outer" d="M50,8 C72,6 94,22 94,46 C96,68 80,90 56,94 C32,98 10,82 6,58 C2,36 18,12 50,8 Z" />
        <path className="blob-inner" d="M50,22 C66,20 82,32 80,52 C82,68 66,80 48,80 C30,80 18,66 20,48 C22,32 36,22 50,22 Z" />
      </svg>
    </div>
  );
}

/* ─── Loader ─── */
function Loader({ onDone }) {
  const ref = useRef(null);
  const progRef = useRef(null);
  const subRef = useRef(null);
  useEffect(() => {
    const final = 'Raz Silberman - Portfolio';
    const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789·×#@%&*';
    // Each char gets a "lock-in" frame; before that, it scrambles.
    const lockAt = final.split('').map((_, i) => 6 + i * 2 + Math.floor(Math.random() * 4));
    let frame = 0;
    const totalFrames = Math.max(...lockAt) + 4;
    const scrambleId = setInterval(() => {
      frame++;
      const out = final.split('').map((ch, i) => {
        if (ch === ' ' || ch === '-') return ch;
        if (frame >= lockAt[i]) return ch;
        return glyphs[Math.floor(Math.random() * glyphs.length)];
      }).join('');
      if (subRef.current) subRef.current.textContent = out;
      if (frame >= totalFrames) clearInterval(scrambleId);
    }, 45);

    const t1 = setTimeout(() => progRef.current?.classList.add('run'), 100);
    const t2 = setTimeout(() => {
      ref.current?.classList.add('out');
      setTimeout(onDone, 800);
    }, 1900);
    return () => { clearInterval(scrambleId); clearTimeout(t1); clearTimeout(t2); };
  }, [onDone]);
  return (
    <div id="loader" ref={ref}>
      <div className="loader-mark">RS<span className="accent">·</span></div>
      <div className="loader-progress" ref={progRef}></div>
      <div className="loader-sub" ref={subRef}>Raz Silberman - Portfolio</div>
    </div>
  );
}

/* ─── Inline interactive grid demo (Responsive Grid System section) ───
   Interactive model of the Lighthouse layout rules. Sources: the grid
   layouts board (columns / gutters / margins per breakpoint, and the right
   panel: 460 at LG/XL and 360 at MD pushing the grid, 360 over the grid at
   SM, the screen at XS), the layout-patterns board (grid capped at 1920,
   header full width, grid recalculates from the effective content width,
   collapsed right panel 56 on desktop) and the panels board (left panel
   overlays in Agent view and pushes in CM view). All maths in design px. */
const GRID_BPS = [
  { name: 'XS', min: 0,    max: 599,      columns: 4,  gutter: 16, margin: 16 },
  { name: 'SM', min: 600,  max: 1023,     columns: 8,  gutter: 16, margin: 24 },
  { name: 'MD', min: 1024, max: 1439,     columns: 12, gutter: 24, margin: 32 },
  { name: 'LG', min: 1440, max: 1919,     columns: 12, gutter: 24, margin: 48 },
  { name: 'XL', min: 1920, max: Infinity, columns: 12, gutter: 32, margin: 64 },
];
const GRID_CAP = 1920;
const gridBp = (w) => GRID_BPS.find(b => w >= b.min && w <= b.max) || GRID_BPS[0];
/* Left panel per viewport breakpoint: opening share of the screen, drag
   range for a tree list, and how many regular-list panels fit side by side
   (together they fill the screen exactly). SM is a fixed 480; XS is the
   screen. */
const GRID_LEFT = {
  XL: { share: 0.20, min: 300, max: 640, panels: 5 },
  LG: { share: 0.25, min: 300, max: 640, panels: 4 },
  MD: { share: 0.33, min: 300, max: 480, panels: 3 },
  SM: { fixed: 480, panels: 1 },
  XS: { full: true, panels: 1 },
};
/* Right (article) panel per viewport breakpoint. It is not part of the
   grid: on MD and up it takes its own space and the grid recalculates from
   what is left; at SM it sits over the grid; at XS it is the screen.
   Collapsed (56) exists on desktop only. */
const GRID_RIGHT = {
  XL: { w: 460, push: true, collapsed: 56 },
  LG: { w: 460, push: true, collapsed: 56 },
  MD: { w: 360, push: true },
  SM: { w: 360, push: false },
  XS: { full: true, push: false },
};
const GRID_COLLAPSED = 48;

function computeGridLayout(s) {
  const vp = s.vp;
  const vbp = gridBp(vp);
  const rule = GRID_LEFT[vbp.name];
  const cmAllowed = vbp.name !== 'XS' && vbp.name !== 'SM';   // CM view is desktop-only
  const view = cmAllowed ? s.view : 'agent';
  const shareW = rule.full ? vp : rule.fixed ? rule.fixed : Math.round(vp * rule.share);
  const resizable = !!rule.share;
  const treeW = resizable
    ? Math.min(rule.max, Math.max(rule.min, s.treeW == null ? shareW : s.treeW))
    : shareW;
  const maxPanels = rule.panels;
  const listN = Math.min(maxPanels, Math.max(1, s.listN));

  let left = { mode: 'off', w: 0, push: false, panels: [] };
  if (view === 'cm') {
    if (s.leftCM === 'open')      left = { mode: 'cm-open',      w: treeW,          push: true, panels: [treeW] };
    if (s.leftCM === 'collapsed') left = { mode: 'cm-collapsed', w: GRID_COLLAPSED, push: true, panels: [GRID_COLLAPSED] };
  } else {
    if (s.leftAgent === 'tree') left = { mode: 'tree', w: treeW,          push: false, panels: [treeW] };
    if (s.leftAgent === 'list') left = { mode: 'list', w: shareW * listN, push: false, panels: Array(listN).fill(shareW) };
  }

  const rr = GRID_RIGHT[vbp.name];
  const rightCollapsible = !!rr.collapsed;
  const openRight = { mode: 'open', w: rr.full ? vp : rr.w, push: rr.push, full: !!rr.full };
  let right = { mode: 'off', w: 0, push: false, full: false };
  if (s.right === 'open') right = openRight;
  if (s.right === 'collapsed') right = rightCollapsible ? { mode: 'collapsed', w: rr.collapsed, push: true, full: false } : openRight;

  const push = left.push ? left.w : 0;
  const rpush = right.push ? right.w : 0;
  const cw = vp - push - rpush;            // content area: screen minus pushing panels
  const gw = Math.min(cw, GRID_CAP);       // the grid never grows past 1920
  const capGap = (cw - gw) / 2;            // empty margin each side when capped
  const gx = push + capGap;                // grid origin
  const abp = gridBp(gw);                  // grid responds to the effective width
  const innerW = gw - 2 * abp.margin;
  const colW = (innerW - (abp.columns - 1) * abp.gutter) / abp.columns;
  return { vp, vbp, view, cmAllowed, rule, shareW, treeW, resizable, maxPanels, listN,
           left, push, right, rpush, rightCollapsible, cw, gw, capGap, gx, abp, innerW, colW };
}

/* A few sentences naming the rules currently in effect. */
function gridReadout(L) {
  const out = [];
  const { vp, vbp, abp, left, right } = L;
  const r = Math.round;
  if (L.gw < L.cw) {
    out.push(`The grid never grows past ${GRID_CAP}: it stays ${r(L.gw)} wide and centres in the ${r(L.cw)} px content area, leaving ${r(L.capGap)} px of empty margin each side. Only the header keeps stretching.`);
  }
  if (left.mode === 'tree' || left.mode === 'list') {
    const panelW = left.panels[0];
    if (L.rule.full) out.push('On XS the left panel is the screen: no share and no resizing.');
    else if (left.mode === 'tree') out.push(`Agent view: the tree panel is absolute and sits over the page, so the grid does not move. ${L.resizable ? `It opens at ${r(L.rule.share * 100)}% (${panelW}) and drags between ${L.rule.min} and ${L.rule.max}.` : `At SM it is a fixed ${panelW}.`}`);
    else out.push(`Agent view: regular-list panels are fixed at ${panelW} and stack from the left. ${L.listN === L.maxPanels ? `${L.listN} together fill the screen exactly` : `${L.listN} of ${L.maxPanels} open`}; the grid underneath is unchanged.`);
  }
  if (left.mode === 'cm-open') {
    out.push(`CM view: the left panel takes its own space (${left.w}) and the content area is what is left.`);
    if (abp.name === vbp.name && vp - left.w - L.rpush >= GRID_CAP) out.push('Content is already at the 1920 cap, so collapsing would only re-centre the grid.');
  }
  if (left.mode === 'cm-collapsed') {
    if (vp - L.treeW - L.rpush >= GRID_CAP) out.push(`Left panel collapsed to ${GRID_COLLAPSED}: the grid was already at ${GRID_CAP}, so it only re-centres. The freed space becomes equal margin on both sides and the page shifts, animated.`);
    else out.push(`Left panel collapsed to ${GRID_COLLAPSED}: the grid widens to ${r(L.gw)}. The 48 is not side spacing; the grid centres inside the content area.`);
  }
  if (right.mode === 'open' && right.push) {
    out.push(`The right panel is not part of the grid: it takes a fixed ${right.w} and reduces the container to ${r(L.cw)} px.`);
  }
  if (right.mode === 'collapsed') out.push(`Right panel collapsed to ${right.w}: it keeps its rail and hands ${GRID_RIGHT[vbp.name].w - right.w} px back to the content area.`);
  if (right.mode === 'open' && !right.push && !right.full) out.push(`At SM the right panel is ${right.w} and sits over the grid; the columns underneath are unchanged.`);
  if (right.full) out.push('On XS the right panel takes the whole screen.');
  if ((L.push || L.rpush) && abp.name !== vbp.name) {
    out.push(`That puts the content area under the ${vbp.name} range, so the grid switches to ${abp.name}: ${abp.columns} columns, ${abp.gutter} gutter, ${abp.margin} margins.`);
  }
  if (!left.push && left.mode !== 'off' && L.rpush) out.push('Dual panel: the left panel continues to overlay while the right one reduces the grid, and nothing scrolls horizontally.');
  if (!out.length) {
    if (vp === GRID_CAP) out.push('At 1920 the grid fills the screen: header and content share the same width, with 64 margins on both.');
    else out.push(`${vbp.name}: ${abp.columns} columns, ${abp.gutter} gutter, ${abp.margin} margins. The grid fills the screen and the header spans it.`);
  }
  return out.slice(0, 4).join(' ');
}

const GRID_JUMPS = [
  { label: 'XS', vp: 480 }, { label: 'SM', vp: 768 }, { label: 'MD', vp: 1280 },
  { label: 'LG', vp: 1536 }, { label: 'XL', vp: 1920 }, { label: '2560', vp: 2560 }, { label: '3840', vp: 3840 },
];

function GridToggle({ value, options, onPick }) {
  return (
    <div className="pill-toggle">
      {options.map(o => (
        <button key={o.v} type="button" className={value === o.v ? 'active' : ''}
                disabled={!!o.disabled} onClick={() => onPick(o.v)}>{o.label}</button>
      ))}
    </div>
  );
}

function GridDemo({ caption }) {
  const [s, setS] = useState({ vp: 1920, view: 'agent', leftAgent: 'off', leftCM: 'open', listN: 1, treeW: null, right: 'off' });
  const set = (patch) => setS(prev => ({ ...prev, ...patch }));
  const setVp = (vp) => setS(prev => ({ ...prev, vp, treeW: gridBp(vp).name === gridBp(prev.vp).name ? prev.treeW : null }));
  const L = computeGridLayout(s);
  const m = L.abp.margin;
  const pct = (px) => (px / L.vp * 100) + '%';           // of the stage (viewport)
  const gp  = (px) => (px / L.gw * 100) + '%';           // of the grid container
  const ip  = (px) => (px / L.innerW * 100) + '%';       // of the column slot
  const r = Math.round;

  const cols = [];
  for (let i = 0; i < L.abp.columns; i++) {
    cols.push(<div key={'c' + i} className="grid-col" style={{ width: ip(L.colW) }} />);
    if (i < L.abp.columns - 1) cols.push(<div key={'g' + i} className="grid-gutter" style={{ width: ip(L.abp.gutter) }} />);
  }
  const leftLabel = (i, w) => {
    if (L.left.mode === 'cm-collapsed') return '48';
    if (L.left.mode === 'list') return i === 0 ? `List · ${w}` : '';
    return `Tree · ${w}`;
  };
  const rightStat = L.right.mode === 'off' ? '—'
    : L.right.full ? 'full' : `${L.right.w} · ${L.right.push ? 'pushes' : 'overlays'}`;
  const rightLabel = L.right.mode === 'collapsed' ? String(L.right.w) : L.right.full ? 'Right panel · full width' : `Right · ${L.right.w}`;

  return (
    <figure className="proj-media-item k-wide grid-demo-figure">
      <div id="proj-grid-demo">
        <div className="grid-stats">
          <div className="grid-stat"><p className="grid-stat-label">Viewport</p><p className="grid-stat-val">{L.vp} px</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Content area</p><p className="grid-stat-val">{r(L.cw)} px</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Grid</p><p className="grid-stat-val">{r(L.gw)} px{L.gw < L.cw && <small> · cap</small>}</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Breakpoint</p><p className="grid-stat-val"><span className={'bp-pill bp-' + L.abp.name}>{L.abp.name}</span></p></div>
          <div className="grid-stat"><p className="grid-stat-label">Columns</p><p className="grid-stat-val">{L.abp.columns}</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Gutter</p><p className="grid-stat-val">{L.abp.gutter}</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Margin</p><p className="grid-stat-val">{L.abp.margin}</p></div>
          <div className="grid-stat"><p className="grid-stat-label">Right panel</p><p className="grid-stat-val">{rightStat}</p></div>
        </div>

        <div className="grid-stage" aria-hidden="true">
          <div className="grid-header"></div>
          <div className="grid-body">
            {L.left.push && (
              <div className={'gd-panel gd-left gd-push ' + L.left.mode} style={{ left: 0, width: pct(L.left.w) }}>
                <span>{leftLabel(0, L.left.w)}</span>
              </div>
            )}
            {L.right.push && (
              <div className={'gd-panel gd-right gd-push ' + L.right.mode} style={{ left: pct(L.vp - L.right.w), width: pct(L.right.w) }}>
                <span>{rightLabel}</span>
              </div>
            )}
            {L.capGap > 0 && <div className="gd-cap" style={{ left: pct(L.push), width: pct(L.capGap) }} />}
            {L.capGap > 0 && <div className="gd-cap" style={{ left: pct(L.gx + L.gw), width: pct(L.capGap) }} />}

            <div className="grid-container" style={{ left: pct(L.gx), width: pct(L.gw) }}>
              <div className="grid-margin" style={{ left: 0, width: gp(m) }} />
              <div className="grid-margin" style={{ left: gp(L.gw - m), width: gp(m) }} />
              <div className="grid-cols" style={{ left: gp(m), width: gp(L.innerW) }}>{cols}</div>
              <div className="gd-content" style={{ left: gp(m), width: gp(L.innerW) }}>
                <i className="gd-title" /><i className="gd-line" /><i className="gd-block" />
              </div>
            </div>

            {L.right.mode !== 'off' && !L.right.push && (
              <div className={'gd-panel gd-right ' + (L.right.full ? 'gd-full' : 'gd-overlay')} style={{ left: pct(L.vp - L.right.w), width: pct(L.right.w) }}>
                <span>{rightLabel}</span>
              </div>
            )}
            {!L.left.push && L.left.panels.map((w, i) => (
              <div key={i} className="gd-panel gd-left gd-overlay" style={{ left: pct(i * w), width: pct(w) }}>
                <span>{leftLabel(i, w)}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="controls-row">
          <label htmlFor="g-vp-slider">Viewport</label>
          <input type="range" id="g-vp-slider" min="360" max="3840" step="1" value={s.vp}
                 onChange={e => setVp(parseInt(e.target.value, 10))} />
          <span className="gd-out">{s.vp}</span>
        </div>
        <div className="controls-row sub">
          <label>Jump to</label>
          <div className="bp-jump">
            {GRID_JUMPS.map(j => {
              const isBp = GRID_BPS.some(b => b.name === j.label);
              const active = isBp ? L.vbp.name === j.label : s.vp === j.vp;
              return (
                <button key={j.label} type="button" className={'bp-pill bp-' + j.label + (active ? ' active' : '')}
                        onClick={() => setVp(j.vp)}>{j.label}</button>

          </div>
        </div>

        <div className="controls-row">
          <label>View</label>
          <GridToggle value={L.view} onPick={v => set({ view: v })}
                  options={[{ v: 'agent', label: 'Agent' }, { v: 'cm', label: 'CM', disabled: !L.cmAllowed }]} />
          {!L.cmAllowed && <span className="gd-hint">CM view is not built for tablet or mobile</span>}
        </div>

        <div className="controls-row">
          <label>Left panel</label>
          {L.view === 'cm' ? (

          ) : (
            <GridToggle value={s.leftAgent} onPick={v => set({ leftAgent: v })}
                    options={[{ v: 'off', label: 'Hidden' }, { v: 'tree', label: 'Tree list' }, { v: 'list', label: 'Regular list' }]} />
          )}
        </div>
        {(L.left.mode === 'tree' || L.left.mode === 'cm-open') && L.resizable && (
          <div className="controls-row sub">
            <label htmlFor="g-tree-slider">Panel width</label>
            <input type="range" id="g-tree-slider" min={L.rule.min} max={L.rule.max} step="1" value={L.treeW}
                   onChange={e => set({ treeW: parseInt(e.target.value, 10) })} />
            <span className="gd-out">{L.treeW}</span>
            <span className="gd-hint">opens at {r(L.rule.share * 100)}% · {L.rule.min}–{L.rule.max}</span>
          </div>
        )}
        {L.left.mode === 'list' && L.maxPanels > 1 && (
          <div className="controls-row sub">
            <label>Panels open</label>
            <GridToggle value={L.listN} onPick={v => set({ listN: v })}

  if (!FV_STEP_CACHE.has(key)) FV_STEP_CACHE.set(key, window.HCFlow.textAlt(nodes, edges));

  );
}

/* fit to the frame, but within a band that keeps labels close to the
   admin diagram's size - a big flow scrolls sideways rather than shrink */
const HCF_SCALE = [0.95, 1.15];
const HCF_PAD = 16;

function HCWidgetFlow({ branch, tick }) {
  const ref = useRef(null);
  useEffect(() => {
    const host = ref.current;
    if (!host) return;
    const HC = window.HCFlow;
    const L = HC.layoutFlow(branch.nodes, branch.edges, { direction: 'TB' });
    const { svg } = HC.renderDiagram(L, { tonal: true, static: true });
    const w = L.width + HCF_PAD * 2, h = L.height + HCF_PAD * 2;
    svg.setAttribute('viewBox', `${-HCF_PAD} ${-HCF_PAD} ${w} ${h}`);
    svg.setAttribute('aria-hidden', 'true');
    const size = () => {
      const k = Math.min(HCF_SCALE[1], Math.max(HCF_SCALE[0], host.clientWidth / w));
      svg.setAttribute('width', Math.round(w * k));
      svg.setAttribute('height', Math.round(h * k));
    };
    host.innerHTML = '';
    host.appendChild(svg);
    size();
    window.addEventListener('resize', size);
    return () => { window.removeEventListener('resize', size); host.innerHTML = ''; };
  }, [branch, tick]);
  return <div className="hcf-canvas" ref={ref} />;
}

function HCFlowViewer({ caption }) {
  const HC = window.HCFlow;
  const BRANCHES = HC.FLOWS.widgets.branches;
  const [flow, setFlow]     = useState('admin');
  const [branch, setBranch] = useState(BRANCHES[0].id);
  const [tick, setTick]     = useState(0);         /* bumps when webfonts land */
  const activeBranch = BRANCHES.find(b => b.id === branch) || BRANCHES[0];

  /* the layout measures real text, so re-run it once webfonts land */
  useEffect(() => {
    if (!document.fonts || !document.fonts.ready) return;
    let alive = true;
    document.fonts.ready.then(() => {
      if (!alive) return;
      HC.resetFonts();
      FV_STEP_CACHE.clear();
      setTick(t => t + 1);
    });
    return () => { alive = false; };
  }, []);

  return (
    <div className="hcf">
      <div className="fv-tabs hcf-tabs" role="tablist" aria-label="Help Center flows">
        {[['admin', 'Admin access'], ['widgets', 'Widget customization']].map(([id, label]) => (

                <span>{b.name}</span>
              </button>
            ))}
          </div>
          <div className="hcf-frame">
            <HCWidgetFlow branch={activeBranch} tick={tick} />
          </div>
          <div className="fv-sr">
            <FlowSteps cacheKey={activeBranch.id} nodes={activeBranch.nodes} edges={activeBranch.edges}

/* Segmented control over a set of panels - each panel is text beside one image.
   On desktop the section pins while it is in view and the page scroll drives the
   tabs: each tab gets one stage-height of scroll, and the page releases after the
   last one. Where the stage can't fit the viewport it falls back to plain tabs.
   The section title spans both columns and pins with the stage, so its divider
   stays full width. */
function ProjectTabs({ tabs, idBase = 'tabs', title, intro }) {
  const [active, setActive] = useState(0);
  const [pinned, setPinned] = useState(false);
  const trackRef = useRef(null);
  const stageRef = useRef(null);
  const geo = useRef({ step: 0, top: 0 });
  const n = tabs?.length || 0;

  useEffect(() => {
    const track = trackRef.current, stage = stageRef.current;
    if (!track || !stage || n < 2) return;
    const mq = window.matchMedia('(min-width: 960px)');

    const measure = () => {
      const stageH = stage.offsetHeight;
      const on = mq.matches && stageH + STICKY_TOP <= window.innerHeight;
      setPinned(on);
      geo.current = { step: on ? stageH : 0, top: STICKY_TOP };
      track.style.height = on ? `${stageH * (n + 1)}px` : '';
      onScroll();
    };
    const onScroll = () => {
      const { step, top } = geo.current;
      if (!step) return;
      const p = top - track.getBoundingClientRect().top;
      setActive(Math.max(0, Math.min(n - 1, Math.floor(p / step))));
    };

    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(stage);
    window.addEventListener('resize', measure);
    window.addEventListener('scroll', onScroll, { passive: true });
    mq.addEventListener('change', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
      window.removeEventListener('scroll', onScroll);
      mq.removeEventListener('change', measure);
      track.style.height = '';
    };
  }, [n]);

  if (!n) return null;
  const t = tabs[active];

  /* While pinned, picking a tab scrolls to the middle of that tab's stretch,
     so the scroll position and the selection never disagree. */
  const go = (i) => {
    const { step, top } = geo.current;
    if (!pinned || !step) { setActive(i); return; }
    const trackTop = trackRef.current.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({ top: trackTop - top + step * i + step / 2, behavior: 'smooth' });
  };
  const onKey = (e) => {
    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const next = (active + dir + n) % n;
    go(next);
    document.getElementById(`${idBase}-tab-${next}`)?.focus();
  };

  return (
    <div ref={trackRef} className={`proj-tabs ${pinned ? 'is-pinned' : ''}`}>
      <div ref={stageRef} className="proj-tabs-stage">
        {title}
        <div className="proj-tabs-side">
          {intro}
          <div className="proj-tabs-seg" role="tablist" onKeyDown={onKey}>
            {tabs.map((tab, i) => (
              <button key={i} type="button" role="tab" id={`${idBase}-tab-${i}`}
                      aria-selected={i === active} aria-controls={`${idBase}-panel`}
                      tabIndex={i === active ? 0 : -1}
                      onClick={() => go(i)}>{tab.label}</button>
            ))}
          </div>
          <div className="proj-tabs-text" role="tabpanel" id={`${idBase}-panel`}
               aria-labelledby={`${idBase}-tab-${active}`}>
            {t.title && <h3 className="proj-sub-title">{t.title}</h3>}
            {t.body?.map((para, i) => <p key={i}>{para}</p>)}
          </div>
        </div>
        <figure className={`proj-tabs-media proj-media-item k-wide ${t.media?.bare ? 'is-bare' : ''}`}>
          {t.media?.placeholder || !t.media?.src ? (
            <div className="proj-media-placeholder"><span>{t.media?.label || `${t.label} - image placeholder`}</span></div>
          ) : (
            <img src={t.media.src} alt={t.media.caption || ''} loading="lazy" />
          )}
          {t.media?.caption && <figcaption className="proj-caption">{t.media.caption}</figcaption>}
        </figure>
      </div>
    </div>
  );
}

/* One "+" pinned over a highlighted region of a screenshot. The note is tied
   to the button with aria-describedby so screen readers get the explanation,
   not just the title, and Escape dismisses it for pointer users. */
function Hotspot({ h, id }) {
  const [dismissed, setDismissed] = useState(false);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setDismissed(true); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);
  const rearm = () => setDismissed(false);
  return (
    <div className={`proj-hot ${h.x > 50 ? 'is-left' : 'is-right'} ${h.y > 55 ? 'is-up' : 'is-down'}${dismissed ? ' is-dismissed' : ''}`}
         style={{ left: `${h.x}%`, top: `${h.y}%` }}
         onMouseEnter={rearm} onMouseLeave={rearm} onFocus={rearm} onBlur={rearm}>
      <button type="button" className="proj-hot-dot"
              aria-describedby={id} aria-label={`Problem: ${h.title}`}>+</button>
      <div className="proj-hot-pop" id={id} role="note">
        <span className="proj-hot-title">{h.title}</span>
        <p>{h.body}</p>
      </div>
    </div>
  );
}

function ProjectMediaRows({ rows, idBase = 'mr' }) {
  if (!rows || !rows.length) return null;
  /* The longest row sets the column count for every row, so all screens
     render at one size and shorter rows leave their trailing cells empty. */
  const cols = rows.reduce((n, r) => Math.max(n, (r.items || []).length), 1);
  return (
    <div className="proj-media-rows" style={{ '--mr-cols': cols }}>
      {rows.map((row, i) => (
        <div key={i} className="proj-media-row">
          {row.label && <h3 className="proj-media-row-label">{row.label}</h3>}
          <div className="proj-media-row-grid">
            {(row.items || []).map((m, j) => (
              <figure key={j} className="proj-media-item k-wide">
                <div className="proj-hot-frame">
                  <img src={m.src} alt={m.caption || row.label || ''} loading="lazy" />
                  {m.hotspots && (
                    <div className="proj-hot-layer">
                      {m.hotspots.map((h, k) => (
                        <Hotspot key={k} h={h} id={`hot-${idBase}-${i}-${j}-${k}`} />
                      ))}
                    </div>
                  )}
                </div>
                {m.caption && <figcaption className="proj-caption">{m.caption}</figcaption>}
              </figure>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* Concept accordion - the open concept's screens on one side, the list of
   concepts on the other. Exactly one concept is open at a time; one with
   several screens gets a gallery, one with a single screen a plain figure. */
function ProjectConcepts({ concepts, idBase = 'concepts' }) {
  const [open, setOpen] = useState(0);
  if (!concepts || !concepts.length) return null;

  return (
    <div className="proj-concepts">
      <div className="proj-concepts-media">
        {concepts.map((c, i) => {
          const items = c.items || [];
          const isOpen = i === open;
          return (
            <div key={i} className={`proj-concepts-layer ${isOpen ? 'is-open' : ''}`}
                 aria-hidden={!isOpen} inert={isOpen ? undefined : ''}>

                <SideGallery items={items} />

                </figure>
              ) : null}
            </div>

      <div className="proj-concepts-list">
        {concepts.map((k, i) => {
          const isOpen = i === open;
          return (
            <div key={i} className={`proj-concept ${isOpen ? 'is-open' : ''}`}>
              <h3 className="proj-concept-head">
                <button type="button" id={`${idBase}-c-${i}`}
                        aria-expanded={isOpen} aria-controls={`${idBase}-p-${i}`}
                        onClick={() => setOpen(i)}>

                   aria-labelledby={`${idBase}-c-${i}`} aria-hidden={!isOpen} inert={isOpen ? undefined : ''}>
                <div className="proj-concept-body-inner">
                  {k.body?.map((para, j) => <p key={j}>{para}</p>)}

            </div>

        })}
      </div>
    </div>
  );
}

/* ─── Project page - A-vs-B comparison table (built from the same tokens as outcome-grid) ─── */
/* ─── Project page - marquee: a slow, endless strip of frames (chyron-style).
   The list renders twice so the track can loop seamlessly at -50%; duration is
   derived from the measured width so speed stays constant in px/s. Hover or
   keyboard focus pauses it; reduced-motion users get a plain scroll strip.
   Video items ({src: '*.mp4', poster}) only play while on screen, and the strip
   is marked data-gallery so the Lightbox opens it as a browsable gallery. */
function ProjectMarquee({ items, speed = 28, label = 'Wireframes - slowly scrolling strip, hover to pause' }) {
  const rootRef = useRef(null);
  const trackRef = useRef(null);
  const [dur, setDur] = useState(60);
  useEffect(() => {
    const el = trackRef.current;
    if (!el) return;
    const measure = () => setDur(Math.max(20, (el.scrollWidth / 2) / speed));
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return () => ro.disconnect();
  }, [speed]);
  useEffect(() => {
    const root = rootRef.current;
    const vids = root ? [...root.querySelectorAll('video')] : [];
    if (!vids.length) return;
    // A video plays only while it's on screen - and, while a frame is hovered
    // (the focus state), only if it's the hovered one.
    const visible = new Set();
    let hovered = null;
    const sync = () => vids.forEach(v => {
      const on = visible.has(v) && (!hovered || hovered.contains(v));
      if (on && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else if (!on && !v.paused) v.pause();
    });
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => en.isIntersecting ? visible.add(en.target) : visible.delete(en.target));
      sync();
    }, { threshold: 0.15 });
    vids.forEach(v => io.observe(v));
    const onOver = (e) => {
      const fig = e.target.closest('.proj-marquee-item');
      if (fig !== hovered) { hovered = fig; sync(); }
    };
    const onLeave = () => { hovered = null; sync(); };
    root.addEventListener('pointerover', onOver);
    root.addEventListener('pointerleave', onLeave);
    return () => {
      io.disconnect();
      root.removeEventListener('pointerover', onOver);
      root.removeEventListener('pointerleave', onLeave);
    };
  }, [items]);
  /* Captions type in as their frame enters. The strip runs left to right, so
     a frame's caption (bottom-left) would be the last thing on screen.
     Instead it's held at the strip's left edge - where the frame comes in -
     and typed there letter by letter, each letter staying put, once the
     frame's leading ~5% is in view. Typing never runs past that same inset
     from the frame's leading edge, so it stays inside its own frame. Once
     typed it waits at the edge in full; when the frame is fully in view its
     left edge reaches the caption, which then locks and rides with the
     frame, clearing the edge for the next one. Driven by the
     frames' real positions each animation frame, so hover-pause and resizes
     need no special cases. */
  useEffect(() => {
    const root = rootRef.current;
    if (!root || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const CHAR_MS = 110;    // typing speed
    const START_AT = 0.046; // typing starts once this share of the frame (from its leading edge) is in
    const ctx = document.createElement('canvas').getContext('2d');
    // width of each prefix of the caption, measured once per entry
    const prefixWidths = (el, text) => {
      const cs = getComputedStyle(el);
      ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const ls = parseFloat(cs.letterSpacing) || 0;
      return [...text].map((_, i) => ctx.measureText(text.slice(0, i + 1)).width + ls * (i + 1));
    };
    const caps = [...root.querySelectorAll('.proj-marquee-item')].map(fig => {
      const cap = fig.querySelector('.proj-marquee-cap');
      return cap && {
        frame: fig.querySelector('.proj-marquee-frame'), cap,
        type: cap.querySelector('.mq-type'), full: cap.dataset.caption,
        t0: 0, widths: null, n: -1, x: null, typing: null,
      };
    }).filter(Boolean);
    if (!caps.length) return;
    const draw = (c, n, x, typing) => {
      if (n !== c.n) { c.type.textContent = c.full.slice(0, n); c.n = n; }
      if (x !== c.x) { c.cap.style.transform = x ? `translateX(${x}px)` : ''; c.x = x; }
      if (typing !== c.typing) { c.cap.classList.toggle('is-typing', typing); c.typing = typing; }
    };
    let raf = 0;
    const tick = (now) => {
      const box = root.getBoundingClientRect();
      caps.forEach(c => {
        const r = c.frame.getBoundingClientRect();
        const left = r.left - box.left;
        const right = left + r.width;
        if (right <= 0) { c.t0 = 0; draw(c, 0, 0, false); return; }  // off to the left: re-arm
        if (!c.t0 && left < 0 && right < r.width * START_AT) { draw(c, 0, 0, false); return; } // still coming in
        if (!c.t0) {
          // already fully in view (e.g. on load): settled, no typing
          c.t0 = left >= 0 ? -1 : now;
          c.widths = prefixWidths(c.cap, c.full);
        }
        let n = c.full.length;
        if (c.t0 > 0) {
          n = Math.min(n, Math.floor((now - c.t0) / CHAR_MS) + 1); // first letter lands at the start line
          // only as many letters as fit inside the entering frame, short of its
          // leading edge by the same inset that starts the typing (and room for the 3px caret)
          while (n > 0 && c.widths[n - 1] + 3 > right - r.width * START_AT) n--;
        }
        // held at the strip's edge until the frame's left edge reaches it
        const x = left < 0 ? -left : 0;
        draw(c, n, Math.round(x * 10) / 10, n < c.full.length);
      });
      raf = requestAnimationFrame(tick);
    };
    const io = new IntersectionObserver(([en]) => {
      cancelAnimationFrame(raf);
      if (en.isIntersecting) raf = requestAnimationFrame(tick);
    });
    io.observe(root);
    return () => {
      io.disconnect(); cancelAnimationFrame(raf);
      caps.forEach(c => { c.type.textContent = c.full; c.cap.style.transform = ''; c.cap.classList.remove('is-typing'); });
    };
  }, [items]);

  if (!items || !items.length) return null;
  const loop = [...items, ...items];
  return (
    <div className="proj-marquee" ref={rootRef} tabIndex={0} aria-label={label} data-gallery="">
      <div className="proj-marquee-track" ref={trackRef} style={{ animationDuration: `${dur}s` }}>
        {loop.map((m, i) => {
          const isVideo = /\.(mp4|mov|webm|ogg)$/i.test(m.src || '');
          return (
            <figure key={i} className={`proj-media-item proj-marquee-item k-${m.kind || 'desk'}`}
                    data-gallery-index={i % items.length}
                    aria-hidden={i >= items.length ? 'true' : undefined}>
              <div className={`proj-marquee-frame ${isVideo ? 'is-video' : ''}`}>
                {isVideo ? (
                  <video src={m.src} poster={m.poster} muted loop playsInline preload="none"
                         aria-label={i < items.length ? (m.caption || '') : undefined} />
                ) : (
                  <img src={m.src} alt={i < items.length ? (m.caption || '') : ''} />
                )}
              </div>
              {m.caption && (
                <figcaption className="proj-caption proj-marquee-cap" data-caption={m.caption}>
                  <span className="mq-type">{m.caption}</span>
                </figcaption>
              )}
            </figure>
          );
        })}
      </div>
    </div>
  );
}

function ProjectCompare({ data }) {
  if (!data || !data.columns || !data.rows) return null;
  const [a, b] = data.columns;
  return (
    <div className="proj-compare">
      <div className="proj-compare-grid" role="table" aria-label="Concept A versus Concept B">
        <div className="proj-compare-corner" role="columnheader">
          {data.corner && <span className="proj-compare-corner-title">{data.corner}</span>}
        </div>
        {data.columns.map((c, i) => (
          <div key={i} className="proj-compare-colhead" role="columnheader">
            <span className="proj-compare-col-title">{c.title}</span>
            {c.label && <span className="proj-compare-col-label">{c.label}</span>}
          </div>
        ))}
        {data.rows.map((r, i) => (
          <React.Fragment key={i}>
            <div className="proj-compare-dim" role="rowheader">{r.dim}</div>
            <div className="proj-compare-cell" role="cell">
              <span className="proj-compare-cell-tag">{a.title}</span>{r.a}
            </div>
            <div className="proj-compare-cell" role="cell">
              <span className="proj-compare-cell-tag">{b.title}</span>{r.b}
            </div>
          </React.Fragment>
        ))}
      </div>
      {data.note && <p className="proj-compare-note">{data.note}</p>}
    </div>
  );
}

/* ─── Parallax section - sticky full-width header + sticky text that releases when last item reaches top ─── */
/* Sticky title for two-column sections (≥960px, really side by side).
   The title sits in the pinned left column; its divider starts full width and
   shrinks to the column as the section reaches the top, then the title rides
   along with the text until the section is scrolled through. Sets:
     --rule-w on the head  (divider width)
     --head-h on the row   (right column drops by the title's height, so the
                            starting layout matches a full-width title)        */
const STICKY_TOP = 5 * 16;   /* matches the pinned block's top: 5rem */
const RULE_RANGE = 160;      /* px of scroll over which the divider shrinks */
function useStickyHeadRule(headRef, rowRef) {
  useEffect(() => {
    const head = headRef.current, row = rowRef.current;
    if (!head || !row) return;
    const mq = window.matchMedia('(min-width: 960px)');
    let raf = 0;
    const update = () => {
      raf = 0;
      const cols = mq.matches &&
        getComputedStyle(row).gridTemplateColumns.trim().split(/\s+/).length > 1;
      if (!cols) {
        head.style.removeProperty('--rule-w');
        row.style.removeProperty('--head-h');
        return;
      }
      const mb = parseFloat(getComputedStyle(head).marginBottom) || 0;
      row.style.setProperty('--head-h', `${head.offsetHeight + mb}px`);
      const full = row.clientWidth, col = head.offsetWidth;
      const top = row.getBoundingClientRect().top;
      const p = Math.min(1, Math.max(0, (STICKY_TOP + RULE_RANGE - top) / RULE_RANGE));
      head.style.setProperty('--rule-w', `${full + (col - full) * p}px`);
    };
    const schedule = () => { if (!raf) raf = requestAnimationFrame(update); };
    update();
    const ro = new ResizeObserver(schedule);
    ro.observe(row); ro.observe(head);
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    return () => {
      cancelAnimationFrame(raf); ro.disconnect();
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
    };
  }, []);
}

/* Two-column split (sideBySide) with the title riding in the text column */
function StickyHeadSplit({ title, children, media }) {
  const headRef = useRef(null);
  const rowRef = useRef(null);
  useStickyHeadRule(headRef, rowRef);
  return (
    <div ref={rowRef} className="proj-split is-cols has-head">
      <div className="proj-split-text">
        {React.cloneElement(title, { ref: headRef, className: `${title.props.className} proj-head-rule` })}
        {children}
      </div>
      {media}
    </div>
  );
}

function ParallaxSection({ s, isSub }) {
  const headerRef = useRef(null);
  const textRef = useRef(null);
  const mediaRef = useRef(null);
  const leftRef = useRef(null);
  const rowRef = useRef(null);
  useStickyHeadRule(headerRef, rowRef);

  useEffect(() => {
    const header = headerRef.current;
    const text = textRef.current;
    const media = mediaRef.current;
    const left = leftRef.current;
    if (!header || !text || !media || !left) return;
    const STICKY_OFFSET = 5 * 16; /* matches header top: 5rem */
    const mq = window.matchMedia('(min-width: 960px)');

    const update = () => {
      /* Only pin the text when the row really is two columns side by side. The
         width query alone isn't enough: the row can still render stacked (one grid
         track), and then the computed left-column height is just an empty gap. */
      const sideBySide = mq.matches &&
        getComputedStyle(left.parentElement).gridTemplateColumns.trim().split(/\s+/).length > 1;
      if (!sideBySide) {
        /* Single-column stacked layout, no sticky behavior - clear inline styles. */
        text.style.top = '';
        left.style.height = '';
        return;
      }
      /* the title rides inside the pinned block, so the block pins at the top */
      text.style.top = `${STICKY_OFFSET}px`;
      const items = media.children;
      if (!items.length) { left.style.height = ''; return; }
      const lastItem = items[items.length - 1];
      const rightColH = media.offsetHeight;
      const lastItemH = lastItem.offsetHeight;
      const textH = text.offsetHeight;
      /* Left col height = blockH + (rightColH - lastItemH), where the block is
         title + text and the right column sits --head-h lower than the left.
         The block releases when the left col's bottom reaches T + blockH
         → at that moment, last item top is exactly at T + --head-h (the text's slot).
         After release, text and items scroll up together as the section exits. */
      left.style.height = `${textH + Math.max(0, rightColH - lastItemH)}px`;
    };

    update();
    const ro = new ResizeObserver(update);
    ro.observe(media);
    ro.observe(text);
    ro.observe(header);
    window.addEventListener('resize', update);
    return () => { ro.disconnect(); window.removeEventListener('resize', update); };
  }, []);

  const renderMediaItem = (m, key) => {
    const mIsVideo = /\.(mp4|mov|webm|ogg)$/i.test(m.src || '');
    return (
      <figure key={key} className="proj-parallax-item">
        {m.placeholder ? (
          <div className="proj-media-placeholder"><span>Image placeholder</span></div>
        ) : mIsVideo ? (
          <video src={m.src} autoPlay loop muted playsInline preload="metadata" />
        ) : (
          <img src={m.src} alt={m.caption || ''} loading="lazy" />
        )}
        {m.caption && <figcaption className="proj-caption">{m.caption}</figcaption>}
      </figure>
    );
  };

  return (
    <div id={`s-${s.id}`} className="proj-section is-parallax">
      <div ref={rowRef} className="proj-parallax-row">
        <div ref={leftRef} className="proj-parallax-left">
          <div ref={textRef} className="proj-parallax-text">
            <header ref={headerRef} className="proj-parallax-header proj-head-rule">
              {isSub && <div className="proj-section-eyebrow">{s.groupLabel || s.group}</div>}
              <h2 className={`proj-section-title ${isSub ? 'is-sub' : ''}`}>{s.title}</h2>
            </header>
            {s.body?.map((para, i) => <p key={`b${i}`}>{para}</p>)}
            <SectionList s={s} />
            {s.outro?.map((para, i) => <p key={`o${i}`}>{para}</p>)}
          </div>
        </div>
        <div ref={mediaRef} className="proj-parallax-media">
          {s.leadMedia?.map((m, i) => renderMediaItem(m, `l${i}`))}
          {s.sideMarquee && <ProjectMarquee items={s.sideMarquee} label="Prototype recordings - slowly scrolling strip, hover to pause, click to open" />}
          {s.sideMedia && (
            <figure className="proj-parallax-item">
              {s.sideMedia.placeholder ? (
                <div className="proj-media-placeholder"><span>{s.sideMedia.label || 'Image placeholder'}</span></div>
              ) : s.sideMedia.diagram === 'user-flow' ? (
                <UserFlowDiagram />
              ) : /\.(mp4|mov|webm|ogg)$/i.test(s.sideMedia.src || '') ? (
                <video src={s.sideMedia.src} autoPlay loop muted playsInline preload="metadata" />
              ) : (
                <img src={s.sideMedia.src} alt={s.sideMedia.caption || ''} loading="lazy" />
              )}
              {s.sideMedia.caption && <figcaption className="proj-caption">{s.sideMedia.caption}</figcaption>}
            </figure>
          )}
          {s.media?.map((m, i) => renderMediaItem(m, `m${i}`))}
        </div>
      </div>
    </div>
  );
}

/* ─── Project page - one section (handles every section variant) ─── */

function CardIcon({ name }) {
  return (
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {CARD_ICONS[name]}
    </svg>
  );
}

/* A section's list - plain dash list, or cards (listStyle: 'cards') with optional icons */
function SectionList({ s }) {
  if (!s.list) return null;
  if (s.listStyle === 'cards') {
    return (
      <ul className={`proj-cards ${s.list.length === 4 ? 'is-2x2' : ''}`}>
        {s.list.map((it, i) => (
          <li key={i} className="proj-card">
            {it.icon && <span className="proj-card-icon"><CardIcon name={it.icon} /></span>}
            <h3 className="proj-card-title">{it.label}</h3>
            <p className="proj-card-text">{it.text}</p>
          </li>
        ))}
      </ul>
    );
  }
  return (
    <ul className="proj-list">
      {s.list.map((it, i) => (
        <li key={i}><strong>{it.label}</strong> {it.text}</li>
      ))}
    </ul>
  );
}

function ProjectSection({ s }) {
  const isSub = !!s.group;
  if (s.parallax && !s.placeholder) return <ParallaxSection s={s} isSub={isSub} />;
  const titleBlock = (
    <header className="proj-section-head">
      {isSub && <div className="proj-section-eyebrow">{s.groupLabel || s.group}</div>}
      <h2 className={`proj-section-title ${isSub ? 'is-sub' : ''}`}>{s.title}</h2>
    </header>
  );
  /* sideBySide splits carry their title in the pinned text column */
  const tabsHead = !s.placeholder && !!s.tabs;
  const splitHead = !tabsHead && !s.placeholder && !s.prototype &&
    ((s.sideBySide && !!(s.sideMedia || s.sideGallery)) || (s.mediaSplit === 'right' && !!s.media));
  const splitMedia = !splitHead ? null : s.mediaSplit === 'right' ? <ProjectMedia items={s.media} /> : s.sideGallery ? <SideGallery items={s.sideGallery} /> : (
    <figure className="proj-split-media proj-media-item k-wide">
      {s.sideMedia.placeholder ? (
        <div className="proj-media-placeholder"><span>{s.sideMedia.label || 'Image placeholder'}</span></div>
      ) : s.sideMedia.diagram === 'user-flow' ? (
        <UserFlowDiagram />
      ) : /\.(mp4|mov|webm|ogg)$/i.test(s.sideMedia.src || '') ? (

      <div id={`s-${s.id}`} className={`proj-section ${isSub ? 'is-sub' : ''}`}>

        <div className="outcome-grid">
          {s.items.map(it => (

                <SectionList s={s} />

          {s.problemRows && (

          {s.marquee && <ProjectMarquee items={s.marquee} />}
          {s.mediaRows && <ProjectMediaRows rows={s.mediaRows} idBase={s.id} />}
          {s.concepts && <ProjectConcepts concepts={s.concepts} idBase={s.id} />}
          {s.compare && <ProjectCompare data={s.compare} />}

          {s.beforeAfter && (
            <div className="proj-beforeafter">

                <figcaption><span className="ba-tag">Before</span>{s.beforeAfter.before.label}</figcaption>
              </figure>
              <figure>
                <img src={s.beforeAfter.after.src} alt={s.beforeAfter.after.label || 'after'} loading="lazy" />
                <figcaption><span className="ba-tag after">After</span>{s.beforeAfter.after.label}</figcaption>
              </figure>
            </div>

          {s.beforeAfterPairs && (
            <div className="proj-ba-pairs">
              {s.beforeAfterPairs.map((pair, i) => (
                <div key={i} className="proj-ba-pair">
                  <figure className="proj-media-item k-wide">
                    <img src={pair.before.src} alt={pair.before.label || 'before'} loading="lazy" />
                    <figcaption className="proj-caption"><span className="ba-tag">Before</span>{pair.before.label}</figcaption>
                  </figure>
                  <figure className="proj-media-item k-wide">
                    <img src={pair.after.src} alt={pair.after.label || 'after'} loading="lazy" />
                    <figcaption className="proj-caption"><span className="ba-tag after">After</span>{pair.after.label}</figcaption>
                  </figure>

          )}

      )}
    </div>
  );
}

/* ─── Project / case study page ─── */
function Project({ projectId, onBack, onOpen }) {
  const p = window.PROJECTS.find(x => x.id === projectId) || window.PROJECTS[0];
  const next = window.PROJECTS[(window.PROJECTS.indexOf(p) + 1) % window.PROJECTS.length];
  const [activeSection, setActiveSection] = useState(p.sections[0].id);
  const atmosRef = useRef(null);
  useEffect(() => {
    const onScroll = () => {
      let cur = p.sections[0].id;
      for (const s of p.sections) {
        const el = document.getElementById('s-' + s.id);
        // getBoundingClientRect().top is viewport-relative, so it stays correct
        // regardless of offsetParent (.proj-content is positioned for the atmos
        // layer, which broke the old offsetTop-vs-scrollY comparison).
        if (el && el.getBoundingClientRect().top <= 220) cur = s.id;
      }
      // Short trailing sections can't scroll under the threshold near the
      // footer — pin the last section once the page is scrolled to the bottom.
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
        cur = p.sections[p.sections.length - 1].id;
      }
      setActiveSection(cur);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [p]);

  /* When the contents list scrolls inside the rail (long lists), keep the
     active entry in view. Moves the rail's own scroll only, never the page. */
  useEffect(() => {
    const rail = document.querySelector('.proj-sidebar');
    const a = rail && rail.querySelector('.sidebar-nav a.active');
    if (!a || rail.scrollHeight <= rail.clientHeight) return;
    const top = a.offsetTop, bottom = top + a.offsetHeight, PAD = 48;
    if (top - PAD < rail.scrollTop) rail.scrollTop = top - PAD;
    else if (bottom + PAD > rail.scrollTop + rail.clientHeight) rail.scrollTop = bottom + PAD - rail.clientHeight;
  }, [activeSection]);

  /* ─── Atmospheric background ────────────────────────────────────────
     Blend the page ground toward a subtle Signal hue as the reader
     passes contextual regions (sections carrying an `atmos` key), then
     back to ground. The colour is a live interpolation between section
     centres, so it tracks lazy-loaded layout shifts and reads as one
     slow, full-width wash rather than discrete bands. Mode-aware: each
     hue and the ground have a dark + light value; the mix strength is
     kept low for subtlety (a touch stronger in dark, where near-black
     hides colour). */
  useEffect(() => {
    const el = atmosRef.current;
    if (!el) return;
    const GROUND = { dark: [20, 19, 26], light: [244, 242, 236] };
    const HUE = document.documentElement.dataset.palette === 'testcard' ? {
      /* the test card's bars (dark) and their AA text tones (light) */
      tomato: { dark: [209, 69, 67],   light: [189, 46, 48] },
      sky:    { dark: [176, 219, 222], light: [71, 106, 109] },
      sage:   { dark: [115, 184, 116], light: [53, 110, 55] },
      orchid: { dark: [224, 155, 190], light: [132, 72, 104] },
      indigo: { dark: [88, 103, 180],  light: [51, 62, 129] },
    } : {
      tomato: { dark: [242, 84, 80],  light: [196, 32, 24] },
      sky:    { dark: [91, 196, 232], light: [19, 107, 146] },
      sage:   { dark: [54, 150, 104],  light: [26, 96, 68] },
      orchid: { dark: [176, 91, 168], light: [96, 48, 150] },
      indigo: { dark: [122, 146, 224], light: [42, 63, 133] },
    };
    /* the live --ground, so a page palette's ground is what the wash returns to */
    const groundNow = (mode) => {
      const hex = getComputedStyle(document.documentElement).getPropertyValue('--ground').trim();
      const m = /^#([0-9a-f]{6})$/i.exec(hex);
      return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : GROUND[mode];
    };
    const STRENGTH = { dark: 0.22, light: 0.14 };
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const smooth = t => t * t * (3 - 2 * t);
    let raf = 0, lastMode = null;
    const compute = () => {
      raf = 0;
      const mode = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      if (lastMode !== null && mode !== lastMode) {
        // ease the whole wash across a theme swap, then hand back to scroll
        el.style.transition = 'background-color .6s var(--expo)';
        clearTimeout(compute._t);
        compute._t = setTimeout(() => { el.style.transition = 'none'; }, 640);
      }
      lastMode = mode;
      // Each tinted section owns a wash centred on the section: full tint
      // while the viewport centre is within HOLD of it, then a gradual RAMP
      // back to ground. Spans scale to viewport height, so a shift lasts a
      // long, even stretch of scrolling with neutral gaps between zones.
      const ih = window.innerHeight || 800;
      const HOLD = ih * 0.85, RAMP = ih * 0.9;
      const ref = window.scrollY + ih * 0.5;

      // Anchors: explicit `atmos` keys win (per-section, hand-placed - e.g.
      // Help Center). With none, auto-distribute evenly across the content
      // span so every project page gets the same even-spread, long-hold
      // treatment for free, with the zone count scaled to page length.
      const anchors = [];
      for (const s of p.sections) {
        if (!s.atmos || !HUE[s.atmos]) continue;
        const node = document.getElementById('s-' + s.id);
        if (!node) continue;
        const r = node.getBoundingClientRect();
        anchors.push({ center: r.top + window.scrollY + r.height / 2, hue: HUE[s.atmos][mode] });
      }
      if (!anchors.length) {
        const first = document.getElementById('s-' + p.sections[0].id);
        const last = document.getElementById('s-' + p.sections[p.sections.length - 1].id);
        if (first && last) {
          const fr = first.getBoundingClientRect(), lr = last.getBoundingClientRect();
          const top = fr.top + window.scrollY;
          const span = (lr.top + window.scrollY + lr.height) - top;
          const SEQ = ['orchid', 'sky', 'sage', 'indigo'];
          const N = Math.max(1, Math.min(4, Math.round(span / (ih * 4.5))));
          for (let i = 0; i < N; i++) {
            anchors.push({ center: top + span * (i + 0.5) / N, hue: HUE[SEQ[i % SEQ.length]][mode] });
          }
        }
      }

      let bestW = 0, bestHue = null;
      for (const a of anchors) {
        const d = Math.abs(ref - a.center);
        const w = d <= HOLD ? 1 : d >= HOLD + RAMP ? 0 : 1 - smooth((d - HOLD) / RAMP);
        if (w > bestW) { bestW = w; bestHue = a.hue; }
      }
      const g = groundNow(mode);
      const color = bestHue ? mix(g, bestHue, STRENGTH[mode] * bestW) : g;
      const rgb = `rgb(${color.join(',')})`;
      el.style.backgroundColor = rgb;
      // Publish the live wash colour so opaque sticky surfaces (parallax
      // section headers) can match it instead of painting a flat --ground
      // box on top of the tint.
      if (el.parentElement) el.parentElement.style.setProperty('--atmos', rgb);
    };
    const schedule = () => { if (!raf) raf = requestAnimationFrame(compute); };
    compute();
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    const mo = new MutationObserver(schedule);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    const ro = new ResizeObserver(schedule);
    if (el.parentElement) ro.observe(el.parentElement);
    return () => {
      window.removeEventListener('scroll', schedule);
      window.removeEventListener('resize', schedule);
      mo.disconnect(); ro.disconnect();
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(compute._t);
    };
  }, [p]);
  return (
    <div className="page active proj-page">
      <div className="proj-atmos" aria-hidden="true" ref={atmosRef} />
      <a className="back-btn" href="#" onClick={e => { e.preventDefault(); onBack(); }}>
        <span>←</span> All work
      </a>

      <section className="proj-hero">
        <div className="proj-hero-inner">
          <div>
            <div className="proj-eyebrow">
              {p.company ? `${p.company} · ` : ''}{kindLabel(p)} · {p.year}
            </div>
            <h1 className="proj-hero-title">{p.title}<br/><em>{p.subtitle}</em></h1>
            <p className="proj-summary">{p.summary}</p>
            {p.statusNote && <p className="proj-status-note">{p.statusNote}</p>}
          </div>
          <div className="proj-meta">
            {p.role && <div className="row"><div className="k">Role</div><div className="v">{p.role}</div></div>}
            {p.timeline && <div className="row"><div className="k">Timeline</div><div className="v">{p.timeline}</div></div>}
            {p.platform && <div className="row"><div className="k">Platform</div><div className="v">{p.platform}</div></div>}
            {p.team && <div className="row"><div className="k">Team</div><div className="v">{p.team}</div></div>}
            {p.tags && <div className="row"><div className="k">Tags</div><div className="v">{p.tags.join(' · ')}</div></div>}
          </div>
        </div>
      </section>

      {p.heroImage ? (
        <div className={`proj-hero-image ${p.heroBare ? 'is-bare' : ''} ${p.heroContained ? 'is-contained' : ''}`}>
          <img src={p.heroImage} alt={`${p.title} - hero`} loading="eager" />
        </div>
      ) : p.heroPlaceholder ? (
        <figure className="proj-hero-image is-placeholder">
          <div className="proj-hero-ph"><span>{p.heroPlaceholder.label || 'Image placeholder'}</span></div>
          {p.heroPlaceholder.caption && (
            <figcaption className="proj-caption">{p.heroPlaceholder.caption}</figcaption>
          )}
        </figure>
      ) : null}

      {/* an explicitly empty gallery (gallery: []) renders nothing; other projects unchanged */}
      {!(Array.isArray(p.gallery) && p.gallery.length === 0) && <div className="proj-gallery">
        {(p.gallery || []).map((g, i) => (
          <div key={i} className={`g-cell ${g.kind} ${g.src ? 'has-img' : ''}`}
               style={!g.src ? { background: g.tone } : undefined}>
            {g.src ? (
              <img className="g-img" src={g.src} alt={g.label || ''} loading="lazy" />
            ) : (
              <div className="g-fill">- {g.label}</div>
            )}
          </div>
        ))}
      </div>}

      <div className="proj-content">
        <aside className="proj-sidebar">
          <div className="sidebar-label">Contents</div>
          <ul className="sidebar-nav">
            {p.sections.map((s, i) => {
              const prev = p.sections[i - 1];
              const showGroupHeader = s.group && (!prev || prev.group !== s.group);
              return (
                <React.Fragment key={s.id}>
                  {showGroupHeader && (
                    <li className="sidebar-group-label" aria-hidden="true">
                      {s.groupLabel || s.group}
                    </li>
                  )}
                  <li className={s.group ? 'is-sub' : ''}>
                    <a href={`#s-${s.id}`} className={activeSection === s.id ? 'active' : ''}>{s.title}</a>
                  </li>
                </React.Fragment>
              );
            })}
          </ul>
        </aside>
        <div className="proj-pane">
          {p.sections.map(s => <ProjectSection key={s.id} s={s} />)}
        </div>
      </div>

      <div className="next-proj" onClick={() => onOpen(next.id)} data-hover>
        <div>
          <div className="next-label">Next project</div>
          <div className="next-title">{next.title}</div>
        </div>
        <div className="next-arrow">→</div>
      </div>
      <footer>
        <span>© 2026 Raz Silberman</span>
        <a href="#" onClick={e => { e.preventDefault(); onBack(); }}>← Back to work</a>
      </footer>
    </div>
  );
}

/* ─── Cmd-K palette ─── */
function CmdK({ open, onClose, setPage, openProject, toggleTheme }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => {
    if (open) { setQ(''); setSel(0); setTimeout(() => inputRef.current?.focus(), 50); }
  }, [open]);
  const all = useMemo(() => [
    { group: 'Pages', label: 'Home',   sub: '↵', action: () => setPage('home') },
    { group: 'Pages', label: 'Work',   sub: '↵', action: () => setPage('work') },
    { group: 'Pages', label: 'About',  sub: '↵', action: () => setPage('about') },
    { group: 'Pages', label: 'Resume', sub: '↵', action: () => setPage('resume') },
    ...window.PROJECTS.map(p => ({
      group: 'Projects', label: p.title, sub: kindLabel(p),
      action: () => openProject(p.id),
    })),
    { group: 'Actions', label: 'Toggle theme', sub: '⇧⌘L', action: toggleTheme },
  ], [setPage, openProject, toggleTheme]);
  const filtered = useMemo(() => {
    if (!q) return all;
    return all.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));
  }, [q, all]);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(s + 1, filtered.length - 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
      else if (e.key === 'Enter')   {
        e.preventDefault();
        filtered[sel]?.action(); onClose();
      } else if (e.key === 'Escape') { onClose(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, filtered, sel, onClose]);
  // group items
  const groups = useMemo(() => {
    const map = {};
    filtered.forEach((it, i) => {
      (map[it.group] = map[it.group] || []).push({ ...it, _i: i });
    });
    return map;
  }, [filtered]);
  return (
    <div className={`cmdk-overlay ${open ? 'open' : ''}`} onClick={onClose}>
      <div className="cmdk" onClick={e => e.stopPropagation()}>
        <div className="cmdk-input-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
          </svg>
          <input ref={inputRef} className="cmdk-input"
                 placeholder="Search pages, projects, actions…"
                 value={q} onChange={e => { setQ(e.target.value); setSel(0); }} />
          <span className="kbd">esc</span>
        </div>
        <div className="cmdk-list">
          {Object.entries(groups).map(([g, items]) => (
            <div key={g}>
              <div className="cmdk-group">{g}</div>
              {items.map(it => (
                <div key={it.label} className={`cmdk-item ${it._i === sel ? 'sel' : ''}`}
                     onMouseEnter={() => setSel(it._i)}
                     onClick={() => { it.action(); onClose(); }}>
                  <span className="ic">{g === 'Projects' ? '◆' : g === 'Actions' ? '◇' : '↗'}</span>
                  <span className="lbl">{it.label}</span>
                  <span className="sub">{it.sub}</span>
                </div>
              ))}
            </div>
          ))}
          {filtered.length === 0 && (
            <div className="cmdk-item"><span className="lbl" style={{color:'var(--muted)'}}>No results</span></div>
          )}
        </div>
      </div>
    </div>
  );
}
