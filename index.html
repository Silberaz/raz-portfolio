  opacity: .45; cursor: pointer; transition: opacity .2s, transform .2s, border-color .2s;
}
.lightbox-thumb img {
  display: block; width: 100%; height: 100%; object-fit: cover;
  border: 0; border-radius: 0; box-shadow: none; max-height: none; cursor: pointer;
}
.lightbox-thumb:hover { opacity: .8; }
.lightbox-thumb.active { opacity: 1; border-color: var(--accent); transform: translateY(-2px); }
@media (max-width: 639px) {
  .lightbox-nav { width: 40px; height: 40px; top: auto; bottom: 5.75rem; transform: none; }
  .lightbox-nav:hover { transform: scale(1.08); }
  .lightbox-thumb { width: 64px; }
  .lightbox.is-gallery { padding-bottom: calc(1rem + 120px); }
}
@media (prefers-reduced-motion: reduce) {
  .lightbox-figure.swap-next, .lightbox-figure.swap-prev { animation: none; }
}

/* zoom-in affordance on the images that open in the lightbox
   (only visible when the custom blob cursor is toggled off) */
.proj-media-item img,
.proj-media-item video,
.proj-hero-image img,
.proj-side-gallery-frame img,
.problem-img img { cursor: zoom-in; }

/* ─── Responsive - small tablet (≥640px) ───
   Two-column upgrades that work on iPad portrait but not on phones. */
@media (min-width: 640px) {
  .work-grid.polaroid { grid-template-columns: 1fr 1fr; }
  .polaroid .tile.wide { grid-column: span 2; }
  .proj-gallery { grid-template-columns: 1fr 1fr; }
  .proj-gallery .g-cell.wide { grid-column: span 2; }
  .proj-beforeafter { grid-template-columns: 1fr 1fr; }
  .proj-media.thumbs { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .outcome-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ─── Responsive - desktop (≥960px) ───
   Full multi-column layouts, sticky sidebars, larger section padding,
   and nav links return. This is the primary "desktop break" - most
   layout shifts happen here. */
@media (min-width: 960px) {
  /* Nav */
  nav.top { padding: 1.5rem var(--pad-x); }
  nav.top.compact { padding: .9rem var(--pad-x); }
  .nav-right { gap: 2.25rem; }
  .nav-links { display: flex; }
  .nav-actions { display: flex; }
  /* Burger + overlay are mobile-only */
  .burger { display: none; }
  .mobile-menu { display: none; }

  /* Hero */
  .hero { padding: 8rem var(--pad-x) 5rem; min-height: 100vh; }
  .hero[data-align="top"]    { padding-top: 9rem; }
  .hero[data-align="bottom"] { padding-bottom: 6rem; }
  .hero-bottom {
    flex-direction: row; align-items: flex-end;
    margin-top: 4rem; gap: 3rem;
  }
  .hero-meta { align-items: flex-end; text-align: right; }

  /* Section padding */
  .section { padding: 6rem var(--pad-x); }
  .work-grid { gap: 1.5rem; }

  /* Fullbleed tile - restore 4-col grid with tags column */
  .fullbleed .tile {
    grid-template-columns: 80px 1fr 1fr 80px;
    gap: 2rem; padding: 2.5rem 0;
  }
  .fullbleed .tile .tile-tags { display: block; }

  /* Index tile - restore 5-col grid */
  .index .tile {
    grid-template-columns: 60px 2.6fr 1.4fr 1fr 80px;
    gap: 1.5rem;
  }
  .index .tile .tile-tags,
  .index .tile .tile-year { display: block; }

  /* About - 2-col with sticky photo */
  .about {
    grid-template-columns: 1fr 1.4fr;
    gap: 5rem; padding: 6rem var(--pad-x);
  }
  .about-photo-col { position: sticky; top: 5rem; }

  /* Contact */
  .contact { padding: 8rem var(--pad-x); }

  /* Project page */
  .back-btn { padding: 6rem var(--pad-x) 1rem; }
  .proj-hero { padding: 2rem var(--pad-x) 4rem; }
  .proj-hero-inner { grid-template-columns: 2fr 1fr; gap: 3rem; }
  .proj-content {
    grid-template-columns: 220px 1fr; gap: 4rem;
    padding: 5rem var(--pad-x);
  }
  .proj-sidebar { position: sticky; top: 5rem; }
  .proj-hero-image img { max-height: 78vh; }

  /* Project split / parallax / problem rows: their desktop rules sit after
     each base rule further down, so the cascade doesn't fold them back. */

  /* Resume */
  .resume { padding: 8rem var(--pad-x) 4rem; }
  .resume-head {
    grid-template-columns: 1fr auto;
    gap: 3rem; padding-bottom: 3rem; margin-bottom: 3rem;
  }
  .resume-contact { text-align: right; }
  .resume-row { grid-template-columns: 160px 1fr; gap: 2.5rem; }

  /* Company head */
  .company-head { grid-template-columns: 1fr auto; gap: 2rem; }
  .company-meta { text-align: right; }
}

/* ─── Density ─── */
[data-density="loose"]   .section, [data-density="loose"]   .about, [data-density="loose"]   .contact { padding-top: 8rem; padding-bottom: 8rem; }
[data-density="dense"]   .section, [data-density="dense"]   .about, [data-density="dense"]   .contact { padding-top: 4rem; padding-bottom: 4rem; }
[data-density="dense"]   .work-grid { gap: 1rem; }
[data-density="loose"]   .work-grid { gap: 2rem; }
/* Work grid - group each tile with its own caption (proximity): the caption
   hugs its image (small padding above), and a wider row-gap clearly separates
   one tile from the next so the title's ownership is unambiguous. */
.work-grid.polaroid { row-gap: 2.5rem; }

/* ─── Display weight swap ─────────────────────────────────────────────
   The tweaks-panel picker doesn't swap families - it slides
   --ff-display-weight along Montserrat's wght axis. Keys are named for the
   axis position they land on; `black` is the shipped default. (The old
   family keys - philephant / sleeper / editorial / afacad / serif / mono /
   sans - are gone.) */
[data-display-font="black"]      { --ff-display-weight: var(--fw-black); }
[data-display-font="extrabold"]  { --ff-display-weight: var(--fw-extrabold); }
[data-display-font="bold"]       { --ff-display-weight: var(--fw-bold); }
[data-display-font="semibold"]   { --ff-display-weight: var(--fw-semibold); }
[data-display-font="medium"]     { --ff-display-weight: var(--fw-medium); }
[data-display-font="regular"]    { --ff-display-weight: var(--fw-regular); }
[data-display-font="light"]      { --ff-display-weight: var(--fw-light); }

/* The "Voice Rule" - now deliberately silent
   ──────────────────────────────────────────
   This used to be the design's core contrast: a personal voice (Instrument
   Serif, later Raleway) against a system voice (Geist, later Montserrat).
   The reference system has no such split - on that site an artwork title
   is 14.4px/400/1.5, character for character identical to a paragraph -
   so the rule survives only as descender guards and the italic grammar.

   The selectors are kept rather than deleted because they are where the
   contrast goes back if you ever want it: point --ff-voice at a second
   family and raise the weights here, and the personal voice returns
   without touching anything else. */

/* Hero + contact: the big personal moments. */
.hero-title,
.contact-headline {
  font-family: var(--ff-voice);
  font-weight: var(--fw-regular);
  padding-bottom: 0.12em; /* room for descenders inside any clip-reveal/overflow parent */
}
/* The site hero is display type - reference leading, no tracking. */
.hero-title {
  letter-spacing: var(--ls-display);
  line-height: var(--lh-display);
}
/* The contact headline sits at base size now, so it keeps text metrics. */
.contact-headline {
  letter-spacing: var(--ls-base);
  line-height: var(--lh-text);
}
/* About headline: same voice, keeps its own size-appropriate spacing,
   but reserves padding for descenders so the .clip-reveal clip-path
   doesn't cut the "g"s on the last line. */
.about-headline {
  font-family: var(--ff-voice);
  font-weight: var(--fw-regular);
  padding-bottom: 0.2em;
}
/* Italic emphasis in any personal-voice context */
.hero-title em,
.contact-headline em,
.about em,
.proj-hero-title em {
  font-family: var(--ff-voice);
  font-style: italic;
  font-weight: var(--fw-regular);
}

/* ─── Hero alignment helper ─── */
.hero[data-align="center"] { text-align: left; }


/* ─── Case study - extended section infrastructure ─── */

/* Hero image (rendered between proj-hero and proj-gallery) */
.proj-hero-image {
  border-top: 1px solid var(--rim-soft);
  border-bottom: 1px solid var(--rim-soft);
  background: var(--surface);
  display: block;
}
.proj-hero-image img {
  display: block; width: 100%; height: auto; max-height: 50vh; object-fit: cover;
}
/* Contained hero - image sits inside the page gutters, full width, natural height (never crops) */
.proj-hero-image.is-contained {
  border: none; background: transparent;
  padding: 2.5rem var(--pad-x) 1rem;
}
.proj-hero-image.is-contained img {
  width: 100%; height: auto; max-height: none;
  border-radius: 4px;
}
/* Bare hero - device mockup floats on the page, no frame, no crop */
.proj-hero-image.is-bare {
  border: none;
  background: transparent;
  padding: 2.5rem var(--pad-x) 1rem;
}
.proj-hero-image.is-bare img {
  width: 100%; height: auto; max-height: 74vh;
  object-fit: contain; object-position: center;
  margin: 0 auto;
}

/* Hero placeholder - same slot as the hero image, awaiting a real asset */
.proj-hero-image.is-placeholder {
  border: none; background: transparent;
  margin: 0;
  padding: 2.5rem var(--pad-x) 1rem;
  display: flex; flex-direction: column; gap: .65rem;
}
.proj-hero-ph {
  width: 100%; aspect-ratio: 16 / 9; max-height: 60vh;
  background: var(--surface);
  border: 1px dashed var(--rim-soft); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none;
}

/* Gallery - real images replace the hatched placeholders */
.g-cell.has-img { background: var(--surface); }
.g-cell.has-img::before { display: none; }
.g-cell .g-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform .6s var(--expo);
}
.g-cell.has-img:hover .g-img { transform: scale(1.02); }

/* Bolded-label list - used for Problem, Goals, Research, Insights */
.proj-list {
  list-style: none; padding: 0; margin: .25rem 0 1.5rem;
  max-width: 42rem;
  display: flex; flex-direction: column; gap: 1rem;
}
.proj-list li {
  position: relative; padding-left: 1.25rem;
  font-size: var(--fs-base); color: var(--ink-dim); line-height: var(--lh-text);
}
.proj-list li::before {
  content: ''; position: absolute; left: 0; top: .7em;
  width: .6rem; height: 1px; background: var(--accent);
}
.proj-list li strong {
  color: var(--ink); font-weight: var(--fw-regular); margin-right: .35rem;
}

/* Card list (listStyle: 'cards') - one card per item, three across on wide screens */
.proj-cards {
  list-style: none; padding: 0; margin: .25rem 0 1.5rem;
  display: grid; grid-template-columns: 1fr; gap: 1rem;
}
@media (min-width: 960px) {
  .proj-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* four cards read as a 2x2 block instead of three plus an orphan */
  .proj-cards.is-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.proj-card {
  display: flex; flex-direction: column; gap: .75rem;
  padding: 1.5rem;
  background: var(--surface);
  border-radius: 6px;
}
.proj-card-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.5rem; height: 2.5rem; margin-bottom: .25rem;
  border: 1px solid var(--rim); border-radius: 6px;
  color: var(--accent);
}
.proj-card-title {
  margin: 0; font-size: var(--fs-base); font-weight: var(--fw-regular);
  color: var(--ink); line-height: var(--lh-text);
}
.proj-card-text {
  margin: 0; font-size: var(--fs-base); color: var(--ink-dim); line-height: var(--lh-text);
}

/* Media - large stack OR small-thumb grid */
.proj-media {
  margin: 2rem 0 2.5rem;
  display: flex; flex-direction: column; gap: 1.75rem;
}
.proj-media.thumbs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}
.proj-media-item { margin: 0; display: flex; flex-direction: column; gap: .65rem; }
.proj-media-item img,
.proj-media-item video {
  display: block; width: 100%; height: auto;
  background: var(--surface);
  border: 1px solid var(--rim-soft); border-radius: 4px;
}
.proj-media-item.k-sq img    { aspect-ratio: 4 / 3;  object-fit: cover; }
.proj-media-item.k-tall img  { aspect-ratio: 3 / 4;  object-fit: cover; }
.proj-media.thumbs .proj-media-item img { aspect-ratio: 16 / 9; object-fit: cover; object-position: top; }
.proj-media-placeholder {
  width: 100%; aspect-ratio: 16 / 9;
  background: var(--surface);
  border: 1px dashed var(--rim-soft);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none;
}
.proj-media-item.k-sq   .proj-media-placeholder { aspect-ratio: 4 / 3; }
/* Trio - three equal tiles in a row (kind: 'third'); stacked on phones */
.proj-media.trio { display: grid; grid-template-columns: 1fr; gap: 1rem; align-items: start; }
.proj-media-item.k-third .proj-media-placeholder { aspect-ratio: 4 / 3; }
@container pane (min-width: 600px) {
  .proj-media.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Mosaic - tall item left, stacked items right; one column on phones */
.proj-mosaic {
  display: grid; grid-template-columns: 1fr; gap: 1.75rem;
  margin: 2rem 0 1.75rem;
}
.proj-mosaic-side { display: flex; flex-direction: column; gap: 1.75rem; min-width: 0; }
.proj-mosaic-item { min-width: 0; }
/* images carry their own corners/shadows - no box behind them */
.proj-mosaic-item img { background: none; border: 0; border-radius: 0; }
.proj-mosaic-item.is-side .proj-media-placeholder { aspect-ratio: 16 / 10; }
.proj-mosaic-item.is-main .proj-media-placeholder { aspect-ratio: 2 / 3; }
@media (min-width: 640px) {
  .proj-mosaic { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.25rem; align-items: stretch; }
  .proj-mosaic-side { gap: 1.25rem; }
  /* the tall placeholder matches the right column's height */
  .proj-mosaic-item.is-main { height: 100%; }
  .proj-mosaic-item.is-main .proj-media-placeholder { aspect-ratio: auto; flex: 1 1 auto; min-height: 0; }
  /* With a fill item, the left item alone sets the row height (the side column
     contributes 0 and stretches to it); the fill item takes whatever height is
     left, cropped from the bottom, so the last side item lines up with the left. */
  .proj-mosaic:has(.is-fill) .proj-mosaic-side { height: 0; min-height: 100%; }
  .proj-mosaic-item.is-fill { flex: 1 1 0; min-height: 0; }
  .proj-mosaic-item.is-fill img {
    flex: 1 1 0; min-height: 0; width: 100%;
    object-fit: cover; object-position: top;
    border-radius: 6px;
  }
}
.proj-media-item.k-tall .proj-media-placeholder { aspect-ratio: 3 / 4; }
.proj-media-item.k-half { width: calc(50% - 1.25rem); align-self: flex-end; }

/* Media rows - one row per group (e.g. one wireframe concept). Every row
   shares the column count of the LONGEST row, so a screen is the same size
   everywhere and a short row simply ends early instead of scaling up. */
.proj-media-rows { margin: 2rem 0 2.5rem; display: flex; flex-direction: column; gap: 2.25rem; }
.proj-media-row-label {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none; color: var(--accent);
  margin: 0 0 .85rem;
}
.proj-media-row-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
.proj-media-rows .proj-media-item img { aspect-ratio: 16 / 9; object-fit: cover; object-position: top; }
@media (min-width: 720px) {
  .proj-media-row-grid { grid-template-columns: repeat(var(--mr-cols, 3), 1fr); }
}
/* Concept accordion - screens left, concepts right; stacked in a narrow pane */
.proj-concepts { margin: 2rem 0 2.5rem; display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); }
.proj-concepts-list { border-bottom: 1px solid var(--rim); }
.proj-concept { border-top: 1px solid var(--rim); }
.proj-concept-head { margin: 0; }
.proj-concept-head button {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  width: 100%; padding: 1rem 0; border: 0; background: none; cursor: pointer;
  font: inherit; font-weight: var(--fw-medium, 500); text-align: left; color: var(--ink-dim);
  transition: color .2s;
}
.proj-concept-head button:hover, .proj-concept.is-open .proj-concept-head button { color: var(--ink); }
.proj-concept-icon { color: var(--ink-dim); transition: color .2s; }
.proj-concept.is-open .proj-concept-icon { color: var(--accent); }
/* Bodies slide between 0fr and 1fr rows, so the opening item pushes the
   closing one shut over the same duration and the list height stays steady. */
.proj-concept-body {
  display: grid; grid-template-rows: 0fr; opacity: 0;
  transition: grid-template-rows .45s cubic-bezier(.4, 0, .2, 1), opacity .3s ease;
}
.proj-concept.is-open .proj-concept-body { grid-template-rows: 1fr; opacity: 1; transition-delay: 0s, .1s; }
.proj-concept-body-inner { min-height: 0; overflow: hidden; }
.proj-concept-body-inner > :last-child { padding-bottom: 1rem; }
/* a "+" whose vertical bar folds flat into a "−" when the item opens */
.proj-concept-icon { position: relative; flex: none; width: 12px; height: 12px; }
.proj-concept-icon::before, .proj-concept-icon::after {
  content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1.5px;
  margin-top: -.75px; background: currentColor;
  transition: transform .45s cubic-bezier(.4, 0, .2, 1);
}
.proj-concept-icon::after { transform: rotate(90deg); }
.proj-concept.is-open .proj-concept-icon::after { transform: rotate(0deg); }
/* all layers share one grid cell; the open one fades and settles in over the old */
.proj-concepts-media { display: grid; }
.proj-concepts-layer {
  grid-area: 1 / 1; opacity: 0; visibility: hidden; transform: scale(.985);
  transition: opacity .55s ease, transform .55s cubic-bezier(.2, 0, 0, 1), visibility 0s linear .55s;
}
.proj-concepts-layer.is-open {
  opacity: 1; visibility: visible; transform: none; z-index: 1;
  transition: opacity .55s ease, transform .55s cubic-bezier(.2, 0, 0, 1), visibility 0s;
}
@media (prefers-reduced-motion: reduce) {
  .proj-concept-body, .proj-concept-icon::after, .proj-concepts-layer { transition: none; }
}
.proj-concept-body p { margin: 0 0 .75rem; color: var(--ink-dim); }
.proj-concept-body p:last-child { margin-bottom: 0; }
@container pane (min-width: 700px) {
  .proj-concepts { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 2.5rem; align-items: start; }
}

/* Annotated screenshots - a "+" pinned over each highlighted region that
   opens a short note on hover or keyboard focus. The layer is click-through
   so the image underneath still opens in the lightbox. */
.proj-hot-frame { position: relative; display: block; container-type: inline-size; }
.proj-hot-layer { position: absolute; inset: 0; pointer-events: none; }
.proj-hot { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }
.proj-hot-dot {
  width: 1.75rem; height: 1.75rem; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: help;
  font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); line-height: 1;
  color: var(--accent-text-on); background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-lo), 0 2px 8px rgba(0,0,0,.35);
  transition: transform .18s ease, box-shadow .18s ease;
}
.proj-hot:hover .proj-hot-dot,
.proj-hot:focus-within .proj-hot-dot {
  transform: scale(1.15); box-shadow: 0 0 0 6px var(--accent-lo), 0 2px 10px rgba(0,0,0,.4);
}
.proj-hot-pop {
  position: absolute; top: calc(100% + .55rem); z-index: 4;
  width: min(20rem, 94cqw);
  background: var(--surface); border: 1px solid var(--rim);
  border-radius: 4px; padding: .8rem .9rem;
  opacity: 0; pointer-events: none; transform: translateY(-.3rem);
  transition: opacity .18s ease, transform .18s ease;
}
/* invisible bridge across the gap to the marker, so the pointer can travel
   onto the note without hover being lost (WCAG 1.4.13 "hoverable") */
.proj-hot-pop::before { content: ''; position: absolute; left: 0; right: 0; height: .8rem; }
.proj-hot.is-down .proj-hot-pop::before { top: -.8rem; }
.proj-hot.is-up   .proj-hot-pop::before { bottom: -.8rem; }
.proj-hot.is-right .proj-hot-pop { left:  -.75rem; }
.proj-hot.is-left  .proj-hot-pop { right: -.75rem; }
/* markers low in the frame open upward so the note can't spill past the
   image and collide with the caption */
.proj-hot.is-up .proj-hot-pop { top: auto; bottom: calc(100% + .55rem); transform: translateY(.3rem); }
.proj-hot.is-up:hover .proj-hot-pop,
.proj-hot.is-up:focus-within .proj-hot-pop { transform: translateY(0); }
.proj-hot:hover .proj-hot-pop,
.proj-hot:focus-within .proj-hot-pop { opacity: 1; pointer-events: auto; transform: translateY(0); }
/* Escape closes the note without moving the pointer (WCAG 1.4.13 "dismissible");
   it re-arms as soon as the pointer or focus leaves the marker. */
.proj-hot.is-dismissed:hover .proj-hot-pop,
.proj-hot.is-dismissed:focus-within .proj-hot-pop { opacity: 0; pointer-events: none; }
.proj-hot-title {
  display: block; font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); letter-spacing: var(--ls-base); text-transform: none;
  color: var(--accent); margin-bottom: .4rem;
}
.proj-hot-pop p {
  margin: 0; max-width: none;
  font-size: var(--fs-base); line-height: var(--lh-text); color: var(--ink-dim);
}
@media (prefers-reduced-motion: reduce) {
  .proj-hot-dot, .proj-hot-pop { transition: none; }
}
/* Concept prototype/video slot - full-width blank hero above the screen gallery */
.proj-proto-slot { margin: 1.75rem 0 2.25rem; }
.proj-proto-slot .proj-media-placeholder { aspect-ratio: 16 / 9; }
/* Bare media - image floats with no frame (transparent PNG, e.g. panel mosaic) */
.proj-media-item.is-bare img {
  background: transparent;
  border: none;
  border-radius: 0;
}

/* Divider under a title that rides in a pinned column: drawn as a line whose
   width (--rule-w, set by useStickyHeadRule) runs from full row width down to
   the column as the section reaches the top. Full width when stacked. */
.proj-head-rule { position: relative; border-bottom: 0 !important; }
.proj-head-rule::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: var(--rule-w, 100%); height: 1px;
  background: var(--rim-soft);
  pointer-events: none;
}
.proj-parallax-header.proj-head-rule { background: none; }
.proj-parallax-header.proj-head-rule::before { content: none; }

/* Parallax section - title + text pinned in the left column, naturally scrolling right column */
.proj-section.is-parallax { position: relative; }
.proj-parallax-header {
  position: static;
  z-index: 2;
  background: var(--atmos, var(--ground)); /* tracks the atmospheric wash */
  margin-bottom: 1.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rim-soft);
}
/* Extend the sticky header's background up to viewport top so nothing
   from below can peek through the gap between page nav and header. */
.proj-parallax-header::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  bottom: 100%;
  height: 5rem;
  background: var(--atmos, var(--ground));
  pointer-events: none;
}
.proj-parallax-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  align-items: start;
}
.proj-parallax-left {
  min-width: 0;
  /* height: inline by JS at ≥960 - controls when sticky text releases. JS clears it on mobile. */
}
.proj-parallax-text {
  position: static;
  /* position becomes sticky and top set inline by JS at ≥960. JS clears top on mobile. */
}
/* Desktop: sticky header, text beside the media. Declared after the base
   rules so the cascade can't fold it back to one column. A marquee needs the
   full width, so sections with one stay stacked (the JS then skips pinning). */
@media (min-width: 960px) {
  .proj-section.is-parallax:not(:has(.proj-marquee)) .proj-parallax-media { margin-top: var(--head-h, 0px); }
  .proj-section.is-parallax:not(:has(.proj-marquee)) .proj-parallax-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 2.5rem;
  }
  .proj-section.is-parallax:not(:has(.proj-marquee)) .proj-parallax-text { position: sticky; }
}
.proj-parallax-text > p:first-of-type { margin-top: 0; }
.proj-parallax-media {
  display: flex;
  flex-direction: column;
  gap: 2rem;
  min-width: 0;
}
.proj-parallax-item { margin: 0; display: flex; flex-direction: column; gap: .65rem; }
.proj-parallax-item img,
.proj-parallax-item video {
  display: block; width: 100%;
  aspect-ratio: 16 / 9; object-fit: cover;
  background: var(--surface);
  border: 1px solid var(--rim-soft);
  border-radius: 4px;
}
/* images keep their natural height - never cropped */
.proj-parallax-item img { aspect-ratio: auto; height: auto; object-fit: contain; background: none; border: 0; }
.proj-parallax-item .proj-media-placeholder { aspect-ratio: 16 / 9; }
.proj-caption {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  text-transform: none; color: var(--muted);
}

/* A-vs-B comparison - same rim-gap grid language as .outcome-grid */
.proj-compare { margin: 1.5rem 0 2.5rem; max-width: 48rem; }
.proj-compare-grid {
  display: grid; grid-template-columns: 1fr; gap: 2px;
  background: var(--rim-soft);
}
.proj-compare-corner, .proj-compare-colhead { display: none; } /* head row is desktop-only */
.proj-compare-dim {
  background: var(--surface); padding: 1rem 1.25rem;
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  text-transform: none; color: var(--ink);
}
.proj-compare-cell {
  background: var(--surface); padding: 1.1rem 1.25rem;
  font-size: var(--fs-base); color: var(--ink-dim); line-height: var(--lh-text);
}
.proj-compare-cell-tag {
  display: block; font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none; color: var(--muted);
  margin-bottom: .35rem;
}
.proj-compare-note {
  font-size: var(--fs-base); color: var(--ink-dim); line-height: var(--lh-text);
  border-left: 2px solid var(--accent); padding-left: 1rem;
  margin: 1.5rem 0 0; max-width: 42rem;
}
@media (min-width: 720px) {
  .proj-compare-grid { grid-template-columns: minmax(0, .8fr) 1fr 1fr; align-items: stretch; }
  .proj-compare-corner {
    display: flex; flex-direction: column;
    background: var(--surface); padding: 1rem 1.25rem;
  }
  .proj-compare-corner-title { font-weight: var(--fw-regular); color: var(--ink); font-size: var(--fs-base); }
  .proj-compare-colhead {
    display: flex; flex-direction: column; gap: .25rem;
    background: var(--surface); padding: 1rem 1.25rem;
  }
  .proj-compare-col-title { font-weight: var(--fw-regular); color: var(--ink); font-size: var(--fs-base); }
  .proj-compare-col-label {
    font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
    text-transform: none; color: var(--muted);
  }
  .proj-compare-cell-tag { display: none; } /* column heads carry identity on desktop */
  .proj-compare-dim { display: flex; align-items: center; }
}

/* User Flows - article versioning diagram, themed */
.uf-svg { width: 100%; height: auto; display: block; }
.uf-lane-rect {
  fill: none; stroke: var(--accent);
  stroke-width: 1.5; stroke-dasharray: 6 5;
  opacity: .55;
}
.uf-lane-title {
  font-family: var(--ff-display);
  font-weight: var(--ff-display-weight, 900); font-size: var(--fs-display);
  fill: var(--accent);
  letter-spacing: var(--ls-base);
}
.uf-lane-note {
  font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); letter-spacing: var(--ls-base);
  fill: var(--muted);
}
.uf-node {
  fill: var(--surface-2);
  stroke: var(--accent);
  stroke-width: 1.5;
}
.uf-node-title {
  font-family: var(--ff-display);
  font-weight: var(--fw-regular); font-size: var(--fs-base);
  fill: var(--ink);
}
.uf-node-status {
  font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); letter-spacing: var(--ls-base);
  fill: var(--ink-dim);
}
.uf-decision {
  fill: color-mix(in oklab, var(--accent) 18%, transparent);
  stroke: var(--accent);
  stroke-width: 1.5;
}
.uf-decision-label {
  font-family: var(--ff-body);
  font-size: var(--fs-base); font-weight: var(--fw-regular);
  fill: var(--ink);
}
.uf-start-oval {
  fill: color-mix(in oklab, var(--accent) 16%, transparent);
  stroke: var(--accent);
  stroke-width: 1.5;
}
.uf-start-label {
  font-family: var(--ff-display);
  font-size: var(--fs-base); font-weight: var(--fw-regular);
  fill: var(--ink);
}
.uf-helper {
  font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); letter-spacing: var(--ls-base);
  fill: var(--ink-dim);
}
.uf-arrow-path {
  fill: none; stroke: var(--ink-dim);
  stroke-width: 1.5;
}
.uf-arrow-path-x {
  fill: none; stroke: var(--ink-dim);
  stroke-width: 1.5;
}
.uf-arrow-head { fill: var(--ink-dim); }
.uf-flow-label-box {
  fill: rgba(112, 128, 144, .14);
  stroke: rgba(112, 128, 144, .28);
  stroke-width: 1;
}
.uf-flow-label-text {
  font-family: var(--ff-mono); font-weight: var(--fw-mono);
  font-size: var(--fs-base); letter-spacing: var(--ls-base);
  fill: var(--muted);
}
.uf-dot { stroke: none; }
.uf-dot.uf-on  { fill: var(--accent); }
.uf-dot.uf-off { fill: var(--muted); }

/* Inline interactive grid demo - styled with portfolio tokens.
   Model: five breakpoints, a grid capped at 1920, left panels that either
   overlay (Agent view) or push (CM view), and a right panel with rail /
   hover / pinned states. Everything on the stage is laid out in % of the
   simulated viewport so it stays responsive at any column width. */
#proj-grid-demo {
  font-family: var(--ff-body);
  color: var(--ink);
  font-size: var(--fs-base); line-height: var(--lh-text);
  padding: 1.5rem;
  border: 1px solid var(--rim-soft);
  border-radius: 4px;
  background: var(--surface);
}
#proj-grid-demo * { box-sizing: border-box; }

#proj-grid-demo .grid-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: .5rem; margin-bottom: 1.5rem;
}
#proj-grid-demo .grid-stat {
  padding: .7rem .75rem;
  border: 1px solid var(--rim-soft);
  border-radius: 4px;
  background: var(--surface-2);
  min-width: 0;
}
#proj-grid-demo .grid-stat-label {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none;
  color: var(--muted); margin: 0 0 .4rem; white-space: nowrap;
}
#proj-grid-demo .grid-stat-val {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  font-variant-numeric: tabular-nums;
  color: var(--ink); margin: 0; white-space: nowrap;
}
#proj-grid-demo .grid-stat-val small { color: var(--muted); font-size: .85em; }

/* Stage */
#proj-grid-demo .grid-stage {
  width: 100%; max-width: 800px; margin: 0 auto 1.25rem;
  border: 1px solid var(--rim-soft); border-radius: 4px;
  background: var(--surface-2); overflow: hidden;
}
#proj-grid-demo .grid-header {
  position: relative; height: 26px; background: var(--rim);
  border-bottom: 1px solid var(--rim-soft);
}
#proj-grid-demo .grid-header::before, #proj-grid-demo .grid-header::after {
  content: ''; position: absolute; top: 9px; height: 8px; border-radius: 2px;
  background: color-mix(in oklab, var(--ink) 22%, transparent);
}
#proj-grid-demo .grid-header::before { left: 3.3%; width: 9%; }
#proj-grid-demo .grid-header::after  { right: 3.3%; width: 14%; }
#proj-grid-demo .grid-body { position: relative; height: 240px; background: var(--surface-2); overflow: hidden; }
#proj-grid-demo .grid-body > * { position: absolute; top: 0; height: 100%; }

/* Empty margin beyond the 1920 cap */
#proj-grid-demo .gd-cap {
  background: repeating-linear-gradient(-45deg, transparent 0 7px, var(--rim-soft) 7px 8px);
  transition: left .45s var(--expo), width .45s var(--expo);
}

/* Grid container (centred inside the content area) */
#proj-grid-demo .grid-container {
  background: var(--surface);
  transition: left .45s var(--expo), width .45s var(--expo);
}
#proj-grid-demo .grid-container > * { position: absolute; top: 0; height: 100%; }
#proj-grid-demo .grid-margin { background: color-mix(in oklab, var(--accent) 18%, transparent); }
#proj-grid-demo .grid-cols { display: flex; }
#proj-grid-demo .grid-col { background: var(--rim-soft); height: 100%; flex: none; }
#proj-grid-demo .grid-gutter { height: 100%; flex: none; }

/* Content skeleton - what the article/page occupies inside the grid */
#proj-grid-demo .gd-content { pointer-events: none; }
#proj-grid-demo .gd-content i {
  position: absolute; left: 0; display: block; border-radius: 2px;
  background: color-mix(in oklab, var(--ink) 9%, transparent);
}
#proj-grid-demo .gd-content .gd-title { top: 14px; height: 9px; width: 28%; }
#proj-grid-demo .gd-content .gd-line  { top: 31px; height: 5px; width: 62%; opacity: .7; }
#proj-grid-demo .gd-content .gd-block { top: 50px; bottom: 16px; width: 100%; }

/* Panels - left = accent family, right = sky family */
#proj-grid-demo .gd-panel span {
  position: absolute; top: 6px; left: 6px; max-width: calc(100% - 12px);
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: 10px; line-height: 1.3;
  letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--ink-dim);
}
#proj-grid-demo .gd-left.gd-push {
  background: color-mix(in oklab, var(--accent) 30%, var(--surface));
  border-right: 1.5px solid var(--accent);
  transition: width .45s var(--expo);
  z-index: 1;
}
#proj-grid-demo .gd-left.gd-overlay {
  background: color-mix(in oklab, var(--accent) 34%, var(--surface));
  border-right: 1px solid color-mix(in oklab, var(--accent) 70%, transparent);
  box-shadow: 10px 0 28px rgba(0,0,0,.28);
  opacity: .94;
  z-index: 4;
}
#proj-grid-demo .gd-right {
  background: color-mix(in oklab, var(--accent-sky) 24%, var(--surface));
  border-left: 1px solid color-mix(in oklab, var(--accent-sky) 60%, transparent);
}
#proj-grid-demo .gd-right.gd-push {
  z-index: 1;
  transition: left .45s var(--expo), width .45s var(--expo);
}
#proj-grid-demo .gd-right.gd-overlay {
  z-index: 4; opacity: .94;
  box-shadow: -10px 0 28px rgba(0,0,0,.28);
}
#proj-grid-demo .gd-right.gd-full { z-index: 4; border-left: none; }

/* Controls */
#proj-grid-demo .bp-pill {
  display: inline-flex; align-items: center;
  padding: .35rem .9rem;
  border-radius: 999px;
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); font-weight: var(--fw-regular);
  background: var(--surface-2);
  color: var(--ink-dim);
  border: 1px solid var(--rim-soft);
}
#proj-grid-demo .controls-row {
  display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;
  margin-top: 1.1rem;
}
#proj-grid-demo .controls-row.sub { margin-top: .6rem; }
#proj-grid-demo .controls-row label {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none;
  color: var(--muted); min-width: 100px;
}
#proj-grid-demo .controls-row.sub label { color: var(--ink-dim); padding-left: 1rem; }
#proj-grid-demo input[type="range"] {
  flex: 1 1 200px; min-width: 200px;
  accent-color: var(--accent);
}
#proj-grid-demo .gd-out {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); color: var(--ink-dim);
  font-variant-numeric: tabular-nums; min-width: 56px; text-align: right;
}
#proj-grid-demo .gd-hint {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); color: var(--muted);
}

#proj-grid-demo .pill-toggle { display: inline-flex; gap: .6rem; flex-wrap: wrap; }
#proj-grid-demo .pill-toggle button {
  padding: .55rem 1.1rem;
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  border: 1px solid var(--rim-soft);
  background: transparent;
  border-radius: 999px; cursor: pointer;
  color: var(--ink-dim);
  transition: color .2s, border-color .2s, background .2s;
}
#proj-grid-demo .pill-toggle button:hover:not(.active):not(:disabled) {
  background: var(--surface-2); color: var(--ink);
}
#proj-grid-demo .pill-toggle button.active {
  color: var(--ink); border-color: var(--accent);
  background: var(--accent-lo);
}
#proj-grid-demo .pill-toggle button:disabled { opacity: .4; cursor: not-allowed; }

#proj-grid-demo .bp-jump { display: inline-flex; gap: .6rem; flex-wrap: wrap; }
#proj-grid-demo .bp-jump button.bp-pill {
  cursor: pointer; appearance: none;
  padding: .45rem 1.05rem;
  background: var(--surface-2); color: var(--ink-dim);
  border: 1px solid var(--rim-soft);
  transition: color .2s, border-color .2s, background .2s, transform .12s;
}
#proj-grid-demo .bp-jump button.bp-pill:hover {
  color: var(--ink); background: var(--surface); transform: translateY(-1px);
}
#proj-grid-demo .bp-jump button.bp-pill.active {
  color: var(--ink); border-color: var(--accent);
  background: var(--accent-lo);
}

/* Live explanation of the rule in effect */
#proj-grid-demo .gd-readout {
  margin: 1.25rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rim-soft);
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); line-height: 1.6; color: var(--ink-dim);
  min-height: 3.2em;
}
#proj-grid-demo .gd-readout b { color: var(--ink); font-weight: var(--fw-mono); }
.grid-demo-figure { margin: 2rem 0 2.5rem; }

/* Split layout - body text next to a single image (e.g. Responsive Grid section) */
.proj-split {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  align-items: start;
  margin-bottom: 1.5rem;
}
.proj-split-text > p:first-child { margin-top: 0; }
/* Opt-in two columns (sideBySide: true) - text beside the media from 960px up.
   Declared after the base rule so the cascade can't fold it back to one column. */
@media (min-width: 960px) {
  .proj-split.is-cols {
    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    gap: 2.5rem;
  }
  .proj-split.is-cols .proj-split-text { position: sticky; top: 6rem; }
  /* title rides in the text column: pin at the top, drop the media by the title's height */
  .proj-split.is-cols.has-head .proj-split-text { top: 5rem; }
  /* mediaSplit: 'right' keeps the base text-left layout; 'left' puts the wider media column first */
  .proj-split.is-cols.is-media-left { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .proj-split.is-cols.has-head > :last-child { margin-top: var(--head-h, 0px); }
}
.proj-split-media { margin: 0; }
.proj-split > .proj-media { margin: 0; }
.proj-split-media img,
.proj-split-media video {
  display: block; width: 100%; height: auto;
  background: var(--surface);
  border: 1px solid var(--rim-soft); border-radius: 4px;
}
.proj-side-gallery {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  align-self: start;
}
.proj-side-gallery-frame { margin: 0; display: flex; flex-direction: column; gap: .65rem; }
.proj-side-gallery-frame img {
  display: block; width: 100%; height: auto;
  background: var(--surface);
  border: 1px solid var(--rim-soft); border-radius: 4px;
}
.proj-side-gallery-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 0 .25rem;
}
.proj-side-gallery-btn {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  padding: .35rem .9rem;
  border: 1px solid var(--rim-soft);
  background: transparent;
  color: var(--ink-dim);
  border-radius: 4px;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.proj-side-gallery-btn:hover {
  color: var(--ink);
  border-color: var(--rim);
  background: var(--surface-2);
}
.proj-side-gallery-dots { display: flex; gap: .5rem; align-items: center; }
.proj-side-gallery-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid var(--rim);
  background: transparent;
  padding: 0; cursor: pointer;
  transition: background .2s, border-color .2s, transform .12s;
}
.proj-side-gallery-dot:hover:not(.active) { background: var(--rim); }
.proj-side-gallery-dot.active {
  background: var(--accent);
  border-color: var(--accent);
}
/* Tabbed media - segmented control switching image + side text (e.g. Spark Components).
   The control sits at the top of the text column so text and image share one top edge. */
.proj-tabs { margin: 0 0 2.5rem; }
.proj-tabs-stage {
  display: grid; grid-template-columns: 1fr; gap: 1.5rem; align-items: start;
}
/* title spans both columns; the grid gap stands in for its usual margin */
.proj-tabs-stage > .proj-section-head { grid-column: 1 / -1; margin-bottom: 0; }
.proj-tabs.is-pinned .proj-tabs-stage { position: sticky; top: 5rem; } /* = STICKY_TOP */
.proj-tabs-seg {
  display: flex; width: fit-content; gap: 2px; padding: 3px;
  background: var(--surface);
  border: 1px solid var(--rim-soft); border-radius: 6px;
  margin-bottom: 1.5rem;
  max-width: 100%;
}
.proj-tabs-seg button {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base);
  flex: 1 1 auto; min-width: 0;
  padding: .45rem clamp(.5rem, 1.2vw, 1.1rem);
  border: 0; border-radius: 4px;
  white-space: nowrap;
  background: transparent; color: var(--ink-dim);
  cursor: pointer;
  transition: color .2s, background .2s;
}
.proj-tabs-seg button:hover:not([aria-selected="true"]) { color: var(--ink); background: var(--surface-2); }
/* Selected tab - sky signal, paired bg/text tokens keep AA contrast in both themes */
.proj-tabs-seg button[aria-selected="true"] {
  background: var(--accent-sky-bg); color: var(--accent-sky);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent-sky) 45%, transparent);
}
.proj-tabs-side > p:first-of-type, .proj-tabs-text > :first-child { margin-top: 0; }
.proj-tabs-side > p:last-of-type { margin-bottom: 1.75rem; }
.proj-tabs-text h3 { margin: 0 0 .75rem; }
.proj-tabs-media { margin: 0; }
@media (min-width: 960px) {
  .proj-tabs-stage { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 1.5rem 2.5rem; }
}
/* Problem rows - labeled rows + image placeholders (Problem section) */
.problem-rows { margin: 2rem 0 2.5rem; border-top: 1px solid var(--rim-soft); }
.problem-row {
  display: grid; grid-template-columns: 1fr;
  gap: 1rem; align-items: center;
  padding: 2rem 0;
  border-bottom: 1px solid var(--rim-soft);
}
.problem-row-label {
  font-family: var(--ff-display); font-weight: var(--ff-display-weight, 900);
  font-size: var(--fs-base); letter-spacing: var(--ls-base);
  color: var(--ink); margin: 0;
}
.problem-row-imgs { display: grid; gap: 1rem; grid-template-columns: 1fr; }
.problem-row-imgs[data-count="1"] .problem-placeholder,
.problem-row-imgs[data-count="1"] .problem-img { grid-column: 1; }
/* Desktop: label column + 2-up images. Declared after the base rules so the
   cascade can't fold it back to one column. */
@media (min-width: 960px) {
  .problem-row { grid-template-columns: 180px 1fr; gap: 2rem; }
  .problem-row-imgs { grid-template-columns: 1fr 1fr; }
  .problem-row-imgs[data-count="1"] .problem-placeholder,
  .problem-row-imgs[data-count="1"] .problem-img { grid-column: 2; }
}
.problem-img { margin: 0; }
.problem-img img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--rim-soft);
  border-radius: 4px;
  background: var(--surface);
}
.problem-placeholder {
  aspect-ratio: 16 / 10;
  background: var(--surface);
  border: 1px dashed var(--rim-soft);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base);
  letter-spacing: var(--ls-base); text-transform: none;
}
/* Subsections - used inside Admin Experience */
.proj-subsection {
  margin: 2.5rem 0 1rem;
  padding-top: 2rem;
  border-top: 1px dashed var(--rim-soft);
  scroll-margin-top: 6rem;
}
.proj-sub-title {
  font-family: var(--ff-display); font-weight: var(--fw-regular);
  font-size: var(--fs-base); letter-spacing: var(--ls-base); color: var(--ink);
  margin-bottom: .9rem;
}

/* Before / After comparison */
.proj-beforeafter {
  margin: 2rem 0 1rem;
  display: grid; grid-template-columns: 1fr; gap: 1.25rem;
}
.proj-beforeafter figure { margin: 0; display: flex; flex-direction: column; gap: .65rem; }
.proj-beforeafter img {
  width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover;
  background: var(--surface);
  border: 1px solid var(--rim-soft); border-radius: 4px;
}
.proj-beforeafter figcaption {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  text-transform: none; color: var(--ink-dim);
  display: flex; align-items: center; gap: .65rem;
}
.ba-tag {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  padding: .25rem .55rem; border-radius: 2px;
  background: var(--rim-soft); color: var(--ink-dim);
}
.ba-tag.after { background: var(--accent-lo); color: var(--accent); }

/* Before / After screen pairs - multiple paired rows of full, uncropped,
   zoomable screenshots (reuses .proj-media-item framing + lightbox). */
.proj-ba-pairs { margin: 2rem 0 2.5rem; display: flex; flex-direction: column; gap: 2rem; }
.proj-ba-pair { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
.proj-ba-pair figcaption.proj-caption {
  display: flex; align-items: center; gap: .65rem; text-transform: none;
}
@media (min-width: 720px) {
  .proj-ba-pair { grid-template-columns: 1fr 1fr; align-items: start; }
}

/* Placeholder sections (Outcome, Reflection) */
.proj-section.is-placeholder .proj-section-title {
  color: var(--muted);
}
.proj-placeholder {
  max-width: 42rem; padding: 1.5rem 1.75rem;
  border: 1px dashed var(--rim);
  border-radius: 4px; background: var(--surface);
}
.proj-placeholder p {
  color: var(--ink-dim); font-size: var(--fs-base); line-height: var(--lh-text); margin: 0;
}
.proj-placeholder p + p { margin-top: .8rem; }
.proj-placeholder-tag {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: var(--fs-base); letter-spacing: var(--ls-base);
  text-transform: none; color: var(--muted); margin-bottom: .9rem;
}

/* ─── Atmospheric background (project pages) ───────────────────────────
   A single full-bleed layer behind the whole case study whose colour is
   driven by scroll position (see the atmos effect in <Project>). As the
   reader moves through contextual regions, the page ground blends from
   CRT-black (or broadcast-white in light mode) toward a subtle Signal
   hue and back - a slow, low-saturation shift, never a hard band.

   It sits at z-index 0 inside the positioned .proj-page and every real
   child is lifted to z-index 1 so content always paints above it. Opaque
   cards / images (gallery, hero, next-project) keep their own surfaces
   and simply occlude the atmosphere locally, which is the intended read.

   No CSS transition here: the scroll handler sets the colour every frame,
   so the blend comes from position interpolation. Theme swaps are eased
   with a one-shot inline transition from the effect instead. */
.page.proj-page { position: relative; z-index: 0; }
.proj-atmos {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  background-color: var(--ground);
}
.page.proj-page > *:not(.proj-atmos) { position: relative; z-index: 1; }

/* ─── Flow viewer ──────────────────────────────────────────────────────
   The Help Center flow explorer. This is the one place in the site where
   all six bars appear at once - a categorical encoding where six
   distinguishable colours are the functional requirement. Kept honest by
   two rules: bars are strokes and 3-10% tints, never filled blocks; and
   no other section of the case study uses more than tomato + sky.

   Every colour below aliases an existing Signal token, so the diagram
   follows the mode switch for free. Butter is the single exception that
   needs a per-mode value. */
:root {
  --fv-tomato:  var(--accent);
  --fv-sky:     var(--accent-sky);
  --fv-sage:    var(--bar-sage);
  --fv-orchid:  var(--bar-orchid);
  --fv-indigo:  var(--bar-indigo);
  --fv-butter:  var(--butter-base);   /* dark: the bright butter is correct */
  --fv-neutral: var(--muted);         /* the shared save lane - deliberately achromatic */

  --fv-ink:         var(--ink);
  --fv-ink-2:       var(--ink-dim);
  --fv-ink-3:       var(--muted);
  --fv-line:        var(--rim);
  --fv-line-2:      color-mix(in oklab, var(--ink) 26%, var(--surface));
  --fv-surface:     var(--surface-2); /* opaque - labels stay crisp over the grain */
  --fv-surface-alt: var(--surface);
  --fv-bg:          var(--ground);
  --fv-edge:        var(--fv-line-2);
  --fv-dot:         transparent;      /* a dot grid over CRT black + grain is noise */
}
[data-theme="light"] {
  /* #F2D74E on broadcast white is ~1.4:1 - invisible. butter-400 clears
     3:1 for a graphical object (WCAG 1.4.11). Don't lighten it. */
  --fv-butter: var(--butter-400);
  --fv-dot:    color-mix(in oklab, var(--rim) 55%, transparent);
}

.fv-wrap { margin: .5rem 0 0; }
/* holds the section's height while the viewer is lifted into the dialog,
   so the page doesn't jump under the reader */
.fv-placeholder-slot {
  height: clamp(520px, 72vh, 720px);
  border: 1px dashed var(--fv-line); border-radius: 4px;
}
.fv {
  --fv-h: clamp(520px, 72vh, 720px);
  height: var(--fv-h);
  display: flex; flex-direction: column;
  border: 1px solid var(--fv-line);
  border-radius: 4px;
  background: transparent;            /* the grain reads through the empty space */
  overflow: hidden;
  margin: .5rem 0 .75rem;
}
.fv-bar, .fv-subbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: .75rem;
  padding: .45rem .8rem;
  border-bottom: 1px solid var(--fv-line);
  background: var(--fv-surface-alt);
}
.fv-subbar { min-height: 40px; flex-wrap: wrap; }
.fv-mark {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .58rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--fv-ink-3);
  border: 1px solid var(--fv-line-2); border-radius: 3px; padding: .25rem .45rem;
}
.fv-tabs { margin-left: auto; display: flex; gap: .25rem; }
.fv-tab {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .65rem; letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fv-ink-2); background: transparent;
  border: 1px solid transparent; border-radius: 3px;
  padding: .45rem .7rem; cursor: pointer; transition: color .2s, background .2s;
}
.fv-tab:hover { color: var(--fv-ink); background: var(--rim-soft); }
.fv-tab[aria-selected="true"] { background: var(--fv-ink); color: var(--fv-bg); }

.fv-crumb {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  font-size: .78rem; color: var(--fv-ink-2);
}
.fv-crumb button {
  font: inherit; color: var(--fv-ink-2); background: none; border: none;
  padding: 0; cursor: pointer;
}
.fv-crumb button:hover { color: var(--fv-ink); text-decoration: underline; }
.fv-crumb .fv-sep { color: var(--fv-ink-3); }
.fv-crumb .fv-cur { color: var(--fv-ink); display: flex; align-items: center; gap: .45rem; }
.fv-crumb .fv-sub { color: var(--fv-ink-3); font-size: .72rem; }
.fv-dot-sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

.fv-pills { display: flex; gap: .2rem; flex-wrap: wrap; }
.fv-pill {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .7rem; color: var(--fv-ink-2);
  background: transparent; border: 1px solid var(--fv-line);
  border-radius: 20px; padding: .3rem .6rem; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.fv-pill:hover { border-color: var(--fv-line-2); color: var(--fv-ink); }
.fv-pill[aria-current="true"] { border-color: var(--fv-ink); color: var(--fv-ink); background: var(--rim-soft); }
.fv-pill i { width: 7px; height: 7px; border-radius: 2px; display: block; }
.fv-select {
  display: none; font-family: var(--ff-body); font-size: .75rem;
  color: var(--fv-ink); background: var(--fv-surface);
  border: 1px solid var(--fv-line); border-radius: 4px; padding: .35rem .5rem;
}

.fv-tools { margin-left: auto; display: flex; align-items: center; gap: .35rem; }
.fv-tool {
  min-width: 28px; height: 28px; display: grid; place-items: center;
  border: 1px solid var(--fv-line); background: var(--fv-surface);
  border-radius: 4px; cursor: pointer; color: var(--fv-ink-2);
  font-family: var(--ff-body); font-size: .8rem; line-height: 1;
  transition: border-color .2s, color .2s;
}
.fv-tool:hover { border-color: var(--fv-line-2); color: var(--fv-ink); }
.fv-tool.is-wide { padding: 0 .55rem; font-size: .65rem; font-family: var(--ff-mono); font-weight: var(--fw-mono); letter-spacing: .06em; }
.fv-zoomval {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .65rem; color: var(--fv-ink-3);
  min-width: 40px; text-align: center;
}
.fv-divider { width: 1px; height: 18px; background: var(--fv-line); display: block; }

.fv-stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.fv-canvas { position: absolute; inset: 0; }
.fv-canvas svg { display: block; width: 100%; height: 100%; }
.fv-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--fv-dot) 1px, transparent 1px);
  background-size: 22px 22px;
}

/* ─── diagram primitives ─── */
.fv-node-shape { stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.fv-node-label { font: 500 12px var(--ff-body); fill: var(--fv-ink); pointer-events: none; }
.fv-edge-path  { fill: none; stroke: var(--fv-edge); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.fv-edge-path.is-dashed { stroke-dasharray: 4 4; }
.fv-edge-label { font: 500 9.5px var(--ff-mono); fill: var(--fv-ink-2); letter-spacing: .04em; }
.fv-edge-label-bg, .fv-knockout { fill: var(--fv-bg); }
.fv-arrow { fill: var(--fv-edge); }
.fv-node { cursor: pointer; }
.fv-node .fv-hit { fill: transparent; }
.fv-focus-ring { fill: none; stroke: none; pointer-events: none; }
.fv-node:focus { outline: none; }
.fv-node:focus-visible .fv-focus-ring { stroke: var(--focus-ring); stroke-width: 2; vector-effect: non-scaling-stroke; }
.fv-zone-label {
  font: 500 10px var(--ff-mono); letter-spacing: .1em; text-transform: uppercase;
  opacity: .85; pointer-events: none;
}
/* hover / focus trace - the active path restrokes to ink, which reads as
   "ink" in both modes and stays out of the bar palette's way */
.fv-diagram.is-focused .fv-node { opacity: .18; }
.fv-diagram.is-focused .fv-edge { opacity: .08; }
.fv-diagram.is-focused .fv-zone,
.fv-diagram.is-focused .fv-lane { opacity: .25; }
.fv-diagram.is-focused .fv-node.is-on,
.fv-diagram.is-focused .fv-edge.is-on { opacity: 1; }
.fv-diagram.is-focused .fv-edge.is-on .fv-edge-path { stroke: var(--fv-ink); stroke-width: 1.75; }
.fv-diagram.is-focused .fv-edge.is-on .fv-arrow { fill: var(--fv-ink); }
.fv-node.is-seed .fv-node-shape { stroke-width: 2.25; }
.fv-diagram .fv-node, .fv-diagram .fv-edge,
.fv-diagram .fv-zone, .fv-diagram .fv-lane { transition: opacity .12s ease; }

/* ─── system map ─── */
.fv-map { position: absolute; inset: 0; overflow: auto; padding: 1.5rem 1.25rem 2.25rem; }
.fv-map-inner { max-width: 1320px; margin: 0 auto; }
.fv-map-head { display: flex; align-items: flex-end; gap: 1.25rem; margin-bottom: 1.25rem; }
.fv-map-head h3 {
  font-family: var(--ff-display); font-weight: var(--ff-display-weight, 900);
  font-size: 1.15rem; letter-spacing: -.015em; color: var(--fv-ink); margin: 0 0 .3rem;
}
.fv-map-head p { font-size: .8rem; color: var(--fv-ink-2); margin: 0; line-height: 1.5; }
.fv-map-stats { margin-left: auto; display: flex; gap: 1.4rem; text-align: right; }
.fv-stat b {
  display: block; font-family: var(--ff-display);
  font-weight: var(--ff-display-weight, 900); font-size: 1.35rem;
  letter-spacing: -.02em; color: var(--fv-ink); line-height: 1.1;
}
.fv-stat span {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .58rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fv-ink-3);
}
.fv-entry {
  display: flex; align-items: center; gap: .75rem;
  padding: .8rem 1rem; margin-bottom: .25rem;
  border: 1.5px solid var(--fv-ink); border-radius: 4px;
  background: var(--fv-surface); font-weight: 600; font-size: .85rem; color: var(--fv-ink);
}
.fv-entry .fv-tag {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .55rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fv-ink-3);
  border: 1px solid var(--fv-line-2); padding: .18rem .4rem; border-radius: 3px;
}
.fv-stem { height: 20px; border-left: 1.5px dashed var(--fv-line-2); margin-left: 26px; }
.fv-cards { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
/* A card carries a colour bar, a name, and an honest silhouette. Nothing
   else. The map is where a reader decides whether to engage at all, and
   they are scanning, not reading - the hover is the whole affordance. */
.fv-card {
  position: relative; text-align: left; cursor: pointer;
  background: var(--fv-surface); border: 1px solid var(--fv-line);
  border-radius: 4px; padding: 0; overflow: hidden; font-family: inherit;
  transition: border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.fv-card:hover { border-color: var(--fv-line-2); transform: translateY(-3px); }
.fv-card .fv-accent { height: 3px; width: 100%; display: block; transition: height .14s ease; }
.fv-card:hover .fv-accent { height: 5px; }
.fv-card-body { padding: .85rem 1rem .6rem; display: flex; align-items: center; gap: .5rem; }
.fv-card h4 {
  font-family: var(--ff-display); font-weight: var(--ff-display-weight, 900);
  font-size: .95rem; letter-spacing: -.015em; color: var(--fv-ink); margin: 0;
  display: flex; align-items: center; gap: .5rem;
}
.fv-badge {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .5rem; letter-spacing: .08em;
  text-transform: uppercase; border: 1px solid var(--fv-line-2);
  color: var(--fv-ink-3); padding: .12rem .3rem; border-radius: 3px; font-weight: 400;
}
.fv-thumb {
  height: 150px; border-top: 1px solid var(--fv-line);
  background: var(--fv-surface-alt); padding: .6rem .5rem;
}
.fv-thumb svg { display: block; width: 100%; height: 100%; opacity: .72; transition: opacity .14s ease; }
.fv-card:hover .fv-thumb svg { opacity: 1; }
.fv-map-foot { margin-top: 1.4rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.fv-ghost {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .65rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--fv-ink-2);
  border: 1px solid var(--fv-line-2); background: var(--fv-surface);
  padding: .55rem .8rem; border-radius: 4px; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.fv-ghost:hover { border-color: var(--fv-ink-3); color: var(--fv-ink); }

/* ─── legend + hint ───
   Both live in a footer strip rather than floating over the canvas: an
   overlay legend this wide occludes the bottom rank of the diagram, and
   the fit() padding then has to guess at its height. */
.fv-foot {
  flex: 0 0 auto; display: flex; align-items: center; gap: .75rem;
  flex-wrap: wrap; padding: .3rem .8rem;
  border-top: 1px solid var(--fv-line); background: var(--fv-surface-alt);
}
.fv-legend { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; }
.fv-legend .fv-lg { display: flex; align-items: center; gap: .28rem; font-size: .6rem; color: var(--fv-ink-2); }
.fv-legend svg { display: block; }
.fv-legend .fv-divider { height: 16px; }
.fv-legend .fv-ttl {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .53rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fv-ink-3);
}
.fv-legend-toggle { display: none; }
.fv-hint {
  margin-left: auto; font-size: .6rem; color: var(--fv-ink-3);
  white-space: nowrap;
}
.fv-hint kbd {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .58rem;
  border: 1px solid var(--fv-line-2); border-bottom-width: 2px;
  border-radius: 3px; padding: 0 .2rem; color: var(--fv-ink-2);
}
/* top-right, not centred - a centred chip lands on the first rank of an
   LR graph and reads as part of the diagram */
.fv-armed {
  position: absolute; right: 12px; top: 10px; z-index: 5;
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .58rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--fv-ink-3);
  background: color-mix(in oklab, var(--fv-bg) 90%, transparent);
  border: 1px solid var(--fv-line); border-radius: 20px; padding: .25rem .6rem;
  pointer-events: none;
}

/* ─── step list (small screens + the text alternative) ─── */
.fv-steps { position: absolute; inset: 0; overflow: auto; padding: 1.25rem 1.1rem 2rem; }
.fv-steps ol { list-style: none; counter-reset: fv; max-width: 46rem; margin: 0 auto; }
.fv-steps li {
  counter-increment: fv; position: relative;
  padding: .6rem 0 .6rem 2.2rem; border-bottom: 1px solid var(--rim-soft);
}
.fv-steps li::before {
  content: counter(fv); position: absolute; left: 0; top: .65rem;
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .6rem; color: var(--fv-ink-3);
}
.fv-steps .fv-step-label { font-size: .85rem; color: var(--fv-ink); }
.fv-steps .fv-step-kind {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .55rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--fv-ink-3); margin-left: .5rem;
}
.fv-steps .fv-step-out { display: block; font-size: .72rem; color: var(--fv-ink-2); margin-top: .2rem; }
.fv-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ─── full-viewport dialog ─── */
/* inset from the viewport edges so it reads as a panel, not a cut-off page */
dialog.fv-dialog {
  --fv-inset: clamp(12px, 3vw, 40px);
  position: fixed; inset: var(--fv-inset);
  width: auto; height: auto; max-width: none; max-height: none;
  margin: 0; padding: 0;
  border: 1px solid var(--fv-line, var(--rim)); border-radius: 8px; overflow: hidden;
  background: var(--fv-bg); color: var(--ink);
  box-shadow: 0 24px 64px rgba(0, 0, 0, .35);
}
dialog.fv-dialog::backdrop { background: color-mix(in oklab, var(--ground) 88%, transparent); }
dialog.fv-dialog .fv { --fv-h: 100%; border: none; border-radius: 0; margin: 0; }

.fv-caption {
  font-family: var(--ff-mono); font-weight: var(--fw-mono); font-size: .65rem; letter-spacing: .06em;
  color: var(--muted); margin-top: .65rem;
}

/* 768-1023px - cards two-up, pills collapse to a select, legend folds away */
@media (max-width: 1023px) {
  .fv-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fv-pills { display: none; }
  .fv-select { display: block; }
  .fv-legend { display: none; }
  .fv-legend.is-open { display: flex; }
  .fv-legend-toggle { display: inline-grid; }
  .fv-hint { display: none; }
  .fv-foot:not(:has(.fv-legend.is-open)) { padding: 0; border-top: none; }
}
/* <768px - a pan/zoom canvas is a bad experience on a phone. The map still
   ships with real thumbnails; the detail view becomes the step list. */
@media (max-width: 767px) {
  .fv { --fv-h: clamp(440px, 78vh, 620px); }
  .fv-cards { grid-template-columns: 1fr; }
  .fv-map-stats { display: none; }
  .fv-map-head { flex-direction: column; align-items: flex-start; }
  .fv-tools .fv-tool.fv-zoom-tool, .fv-zoomval { display: none; }
  .fv-legend-toggle { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .fv-diagram .fv-node, .fv-diagram .fv-edge,
  .fv-diagram .fv-zone, .fv-diagram .fv-lane,
  .fv-card, .fv-card .fv-accent, .fv-thumb svg { transition: none; }
}


/* ─── Marquee - endless slow strip of frames (see ProjectMarquee) ─── */
.proj-marquee {
  /* --mq-lift: headroom inside the clip so a hovered (scaled-up) frame isn't cut off;
     the matching negative margin keeps the strip's footprint exactly as before. */
  --mq-lift: 22px;
  position: relative; overflow: hidden;
  margin: calc(2rem - var(--mq-lift)) 0; padding: var(--mq-lift) 0;
  contain: inline-size; width: 100%; /* never let the long track widen the column */
  outline: none;
}
.proj-marquee-track {
  display: flex; gap: 1.5rem; width: max-content;
  animation: proj-marquee-slide 60s linear infinite;
  /* runs left to right: the screens' features sit on their right side, so
     a frame shows its right edge first as it enters from the left */
  animation-direction: reverse;
}
.proj-marquee:hover .proj-marquee-track,
.proj-marquee:focus-within .proj-marquee-track { animation-play-state: paused; }
@keyframes proj-marquee-slide {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(-50% - .75rem)); }
}
.proj-marquee-item {
  flex: 0 0 auto; position: relative;
  transition: transform .5s var(--expo), opacity .35s ease, filter .35s ease;
}
/* Hover focus: the hovered frame grows a little (transform only - nothing reflows,
   it may overlap its neighbours) and the rest of the strip dims back. */
@media (hover: hover) {
  .proj-marquee-item:hover { transform: scale(1.07); z-index: 2; }
  .proj-marquee-track:has(.proj-marquee-item:hover) .proj-marquee-item:not(:hover) {
    opacity: .35; filter: saturate(.6);
  }
}
.proj-marquee-frame {
  height: 340px; border-radius: 4px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--rim-soft);
}
/* fixed height, natural width - frames follow each image's proportions, never crop */
.proj-marquee-frame img { display: block; height: 100%; width: auto; }
/* image frames carry no box of their own, so transparent areas show the page */
.proj-marquee-frame:not(.is-video),
.proj-marquee-frame:not(.is-video) img { background: none; border: 0; border-radius: 0; }
/* video frames: 16:9 at the same height (videos load lazily, so they can't size the frame) */
.proj-marquee-frame.is-video { aspect-ratio: 16 / 9; }
.proj-marquee-frame.is-video video {
  display: block; width: 100%; height: 100%; object-fit: cover; cursor: zoom-in;
}
/* typed caption: one line, a zero-width space holds its height while empty,
   a caret shows while it types */
.proj-marquee-cap { white-space: nowrap; will-change: transform; }
.proj-marquee-cap::before { content: '\200b'; }
.proj-marquee-cap.is-typing .mq-type::after {
  content: ''; display: inline-block; width: 1px; height: 1em; margin-left: 2px;
  vertical-align: -.15em; background: currentColor;
}
/* in a parallax media column the strip is the column item itself */
.proj-parallax-media > .proj-marquee { margin: calc(-1 * var(--mq-lift)) 0; }
@media (max-width: 639px) {
  .proj-marquee-frame { height: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  .proj-marquee { overflow-x: auto; }
  .proj-marquee-track { animation: none; }
  .proj-marquee-item, .proj-marquee-item:hover { transition: opacity .35s ease; transform: none; }
}

/* ═══ M3 layout (opt-in experiment) ═══════════════════════════════════════
   Switched on site-wide by data-layout="m3" on <html>; everything below
   re-lays the site to Material 3's layout guidance:
   m3.material.io/foundations/layout. Remove the attribute to switch it off.

     breakpoints  compact <600 · medium 600-839 · expanded 840-1199
                  large 1200-1599 · extra-large 1600+
     margins      16 compact, 24 everywhere else (--pad-x is the margin,
                  so nav, back link, hero, rail and footer share one ruler);
                  the content pane adds its own inner margin on top -
                  8 / 24 / 40 / 72 (--m3-content-x minus the margin), growing
                  past that so the content never exceeds --m3-content-max
     spacer       24 between panes
     grid         4 / 8 / 12 columns
     panes        one content pane; the Contents list is the rail region -
                  hidden (show/hide) below expanded, a standard expanded
                  navigation rail from 840 up
     spacing      8dp scale (space100 = 8px), larger steps on larger windows
     type         M3 baseline type scale, roles mapped onto our two faces
     shape        a step under M3's own scale - 8 / 12 / 16, no full pills
   ───────────────────────────────────────────────────────────────────── */
html[data-layout="m3"] {
  --pad-x: 16px;               /* margin */
  /* content margin ruler - M3 lets margin rulers move inward for more
     negative space; the hero and its media keep the standard margin */
  --m3-content-x: 24px;
  /* widest the pane's content gets: two ~60-character columns + a spacer.
     Past it the pane's inner margins grow instead of the content */
  --m3-content-max: 1120px;
  --m3-spacer: 24px;           /* space between panes */
  --m3-gap: 16px;              /* gap between grid columns + cards */
  --m3-cols: 4;
  --m3-section-gap: 48px;      /* space600 - between sections */
  --m3-head-gap: 16px;         /* section title -> its content */
  --m3-bar-h: 64px;            /* app bar */
  --m3-rail-w: 220px;          /* expanded navigation rail (min width) */
  --m3-measure: 34em;          /* ~60 characters a line at Body Large */
  --m3-r-sm: 8px;
  --m3-r-md: 12px;
  --m3-r-lg: 16px;
}
@media (min-width: 600px) {
  html[data-layout="m3"] { --pad-x: 24px; --m3-content-x: 48px; --m3-gap: 24px; --m3-cols: 8; --m3-section-gap: 64px; --m3-head-gap: 24px; }
}
@media (min-width: 840px)  { html[data-layout="m3"] { --m3-cols: 12; --m3-content-x: 64px; } }
@media (min-width: 1200px) { html[data-layout="m3"] { --m3-section-gap: 72px; --m3-content-x: 96px; } }

/* Body Large is the default text style */
html[data-layout="m3"] body { font-size: 16px; line-height: 24px; letter-spacing: .5px; }

/* ── Bar: top app bar, 64 high, title on the margin ruler ── */
html[data-layout="m3"] nav.top,
html[data-layout="m3"] nav.top.compact { min-height: var(--m3-bar-h); padding: 0 var(--pad-x); }
html[data-layout="m3"] .nav-logo { font-size: 22px; line-height: 28px; letter-spacing: 0; }
html[data-layout="m3"] .nav-links a { font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; }
/* expanded and up keep the destinations in the bar; below that, the menu */
@media (min-width: 840px) {
  html[data-layout="m3"] .nav-links,
  html[data-layout="m3"] .nav-actions { display: flex; }
  html[data-layout="m3"] .burger,
  html[data-layout="m3"] .mobile-menu { display: none; }
}

/* ── Hero ── */
html[data-layout="m3"] .back-btn {
  padding: calc(var(--m3-bar-h) + 24px) var(--pad-x) 0;
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
}
/* The hero sits in a filled container, like M3's own page headers; the
   hero media follows 8px below so the two read as one group */
html[data-layout="m3"] .proj-hero { min-height: 0; padding: 24px var(--pad-x) 8px; }
html[data-layout="m3"] .proj-hero-inner {
  grid-template-columns: repeat(var(--m3-cols), minmax(0, 1fr));
  gap: 32px var(--m3-gap); align-items: end;
  padding: 24px;
  background: var(--surface);
  border-radius: var(--m3-r-lg);
}
html[data-layout="m3"] .proj-hero-inner > * { grid-column: 1 / -1; }
html[data-layout="m3"] .proj-eyebrow {           /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  margin-bottom: 16px;
}
html[data-layout="m3"] .proj-hero-title {        /* Display Small -> Medium -> Large */
  font-size: 36px; line-height: 44px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .proj-hero-title em {     /* Title Large -> Headline Small */
  display: block; margin-top: 8px;
  font-size: 22px; line-height: 28px; letter-spacing: 0;
}
html[data-layout="m3"] .proj-summary {           /* Body Large */
  margin-top: 24px; max-width: var(--m3-measure);
  font-size: 16px; line-height: 24px; letter-spacing: .5px;
}
html[data-layout="m3"] .proj-status-note {       /* Body Medium */
  margin-top: 16px; max-width: var(--m3-measure);
  font-size: 14px; line-height: 20px; letter-spacing: .25px;
}
html[data-layout="m3"] .proj-meta { gap: 16px; }
html[data-layout="m3"] .proj-meta .k {           /* Label Medium */
  font-size: 12px; line-height: 16px; font-weight: var(--fw-medium); letter-spacing: .5px;
  margin-bottom: 4px;
}
html[data-layout="m3"] .proj-meta .v { font-size: 14px; line-height: 20px; letter-spacing: .25px; }
@media (min-width: 600px) {
  html[data-layout="m3"] .proj-hero-inner { padding: 40px; }
}
@media (min-width: 840px) {
  html[data-layout="m3"] .proj-hero-inner { padding: 56px; }
  html[data-layout="m3"] .proj-hero-inner > :first-child { grid-column: span 8; }
  html[data-layout="m3"] .proj-hero-inner > .proj-meta   { grid-column: span 4; }
  html[data-layout="m3"] .proj-hero-title { font-size: 45px; line-height: 52px; }
  html[data-layout="m3"] .proj-hero-title em { font-size: 24px; line-height: 32px; }
}
@media (min-width: 1200px) {
  html[data-layout="m3"] .proj-hero-title { font-size: 57px; line-height: 64px; letter-spacing: -.25px; }
  html[data-layout="m3"] .proj-hero-title em { letter-spacing: 0; }
}

/* hero media spans the full width between the margins */
/* every hero type (contained, bare, placeholder) fills the width between
   the margins at its natural height - never shrunk to fit, never cropped */
html[data-layout="m3"] .proj-hero-image:is(.is-contained, .is-bare, .is-placeholder) { padding: 0 var(--pad-x); }
html[data-layout="m3"] .proj-hero-image:is(.is-contained, .is-bare) img {
  width: 100%; height: auto; max-height: none; object-fit: fill;
  border-radius: var(--m3-r-lg);
}
html[data-layout="m3"] .proj-hero-image.is-placeholder .proj-hero-ph { max-height: none; }

/* ── Panes: rail + one flexible content pane ── */
html[data-layout="m3"] .proj-content {
  grid-template-columns: minmax(0, 1fr);
  gap: var(--m3-spacer);
  padding: var(--m3-section-gap) var(--pad-x);
}
html[data-layout="m3"] .proj-sidebar { display: none; }
/* the pane sizes its own content - columns follow the pane, not the window */
html[data-layout="m3"] .proj-pane {
  container: pane / inline-size; min-width: 0;
  /* the content sits on the inset ruler; the rail stays on the margin.
     Once the pane outgrows --m3-content-max, the margins take up the rest
     (% padding resolves against the pane's grid area) */
  padding-inline: max(calc(var(--m3-content-x) - var(--pad-x)),
                      calc((100% - var(--m3-content-max)) / 2));
}
@media (min-width: 840px) {
  html[data-layout="m3"] .proj-content { grid-template-columns: var(--m3-rail-w) minmax(0, 1fr); }
  html[data-layout="m3"] .proj-sidebar { display: block; position: sticky; top: calc(var(--m3-bar-h) + 24px); }
}

/* Rail: expanded navigation rail items - 56 high, Label Large, active indicator */
html[data-layout="m3"] .sidebar-label {          /* Title Small */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  padding: 0 16px; margin-bottom: 8px;
}
html[data-layout="m3"] .sidebar-nav { gap: 0; }
html[data-layout="m3"] .sidebar-nav a {
  min-height: 56px; padding: 0 16px; border-radius: var(--m3-r-lg);
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  transition: color .25s, background .25s;
}
html[data-layout="m3"] .sidebar-nav a::before { content: none; }
/* grouped contents (e.g. Help Center): Title Small headers, indented items */
html[data-layout="m3"] .sidebar-group-label {
  display: flex; align-items: center; min-height: 40px; padding: 0 16px; margin-top: 8px;
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px;
  color: var(--muted);
}
html[data-layout="m3"] .sidebar-nav li.is-sub { padding-left: 16px; }
/* a long contents list scrolls inside the rail instead of running off-screen */
@media (min-width: 840px) {
  html[data-layout="m3"] .proj-sidebar {
    max-height: calc(100vh - var(--m3-bar-h) - 48px);
    overflow-y: auto; overscroll-behavior: contain;
    /* no visible scrollbar - it sat on top of the labels; the list still
       scrolls (wheel / trackpad / keyboard) and follows the active section */
    scrollbar-width: none;
  }
  html[data-layout="m3"] .proj-sidebar::-webkit-scrollbar { display: none; }
}
html[data-layout="m3"] .sidebar-nav a:hover { background: color-mix(in oklab, var(--ink) 8%, transparent); }
html[data-layout="m3"] .sidebar-nav a.active {
  color: var(--ink);
  background: color-mix(in oklab, var(--accent) 18%, transparent);
}

/* ── Sections: spacing groups, no divider lines ── */
html[data-layout="m3"] .proj-section { margin-bottom: var(--m3-section-gap); scroll-margin-top: calc(var(--m3-bar-h) + 24px); }
html[data-layout="m3"] .proj-pane > .proj-section:last-child { margin-bottom: 0; }
html[data-layout="m3"] .proj-section-head { margin-bottom: var(--m3-head-gap); padding-bottom: 0; border-bottom: 0; }
html[data-layout="m3"] .proj-head-rule::after { content: none; }
html[data-layout="m3"] .proj-section-eyebrow {   /* Label Large */
  font-size: 14px; line-height: 20px; font-weight: var(--fw-medium); letter-spacing: .1px; margin-bottom: 8px;
}
html[data-layout="m3"] .proj-section-title {     /* Headline Small -> Headline Medium */
  font-size: 24px; line-height: 32px; font-weight: var(--fw-regular); letter-spacing: 0;
}
html[data-layout="m3"] .proj-sub-title {         /* Title Large */
  font-size: 22px; line-height: 28px; font-weight: var(--fw-regular); letter-spacing: 0; margin-bottom: 8px;
}
html[data-layout="m3"] .proj-section p {         /* Body Large */
  font-size: 16px; line-height: 24px; letter-spacing: .5px;
  margin-bottom: 16px; max-width: var(--m3-measure);
}
@media (min-width: 840px) {
  html[data-layout="m3"] .proj-section-title { font-size: 28px; line-height: 36px; }
}

/* Cards: outlined, 1 -> 2 -> 3 across as the pane grows */
html[data-layout="m3"] .proj-cards { gap: var(--m3-gap); margin: 8px 0 0; }
html[data-layout="m3"] .proj-cards.is-2x2 { grid-template-columns: minmax(0, 1fr); }
html[data-layout="m3"] .proj-card { gap: 8px; padding: 16px; border-radius: var(--m3-r-md); }
html[data-layout="m3"] .proj-card-icon { width: 40px; height: 40px; margin-bottom: 8px; border-radius: var(--m3-r-md); }
html[data-layout="m3"] .proj-card-title {        /* Title Medium */
  font-size: 16px; line-height: 24px; font-weight: var(--fw-medium); letter-spacing: .15px;
}
html[data-layout="m3"] .proj-card-text {         /* Body Medium */
  font-size: 14px; line-height: 20px; letter-spacing: .25px; max-width: none; margin: 0;
}
@container pane (min-width: 600px) {
  html[data-layout="m3"] .proj-cards,
  html[data-layout="m3"] .proj-cards.is-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  html[data-layout="m3"] .proj-card { padding: 24px; }
}
@container pane (min-width: 840px) {
  html[data-layout="m3"] .proj-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Media: full pane width, natural height, 8px caption gap */
html[data-layout="m3"] .proj-media { margin: 24px 0 0; gap: 24px; }
html[data-layout="m3"] .proj-media-item { gap: 8px; }
html[data-layout="m3"] .proj-media-item img,
html[data-layout="m3"] .proj-media-item video,
html[data-layout="m3"] .proj-media-placeholder,
html[data-layout="m3"] .proj-split-media img { border-radius: var(--m3-r-md); }
html[data-layout="m3"] .proj-media-item.is-bare img { border-radius: 0; }
/* bare tab images drop the frame but keep the rounded corners */
html[data-layout="m3"] .proj-tabs-media.is-bare img { border-radius: var(--m3-r-md); }
html[data-layout="m3"] .proj-caption {           /* Body Small */
  font-size: 12px; line-height: 16px; letter-spacing: .4px;
}

/* Two-column splits: stacked until the pane reaches expanded width, then
   two equal columns with a 24 spacer. Tabs always stack - their media is
